# rules.yaml — 业务规则与依赖边（唯一数据源）
# 依赖语义：from 必须先于 to 执行（强）/ from 在某条件下依赖 to（条件）/ 互斥。
rules:
  - id: R001
    domain: 订单域
    context: CTX001
    name: 促销规则优先级
    type: 计算
    visibility: 显性
    description: "同时满足多个促销条件时，按 满减 > 折扣 > 优惠券 依次计算"
    priority: P0
    confidence: L4
    exec_order: 3
    evidence: [EVD-001]
    pending_questions:
      - "是否支持三种促销同时使用？（代码支持，业务规则文档未明确）"

  - id: R002
    domain: 订单域
    context: CTX001
    name: 订单金额约束
    type: 约束
    visibility: 显性
    description: "订单总额必须 >= 0，即使应用所有促销之后"
    priority: P0
    confidence: L5
    exec_order: 5
    evidence: [EVD-002]

  - id: R003
    domain: 订单域
    context: CTX001
    name: 库存校验
    type: 校验
    visibility: 显性
    description: "创建订单前必须校验库存，购买数量不能超过库存数量"
    priority: P0
    confidence: L5
    exec_order: 2
    evidence: [EVD-003]
    pending_questions:
      - "库存扣减时机是创建订单时还是支付成功后？（当前为创建时，合理性待确认）"

  - id: R004
    domain: 订单域
    context: CTX001
    name: 会员折扣叠加
    type: 计算
    visibility: 隐性
    description: "会员折扣可以与促销叠加使用"
    priority: P1
    confidence: L3
    exec_order: 4
    evidence: [EVD-004]
    pending_questions:
      - "是否存在会员折扣上限？（代码未发现，待确认）"

  - id: R005
    domain: 订单域
    context: CTX001
    name: 订单号唯一性
    type: 校验
    visibility: 显性
    description: "订单号全局唯一，使用 Redis INCR 生成"
    priority: P0
    confidence: L5
    exec_order: 1
    evidence: [EVD-005]
    pending_questions:
      - "Redis 故障时降级为 UUID 是否合理？（代码有降级逻辑，未确认）"

dependencies:
  - { from: R003, to: R001, type: 强, reason: "库存校验通过后才计算促销价格" }
  - { from: R001, to: R004, type: 条件, reason: "顾客是会员时，会员折扣在促销结果基础上计算" }
  - { from: R001, to: R002, type: 强, reason: "金额约束校验发生在促销计算之后" }
  - { from: R004, to: R002, type: 强, reason: "会员折扣叠加后需再次校验总金额" }
