button{min-width:44px;min-height:44px}
.app,.shell,main,.inner,.hero,.proto,.stage-wrap,.stage,.prototype-demo{min-width:0;max-width:100%}.stage{width:100%}.prototype-demo{overflow:auto}img,svg,canvas{max-width:100%}
:root{--ink:#202936;--nav:#222d39;--paper:#fff;--ground:#edf1f5;--line:#cbd3dc;--muted:#667487;--accent:#e4a91a;--teal:#16796f;--blue:#356f9f;--red:#a84d4d}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font:14px/1.55 "Microsoft YaHei UI",sans-serif}button,input,select,textarea{font:inherit;letter-spacing:0}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:3px solid #e4a91a66;outline-offset:2px}.app{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr)}header{display:flex;align-items:center;gap:12px;padding:0 18px;color:#fff;background:#19222d;border-bottom:3px solid var(--accent)}.mark{width:7px;height:27px;background:var(--accent)}.brand{font:700 16px Bahnschrift,"Microsoft YaHei UI"}.brand small{margin-left:9px;color:#aeb9c6;font-size:12px;font-weight:500}.count{margin-left:auto;font:12px Consolas}.menu{display:none;min-width:44px;min-height:44px;border:1px solid #687788;color:#fff;background:transparent}.shell{min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr)}aside{min-height:0;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;color:#c6d0db;background:var(--nav)}.side-head{padding:14px 13px 10px;border-bottom:1px solid #394552}.side-label{margin-bottom:8px;color:#8290a0;font-size:10px;font-weight:700;text-transform:uppercase}.search{width:100%;min-height:44px;padding:8px 9px;border:1px solid #495766;color:#fff;background:#18212b}.nav{overflow:auto;padding:7px}.nav button{width:100%;display:grid;grid-template-columns:34px 1fr;border:0;border-left:3px solid transparent;padding:8px;color:#c6d0db;background:transparent;text-align:left}.nav button:hover{background:#2b3745}.nav button.active{color:#17202a;background:var(--accent);font-weight:700}.num{font:11px Consolas;color:#8593a3}.en{display:block;color:#8190a0;font-size:10px;font-weight:400}.nav button.active .en{color:#6d4d04}.side-foot{padding:10px 13px;border-top:1px solid #394552;color:#8997a7;font-size:11px}main{min-width:0;overflow:auto;padding:24px 28px 44px}.inner{width:min(1160px,100%);margin:auto}.hero{display:flex;justify-content:space-between;gap:20px}.eyebrow{color:#8b6200;font:700 11px Consolas}.hero h1{margin:3px 0 5px;font:700 clamp(24px,3vw,34px)/1.2 Bahnschrift,"Microsoft YaHei UI"}.hero h1 small{color:var(--muted);font-size:.48em;font-weight:500}.summary{max-width:790px;margin:0;color:var(--muted)}.pager{display:flex;gap:6px}.btn{min-height:44px;padding:7px 12px;border:1px solid #b8c3ce;background:#fff;color:var(--ink)}.btn.primary,.btn.active{border-color:#a87906;background:var(--accent);font-weight:700}.btn.danger{border-color:#b36a6a;color:#8a3030}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.fact{padding:11px 13px;border:1px solid var(--line);border-left:4px solid var(--accent);background:#fff}.fact:nth-child(2){border-left-color:var(--teal)}.fact:nth-child(3){border-left-color:var(--blue)}.label{color:var(--muted);font-size:10px;font-weight:700}.value{margin-top:3px;font:700 12px Consolas,"Microsoft YaHei UI";overflow-wrap:anywhere}.proto{margin-top:14px;border:1px solid #bfc9d3;background:#fff;box-shadow:0 12px 32px #18202b1f}.proto-head{min-height:52px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px 7px 14px;border-bottom:1px solid var(--line);background:#f8fafc}.proto-head .hint{color:var(--muted);font-size:11px}.actions{margin-left:auto;display:flex;gap:6px}.stage-wrap{padding:14px;background:#e8edf2}.stage{position:relative;min-height:350px;overflow:auto;border:1px solid #aeb9c5;background:#f7f9fb;background-image:linear-gradient(#e6ebf0 1px,transparent 1px),linear-gradient(90deg,#e6ebf0 1px,transparent 1px);background-size:20px 20px;padding:16px}.prototype-state{min-height:42px;padding:10px 13px;border-top:1px solid var(--line);border-left:4px solid var(--teal);background:#e3f0eb;font:12px Consolas,"Microsoft YaHei UI"}.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.note{padding:13px 14px;border:1px solid var(--line);background:#fff}.note h2{margin:0 0 5px;font-size:13px}.note p{margin:0;color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:8px;border:1px solid var(--line);background:#eef2f5}.panel{padding:12px;border:1px solid #aeb9c5;background:#fff}.row{display:flex;gap:10px;align-items:flex-start}.col{display:grid;gap:8px}.grid{display:grid;gap:9px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:10px;border:1px solid #c5ced8;background:#fff}.item.active,.selected{border-color:#b17f05;background:#fff8df}.field{display:grid;gap:5px;min-width:150px}.field-label{color:var(--muted);font-size:11px}.field input,.field select,.field textarea,input,select,textarea{min-height:40px;padding:7px 9px;border:1px solid #aeb9c5;background:#fff}.status{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.table-scroll{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border:1px solid var(--line);text-align:left}th{background:#e7edf2}.canvas{position:relative;min-width:620px;min-height:290px;background:#eef2f5}.node{position:absolute;min-width:110px;padding:10px;border:1px solid #91a1b1;background:#fff}.badge{display:inline-block;padding:3px 7px;border:1px solid #aeb9c5;background:#fff;font-size:11px}.toast{position:fixed;z-index:100;right:16px;bottom:16px;padding:10px 13px;color:#fff;background:#202936;border-left:4px solid var(--accent);opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:760px){.app{grid-template-rows:54px 1fr}.brand small{display:none}.menu{display:block}.shell{display:block;position:relative}.shell>aside{position:absolute;inset:0 auto 0 0;z-index:20;width:min(88vw,300px);transform:translateX(-102%);transition:.2s}.shell>aside.open{transform:none;box-shadow:12px 0 30px #0005}main{height:100%;padding:16px 12px 32px}.hero{display:block}.pager{margin-top:12px}.facts,.notes,.grid.two,.grid.three{grid-template-columns:1fr}.stage-wrap{padding:8px}.stage{min-height:360px;padding:10px}.actions{width:100%;margin-left:0}.btn{min-width:44px}}
.business-task{display:grid;gap:10px;color:var(--ink)}.business-task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px;border:1px solid var(--line);background:#fff}.business-task-head h3{margin:0;font-size:15px}.business-task-head p{margin:2px 0 0;color:var(--muted);font-size:11px}.business-badge{padding:4px 7px;border:1px solid #9fabb7;background:#f4f7f9;font-size:10px;white-space:nowrap}.business-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.business-field{display:grid;gap:2px;padding:8px;border:1px solid var(--line);background:#fff}.business-label{color:var(--muted);font-size:10px}.business-decision{padding:9px 11px;border-left:4px solid var(--accent);background:#fff4d7}.business-success{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.business-error{padding:9px 11px;border-left:4px solid var(--red);background:#f6e7e7}.business-actions{display:flex;gap:7px;flex-wrap:wrap}.business-timeline{display:grid;gap:7px;padding:9px;border:1px solid var(--line);background:#fff}.business-timeline-item{display:grid;gap:1px;padding-left:9px;border-left:3px solid #aeb9c5}.business-timeline-item.done{border-color:var(--teal)}.business-timeline-item.error{border-color:var(--red)}.business-timeline-item span{color:var(--muted);font-size:10px}.business-system{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:10px}.business-kpis{display:grid;gap:8px}.business-kpi{padding:9px;border:1px solid var(--line);background:#fff}.business-kpi strong{display:block;font:700 18px Consolas}@media(max-width:760px){.business-grid,.business-system{grid-template-columns:1fr}}

.business-notice{display:grid;gap:2px;padding:9px 11px;border-left:4px solid #7d8a97;background:#f1f4f6}.business-notice span{color:var(--muted);font-size:11px}.business-warning{padding:9px 11px;border-left:4px solid #a87906;background:#fff4d7}.business-actions button{min-width:44px}.business-recovery{border-color:#8f6a0a;background:#fff8df;font-weight:700}@media(max-width:760px){.business-task-head{display:grid}.business-badge{width:max-content;max-width:100%;white-space:normal}}

</style></head><body><div class="app"><header><button class="menu" id="menu" type="button" aria-label="打开目录">目录</button><span class="mark"></span><div class="brand">数据模型 × 界面模式 <small>页面与低代码设计类原型手册</small></div><div class="count" id="count"></div></header><div class="shell"><aside id="side"><div class="side-head"><div class="side-label">08 · Low-code Design</div><input id="search" class="search" type="search" aria-label="搜索组件" placeholder="搜索组件名称或模型"></div><nav id="nav" class="nav" aria-label="组件目录"></nav><div class="side-foot">方向键切换 · Esc 收起目录</div></aside><main id="main" tabindex="-1"><div class="inner"><div class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="summary" id="summary"></p></div><div class="pager"><button class="btn" id="prev" type="button">上一项</button><button class="btn" id="next" type="button">下一项</button></div></div><div class="facts" id="facts"></div><section class="proto"><div class="proto-head"><strong>关键交互原型</strong><span class="hint">本组件拥有独立结构、动作和状态。</span><div class="actions"><button class="btn" id="reset" type="button">重置原型</button></div></div><section class="business-task" id="taskContext" hidden><div class="business-task-head"><div><h3>生产级任务场景</h3><p>先载入任务上下文，再完成组件主动作；异常与恢复路径用于评审边界。</p></div><span class="business-badge" id="taskLevel"></span></div><div class="business-grid" id="taskFields"></div><div class="business-notice business-warning"><strong>非理想场景</strong><span id="taskException"></span></div><div class="business-actions"><button class="btn primary" type="button" data-readiness-start>载入任务上下文</button><button class="btn danger" type="button" data-readiness-exception>注入非理想场景</button><button class="btn business-recovery" type="button" data-readiness-recovery>执行恢复动作</button></div><div class="business-grid"><div class="business-field"><span class="business-label">恢复方式</span><strong id="taskRecovery"></strong></div><div class="business-field"><span class="business-label">键盘路径</span><strong id="taskKeyboard"></strong></div></div><section class="business-system" id="systemReadiness" hidden><div><strong>职责边界</strong><ul id="systemResponsibilities"></ul><strong>跨模块时间线</strong><div class="business-timeline" id="systemTimeline"></div></div><div class="business-notice" id="systemCompensation"></div></section><div class="business-notice" id="readinessResult" role="status" aria-live="polite"></div></section><div class="stage-wrap"><div class="stage" id="stage"></div></div><div class="prototype-state" id="prototypeState" data-state="initial" aria-live="polite">初始状态</div></section><div class="notes" id="notes"></div></div></main></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>const categoryNumber = "08";
function workbench(ctx, title, ...children) { return ctx.el("div", { className: "demo col" }, ctx.el("h3", { text: title }), ...children); }
function state(ctx, text) { return ctx.el("div", { className: "status", text }); }
function renderPageDesigner(ctx) { const view = state(ctx, "画布：单列；组件 1"); const add = ctx.button("放置双栏容器", "page-place"); ctx.on(add, "click", () => { view.textContent = "画布：双栏；左栏表格，右栏详情"; ctx.setStatus("页面布局已改变", "layout:two-column"); }); ctx.stage.append(workbench(ctx, "页面布局设计", view, add)); return {}; }
function renderFormDesigner(ctx) { const fields = state(ctx, "字段：客户名称"); const add = ctx.button("放置金额字段", "form-place"); ctx.on(add, "click", () => { fields.textContent = "字段：客户名称、金额（数值/必填）"; ctx.setStatus("表单字段增至 2 个", "fields:2"); }); ctx.stage.append(workbench(ctx, "表单设计", fields, add)); return {}; }
function renderReportDesigner(ctx) { const axes = state(ctx, "维度：月份；度量：销售额"); const add = ctx.button("添加地区维度", "report-dimension"); ctx.on(add, "click", () => { axes.textContent = "维度：地区 > 月份；度量：销售额"; ctx.setStatus("报表维度增至 2 个", "dimensions:2"); }); ctx.stage.append(workbench(ctx, "报表维度与度量", axes, add)); return {}; }
function renderDashboardDesigner(ctx) { const widgets = state(ctx, "组件：销售额卡片"); const bind = ctx.button("绑定趋势图数据", "dashboard-bind"); ctx.on(bind, "click", () => { widgets.textContent = "销售额卡片 + 月度趋势图（12 点）"; ctx.setStatus("仪表盘组件增至 2 个", "widgets:2"); }); ctx.stage.append(workbench(ctx, "仪表盘", widgets, bind)); return {}; }
function renderMobilePageDesigner(ctx) { const phone = state(ctx, "设备 390×844；安全区可见"); const add = ctx.button("添加底部操作栏", "mobile-bar"); ctx.on(add, "click", () => { phone.textContent = "底栏已吸附于安全区上方，主内容可滚动"; ctx.setStatus("移动安全区布局完成", "mobile:safe-bar"); }); ctx.stage.append(workbench(ctx, "移动页设计", phone, add)); return {}; }
function renderDataSourceDesigner(ctx) { const connection = state(ctx, "连接 CRM：未测试"); const test = ctx.button("测试连接", "source-test"); ctx.on(test, "click", () => { connection.textContent = "CRM 连接成功；延迟 42ms；表 18"; ctx.setStatus("数据源连接成功", "source:connected"); }); ctx.stage.append(workbench(ctx, "数据源连接", connection, test)); return {}; }
function renderEventDesigner(ctx) { const chain = state(ctx, "onSubmit → validate"); const append = ctx.button("追加 sendRequest", "event-add"); ctx.on(append, "click", () => { chain.textContent = "onSubmit → validate → sendRequest"; ctx.setStatus("事件链增至 3 步", "events:3"); }); ctx.stage.append(workbench(ctx, "事件链", chain, append)); return {}; }
function renderActionDesigner(ctx) { const config = state(ctx, "动作：打开页面；route 未配置"); const configure = ctx.button("配置客户详情路由", "action-config"); ctx.on(configure, "click", () => { config.textContent = "打开 /customer/:id，参数 id={{record.id}}"; ctx.setStatus("动作参数已配置", "action:configured"); }); ctx.stage.append(workbench(ctx, "动作参数", config, configure)); return {}; }
function renderExpressionDesigner(ctx) { const expression = ctx.el("input", { value: "amount > 10000", "aria-label": "可见性表达式" }); const out = state(ctx, "amount=12000"); const test = ctx.button("测试表达式", "expression-run"); ctx.on(test, "click", () => { out.textContent = "结果 true；组件可见"; ctx.setStatus("表达式测试为 true", "expression:true"); }); ctx.stage.append(workbench(ctx, "表达式测试", expression, out, test)); return {}; }
function renderThemeDesigner(ctx) { const tokens = state(ctx, "--brand: #356f9f"); const change = ctx.button("切换高对比主题", "theme-switch"); ctx.on(change, "click", () => { tokens.textContent = "--brand: #0b57d0；--surface: #ffffff；对比度 7.2"; ctx.setStatus("高对比主题已应用", "theme:contrast"); }); ctx.stage.append(workbench(ctx, "主题令牌", tokens, change)); return {}; }
function renderComponentBuilder(ctx) { const api = state(ctx, "Props: title；Slots: default"); const add = ctx.button("添加 loading 属性", "component-prop"); ctx.on(add, "click", () => { api.textContent = "Props: title, loading；事件: retry"; ctx.setStatus("组件 API 已扩展", "component:loading"); }); ctx.stage.append(workbench(ctx, "组件构建器", api, add)); return {}; }
function renderTemplateManager(ctx) { const template = state(ctx, "模板：客户详情 v3"); const instantiate = ctx.button("从模板实例化", "template-create"); ctx.on(instantiate, "click", () => { template.textContent = "已创建 页面-客户详情-副本；模板版本仍为 v3"; ctx.setStatus("模板实例已创建", "template:instantiated"); }); ctx.stage.append(workbench(ctx, "页面模板", template, instantiate)); return {}; }
function renderPageTree(ctx) { const tree = state(ctx, "应用 / 客户 / 客户详情"); const move = ctx.button("将客户详情移到销售下", "page-reparent"); ctx.on(move, "click", () => { tree.textContent = "应用 / 销售 / 客户详情；路由引用已更新"; ctx.setStatus("页面节点已重挂载", "tree:reparented"); }); ctx.stage.append(workbench(ctx, "页面树", tree, move)); return {}; }
function renderNavigationDesigner(ctx) { const route = state(ctx, "客户 → /customers"); const edit = ctx.button("修改为 /crm/customers", "nav-route"); ctx.on(edit, "click", () => { route.textContent = "客户 → /crm/customers；权限 crm.read"; ctx.setStatus("导航路由已更新", "route:/crm/customers"); }); ctx.stage.append(workbench(ctx, "导航设计", route, edit)); return {}; }
function renderResponsiveDesigner(ctx) { const preview = state(ctx, "Desktop 1440：三栏"); const mobile = ctx.button("切换 Mobile 390", "device-mobile"); ctx.on(mobile, "click", () => { preview.textContent = "Mobile 390：单栏；侧栏折叠；底部操作可达"; ctx.setStatus("设备预览切到移动端", "device:mobile"); }); ctx.stage.append(workbench(ctx, "响应式设计", preview, mobile)); return {}; }
function renderRuntimePreview(ctx) { const runtime = state(ctx, "设计数据未提交"); const submit = ctx.button("提交预览表单", "runtime-submit"); ctx.on(submit, "click", () => { runtime.textContent = "运行时校验通过；模拟记录 ID PREVIEW-1"; ctx.setStatus("运行时预览提交成功", "runtime:submitted"); }); ctx.stage.append(workbench(ctx, "运行时预览", runtime, submit)); return {}; }

function renderSchemaEditor(ctx) {
  const source = ctx.el("textarea", { rows: 6, "aria-label": "页面 Schema", value: "{\"type\":\"page\",\"children\":[]}" }); const lastValid = state(ctx, "上一个有效版本：page / 0 children"); const validate = ctx.button("校验 Schema", "schema-validate");
  ctx.on(validate, "click", () => { try { const value = JSON.parse(source.value); if (value.type !== "page") throw new Error(); lastValid.textContent = `有效：${value.type} / ${(value.children || []).length} children`; ctx.setStatus("Schema 校验通过", "schema:valid"); } catch { lastValid.textContent = "校验失败；保留上一个有效版本：page / 0 children"; ctx.setStatus("Schema 校验失败", "schema:error"); } }); ctx.stage.append(workbench(ctx, "Schema 与 last-valid", source, lastValid, validate)); return {};
}
function renderVersionManager(ctx) { const history = state(ctx, "当前 v7；草稿有 3 处修改"); const create = ctx.button("生成 v8 修订", "version-create"); ctx.on(create, "click", () => { history.textContent = "v8 已创建；可比较 v7 ↔ v8；v7 未覆盖"; ctx.setStatus("页面版本 v8 已创建", "version:v8"); }); ctx.stage.append(workbench(ctx, "页面版本", history, create)); return {}; }

function renderPublishConsole(ctx) {
  const environment = ctx.el("select", { "aria-label": "发布环境" }, ctx.el("option", { value: "staging", text: "预发布" }), ctx.el("option", { value: "production", text: "生产" })); const out = state(ctx, "前置校验未运行"); const publish = ctx.button("校验并发布", "publish-run");
  ctx.on(publish, "click", () => { out.textContent = `${environment.value}：前置校验通过，发布 0%`; ctx.setStatus("发布进行中", "publish:running"); ctx.timeout(() => { out.textContent = `${environment.value}：发布 100%，健康检查通过`; ctx.setStatus("发布成功", "publish:success"); }, 100); }); ctx.stage.append(workbench(ctx, "发布控制台", environment, out, publish)); return {};
}
function renderDesignSystemManager(ctx) { const library = state(ctx, "Button v2；Input v4"); const deprecate = ctx.button("弃用 Button v1", "system-deprecate"); ctx.on(deprecate, "click", () => { library.textContent = "Button v1 deprecated → 迁移 Button v2；影响页面 6"; ctx.setStatus("旧组件已标记弃用", "system:deprecated-v1"); }); ctx.stage.append(workbench(ctx, "设计系统管理", library, deprecate)); return {}; }

const renderers08 = Object.freeze({
  "08:page-designer": renderPageDesigner, "08:form-designer": renderFormDesigner, "08:report-designer": renderReportDesigner,
  "08:dashboard-designer": renderDashboardDesigner, "08:mobile-page-designer": renderMobilePageDesigner, "08:data-source-designer": renderDataSourceDesigner,
  "08:event-designer": renderEventDesigner, "08:action-designer": renderActionDesigner, "08:expression-designer": renderExpressionDesigner,
