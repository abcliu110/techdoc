en{color:#6d4d04}.side-foot{padding:10px 13px;border-top:1px solid #394552;color:#8997a7;font-size:11px}main{min-width:0;overflow:auto;padding:24px 28px 44px}.inner{width:min(1160px,100%);margin:auto}.hero{display:flex;justify-content:space-between;gap:20px}.eyebrow{color:#8b6200;font:700 11px Consolas}.hero h1{margin:3px 0 5px;font:700 clamp(24px,3vw,34px)/1.2 Bahnschrift,"Microsoft YaHei UI"}.hero h1 small{color:var(--muted);font-size:.48em;font-weight:500}.summary{max-width:790px;margin:0;color:var(--muted)}.pager{display:flex;gap:6px}.btn{min-height:44px;padding:7px 12px;border:1px solid #b8c3ce;background:#fff;color:var(--ink)}.btn.primary,.btn.active{border-color:#a87906;background:var(--accent);font-weight:700}.btn.danger{border-color:#b36a6a;color:#8a3030}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.fact{padding:11px 13px;border:1px solid var(--line);border-left:4px solid var(--accent);background:#fff}.fact:nth-child(2){border-left-color:var(--teal)}.fact:nth-child(3){border-left-color:var(--blue)}.label{color:var(--muted);font-size:10px;font-weight:700}.value{margin-top:3px;font:700 12px Consolas,"Microsoft YaHei UI";overflow-wrap:anywhere}.proto{margin-top:14px;border:1px solid #bfc9d3;background:#fff;box-shadow:0 12px 32px #18202b1f}.proto-head{min-height:52px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px 7px 14px;border-bottom:1px solid var(--line);background:#f8fafc}.proto-head .hint{color:var(--muted);font-size:11px}.actions{margin-left:auto;display:flex;gap:6px}.stage-wrap{padding:14px;background:#e8edf2}.stage{position:relative;min-height:350px;overflow:auto;border:1px solid #aeb9c5;background:#f7f9fb;background-image:linear-gradient(#e6ebf0 1px,transparent 1px),linear-gradient(90deg,#e6ebf0 1px,transparent 1px);background-size:20px 20px;padding:16px}.prototype-state{min-height:42px;padding:10px 13px;border-top:1px solid var(--line);border-left:4px solid var(--teal);background:#e3f0eb;font:12px Consolas,"Microsoft YaHei UI"}.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.note{padding:13px 14px;border:1px solid var(--line);background:#fff}.note h2{margin:0 0 5px;font-size:13px}.note p{margin:0;color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:8px;border:1px solid var(--line);background:#eef2f5}.panel{padding:12px;border:1px solid #aeb9c5;background:#fff}.row{display:flex;gap:10px;align-items:flex-start}.col{display:grid;gap:8px}.grid{display:grid;gap:9px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:10px;border:1px solid #c5ced8;background:#fff}.item.active,.selected{border-color:#b17f05;background:#fff8df}.field{display:grid;gap:5px;min-width:150px}.field-label{color:var(--muted);font-size:11px}.field input,.field select,.field textarea,input,select,textarea{min-height:40px;padding:7px 9px;border:1px solid #aeb9c5;background:#fff}.status{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.table-scroll{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border:1px solid var(--line);text-align:left}th{background:#e7edf2}.canvas{position:relative;min-width:620px;min-height:290px;background:#eef2f5}.node{position:absolute;min-width:110px;padding:10px;border:1px solid #91a1b1;background:#fff}.badge{display:inline-block;padding:3px 7px;border:1px solid #aeb9c5;background:#fff;font-size:11px}.toast{position:fixed;z-index:100;right:16px;bottom:16px;padding:10px 13px;color:#fff;background:#202936;border-left:4px solid var(--accent);opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:760px){.app{grid-template-rows:54px 1fr}.brand small{display:none}.menu{display:block}.shell{display:block;position:relative}.shell>aside{position:absolute;inset:0 auto 0 0;z-index:20;width:min(88vw,300px);transform:translateX(-102%);transition:.2s}.shell>aside.open{transform:none;box-shadow:12px 0 30px #0005}main{height:100%;padding:16px 12px 32px}.hero{display:block}.pager{margin-top:12px}.facts,.notes,.grid.two,.grid.three{grid-template-columns:1fr}.stage-wrap{padding:8px}.stage{min-height:360px;padding:10px}.actions{width:100%;margin-left:0}.btn{min-width:44px}}

</style></head><body><div class="app"><header><button class="menu" id="menu" type="button" aria-label="打开目录">目录</button><span class="mark"></span><div class="brand">数据模型 × 界面模式 <small>树与层级类原型手册</small></div><div class="count" id="count"></div></header><div class="shell"><aside id="side"><div class="side-head"><div class="side-label">03 · Tree &amp; Hierarchy</div><input id="search" class="search" type="search" aria-label="搜索组件" placeholder="搜索组件名称或模型"></div><nav id="nav" class="nav" aria-label="组件目录"></nav><div class="side-foot">方向键切换 · Esc 收起目录</div></aside><main id="main" tabindex="-1"><div class="inner"><div class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="summary" id="summary"></p></div><div class="pager"><button class="btn" id="prev" type="button">上一项</button><button class="btn" id="next" type="button">下一项</button></div></div><div class="facts" id="facts"></div><section class="proto"><div class="proto-head"><strong>关键交互原型</strong><span class="hint">本组件拥有独立结构、动作和状态。</span><div class="actions"><button class="btn" id="reset" type="button">重置原型</button></div></div><section class="business-task" id="taskContext" hidden><div class="business-task-head"><div><h3>生产级任务场景</h3><p>先载入任务上下文，再完成组件主动作；异常与恢复路径用于评审边界。</p></div><span class="business-badge" id="taskLevel"></span></div><div class="business-grid" id="taskFields"></div><div class="business-notice business-warning"><strong>非理想场景</strong><span id="taskException"></span></div><div class="business-actions"><button class="btn primary" type="button" data-readiness-start>载入任务上下文</button><button class="btn danger" type="button" data-readiness-exception>注入非理想场景</button><button class="btn business-recovery" type="button" data-readiness-recovery>执行恢复动作</button></div><div class="business-grid"><div class="business-field"><span class="business-label">恢复方式</span><strong id="taskRecovery"></strong></div><div class="business-field"><span class="business-label">键盘路径</span><strong id="taskKeyboard"></strong></div></div><section class="business-system" id="systemReadiness" hidden><div><strong>职责边界</strong><ul id="systemResponsibilities"></ul><strong>跨模块时间线</strong><div class="business-timeline" id="systemTimeline"></div></div><div class="business-notice" id="systemCompensation"></div></section><div class="business-notice" id="readinessResult" role="status" aria-live="polite"></div></section><div class="stage-wrap"><div class="stage" id="stage"></div></div><div class="prototype-state" id="prototypeState" data-state="initial" aria-live="polite">初始状态</div></section><div class="notes" id="notes"></div></div></main></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>function mount(ctx, html) {
  ctx.stage.innerHTML = `<div class="prototype-demo">${html}<output data-state aria-live="polite"></output></div>`;
  const q = (selector) => ctx.stage.querySelector(selector), qa = (selector) => [...ctx.stage.querySelectorAll(selector)];
  const state = (value) => { q("[data-state]").textContent = String(value); ctx.setStatus?.(value, value); };
  const on = (selector, type, listener) => ctx.on(q(selector), type, listener);
  return { q, qa, state, on };
}

function renderTreeView(ctx) {
  const ui = mount(ctx, `<ul><li><button data-node="root">产品</button><ul><li><button data-node="crm">CRM</button></li><li><button data-node="erp">ERP</button></li></ul></li></ul>`);
  ui.qa("[data-node]").forEach((node) => ctx.on(node, "click", () => { ui.qa("[data-node]").forEach((item) => item.classList.toggle("selected", item === node)); ui.state(`selected:${node.dataset.node}`); })); ui.state("selected:none");
}
function renderCheckboxTree(ctx) {
  const ui = mount(ctx, `<label><input type="checkbox" data-parent> 华东区</label><ul><li><label><input type="checkbox" data-child> 上海</label></li><li><label><input type="checkbox" data-child> 杭州</label></li></ul>`);
  ui.on("[data-parent]", "change", () => { const checked = ui.q("[data-parent]").checked; ui.qa("[data-child]").forEach((child) => { child.checked = checked; }); ui.state(`checked:${checked ? 3 : 0}`); }); ui.qa("[data-child]").forEach((child) => ctx.on(child, "change", () => { const count = ui.qa("[data-child]:checked").length; ui.q("[data-parent]").indeterminate = count === 1; ui.state(`childrenChecked:${count}`); })); ui.state("checked:0");
}
function renderRadioTree(ctx) {
  const ui = mount(ctx, `<fieldset><legend>选择唯一分类</legend><label><input type="radio" name="category" data-radio="hardware"> 硬件</label><label><input type="radio" name="category" data-radio="software"> 软件</label></fieldset>`);
  ui.qa("[data-radio]").forEach((radio) => ctx.on(radio, "change", () => ui.state(`selected:${radio.dataset.radio}`))); ui.state("selected:none");
}
function renderLazyTree(ctx) {
  const ui = mount(ctx, `<ul><li><button data-load aria-expanded="false">▶ 华南区</button><ul data-children></ul></li></ul>`);
  let loaded = false; ui.on("[data-load]", "click", () => { if (!loaded) { ["广州", "深圳"].forEach((text) => { const li = document.createElement("li"); li.textContent = text; ui.q("[data-children]").append(li); }); loaded = true; } ui.q("[data-load]").setAttribute("aria-expanded", "true"); ui.state("lazy:loaded:2"); }); ui.state("lazy:idle");
}
function renderVirtualTree(ctx) {
  const ui = mount(ctx, `<ul data-window></ul><button data-next-window>显示第 101 个节点</button>`);
  let start = 1; const draw = () => { const list = ui.q("[data-window]"); list.replaceChildren(...Array.from({length:7},(_,i)=>{const li=document.createElement("li");li.textContent=`节点 ${start+i}`;return li;})); ui.state(`windowStart:${start}`); }; ui.on("[data-next-window]", "click",()=>{start=start===1?101:1;draw();}); draw();
}
function renderSearchTree(ctx) {
  const ui = mount(ctx, `<label>搜索节点 <input data-search value="上海"></label><ul><li>中国<ul><li>华东<ul><li data-node="上海">上海</li><li data-node="杭州">杭州</li></ul></li></ul></li></ul><button data-find>定位节点</button>`);
  ui.on("[data-find]", "click",()=>{const term=ui.q("[data-search]").value;const node=ui.qa("[data-node]").find((item)=>item.dataset.node.includes(term));ui.qa("[data-node]").forEach((item)=>item.classList.toggle("selected",item===node));ui.state(node?`revealed:${node.dataset.node}`:"revealed:none");}); ui.state("revealed:none");
}
function renderDraggableTree(ctx) {
  const ui = mount(ctx, `<ul><li data-parent="root">根目录<ul data-root><li data-node="report">报表</li><li data-node="archive">归档<ul data-archive></ul></li></ul></li></ul><button data-reparent>移动报表到归档</button>`);
  let parent="root";ui.on("[data-reparent]","click",()=>{parent=parent==="root"?"archive":"root";ui.q(parent==="archive"?"[data-archive]":"[data-root]").append(ui.q('[data-node="report"]'));ui.state(`parent:${parent}`);});ui.state("parent:root");
}
function renderEditableTree(ctx) {
  const ui=mount(ctx,`<ul><li><span data-label>销售资料</span> <button data-edit>重命名</button></li></ul>`);let editing=false;ui.on("[data-edit]","click",()=>{editing=!editing;ui.q("[data-label]").contentEditable=String(editing);ui.q("[data-label]").focus();ui.q("[data-edit]").textContent=editing?"保存":"重命名";ui.state(`editing:${editing}`);});ui.state("editing:false");
}
function renderContextTree(ctx) {
  const ui=mount(ctx,`<button data-target>项目文档</button><menu data-menu hidden><button data-command="duplicate">复制节点</button><button data-command="delete">删除节点</button></menu>`);ui.on("[data-target]","contextmenu",(event)=>{event.preventDefault();ui.q("[data-menu]").hidden=false;ui.state("menu:open");});ui.qa("[data-command]").forEach((button)=>ctx.on(button,"click",()=>{ui.q("[data-menu]").hidden=true;ui.state(`command:${button.dataset.command}`);}));ui.state("menu:closed");
}
function renderFileTree(ctx) {
  const ui=mount(ctx,`<ul data-files><li data-file="readme">README.md</li></ul><button data-new-file>新建文件</button><button data-rename-file>重命名</button>`);ui.on("[data-new-file]","click",()=>{if(!ui.q('[data-file="draft"]')){const li=document.createElement("li");li.dataset.file="draft";li.textContent="draft.md";ui.q("[data-files]").append(li);}ui.state("file:created");});ui.on("[data-rename-file]","click",()=>{const file=ui.q('[data-file="draft"]');if(file){file.textContent="proposal.md";ui.state("file:renamed");}});ui.state("file:initial");
}
function renderOrgTree(ctx) {
  const ui=mount(ctx,`<ul><li>总部<ul><li data-unit="sales">销售部</li><li data-unit="tech">技术部<ul data-tech></ul></li></ul></li></ul><button data-org-move>将销售部并入技术中心</button>`);let parent="hq";ui.on("[data-org-move]","click",()=>{parent=parent==="hq"?"tech":"hq";if(parent==="tech")ui.q("[data-tech]").append(ui.q('[data-unit="sales"]'));else ui.q('[data-unit="tech"]').before(ui.q('[data-unit="sales"]'));ui.state(`orgParent:${parent}`);});ui.state("orgParent:hq");
}
function renderCategoryTree(ctx) {
  const ui=mount(ctx,`<ul><li>商品分类<ul><li><button data-category="office">办公用品</button></li><li><button data-category="digital">数码设备</button></li></ul></li></ul><aside data-products>未选择分类</aside>`);ui.qa("[data-category]").forEach((button)=>ctx.on(button,"click",()=>{ui.q("[data-products]").textContent=button.dataset.category==="office"?"纸张、笔、文件夹":"电脑、显示器、键盘";ui.state(`category:${button.dataset.category}`);}));ui.state("category:none");
}
function renderRegionTree(ctx) {
  const ui=mount(ctx,`<button data-region="china">中国</button> › <button data-region="east">华东</button> › <button data-region="shanghai">上海</button><output data-path></output>`);ui.qa("[data-region]").forEach((button)=>ctx.on(button,"click",()=>{ui.q("[data-path]").textContent=`当前位置：中国 / ${button.textContent}`;ui.state(`region:${button.dataset.region}`);}));ui.state("region:china");
}
function renderMenuTree(ctx) {
  const ui=mount(ctx,`<ul><li><label><input type="checkbox" data-menu="dashboard" checked> 仪表盘</label></li><li><label><input type="checkbox" data-menu="admin"> 管理设置</label></li></ul>`);ui.qa("[data-menu]").forEach((input)=>ctx.on(input,"change",()=>ui.state(`${input.dataset.menu}:${input.checked?"enabled":"disabled"}`)));ui.state("menus:initial");
}
function renderPermissionTree(ctx) {
  const ui=mount(ctx,`<label><input type="checkbox" data-parent checked> 客户管理（继承）</label><ul><li><label><input type="checkbox" data-child checked disabled> 查看客户</label></li><li><label><input type="checkbox" data-child checked disabled> 编辑客户</label></li></ul><button data-override>覆盖继承</button>`);let inherited=true;ui.on("[data-override]","click",()=>{inherited=!inherited;ui.qa("[data-child]").forEach((input)=>{input.disabled=inherited;});ui.state(`inherited:${inherited}`);});ui.state("inherited:true");
}
function renderDependencyTree(ctx) {
  const ui=mount(ctx,`<ul><li>订单服务<ul><li data-dependent>库存服务</li><li data-dependent>支付服务</li></ul></li></ul><button data-impact>分析变更影响</button>`);ui.on("[data-impact]","click",()=>{ui.qa("[data-dependent]").forEach((node)=>node.style.background="#ffe2a8");ui.state("impacted:2");});ui.state("impacted:0");
}
function renderRelationshipTree(ctx) {
  const ui=mount(ctx,`<div data-relation>客户 → 订单 → 商品</div><button data-direction>反向查看关系</button>`);let direction="out";ui.on("[data-direction]","click",()=>{direction=direction==="out"?"in":"out";ui.q("[data-relation]").textContent=direction==="out"?"客户 → 订单 → 商品":"商品 ← 订单 ← 客户";ui.state(`direction:${direction}`);});ui.state("direction:out");
}
function renderOutlineTree(ctx) {
