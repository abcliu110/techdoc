:root{--ink:#202936;--nav:#222d39;--paper:#fff;--ground:#edf1f5;--line:#cbd3dc;--muted:#667487;--accent:#e4a91a;--teal:#16796f;--blue:#356f9f;--red:#a84d4d}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font:14px/1.55 "Microsoft YaHei UI",sans-serif}button,input,select,textarea{font:inherit;letter-spacing:0}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:3px solid #e4a91a66;outline-offset:2px}.app{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr)}header{display:flex;align-items:center;gap:12px;padding:0 18px;color:#fff;background:#19222d;border-bottom:3px solid var(--accent)}.mark{width:7px;height:27px;background:var(--accent)}.brand{font:700 16px Bahnschrift,"Microsoft YaHei UI"}.brand small{margin-left:9px;color:#aeb9c6;font-size:12px;font-weight:500}.count{margin-left:auto;font:12px Consolas}.menu{display:none;min-width:44px;min-height:44px;border:1px solid #687788;color:#fff;background:transparent}.shell{min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr)}aside{min-height:0;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;color:#c6d0db;background:var(--nav)}.side-head{padding:14px 13px 10px;border-bottom:1px solid #394552}.side-label{margin-bottom:8px;color:#8290a0;font-size:10px;font-weight:700;text-transform:uppercase}.search{width:100%;min-height:44px;padding:8px 9px;border:1px solid #495766;color:#fff;background:#18212b}.nav{overflow:auto;padding:7px}.nav button{width:100%;display:grid;grid-template-columns:34px 1fr;border:0;border-left:3px solid transparent;padding:8px;color:#c6d0db;background:transparent;text-align:left}.nav button:hover{background:#2b3745}.nav button.active{color:#17202a;background:var(--accent);font-weight:700}.num{font:11px Consolas;color:#8593a3}.en{display:block;color:#8190a0;font-size:10px;font-weight:400}.nav button.active .en{color:#6d4d04}.side-foot{padding:10px 13px;border-top:1px solid #394552;color:#8997a7;font-size:11px}main{min-width:0;overflow:auto;padding:24px 28px 44px}.inner{width:min(1160px,100%);margin:auto}.hero{display:flex;justify-content:space-between;gap:20px}.eyebrow{color:#8b6200;font:700 11px Consolas}.hero h1{margin:3px 0 5px;font:700 clamp(24px,3vw,34px)/1.2 Bahnschrift,"Microsoft YaHei UI"}.hero h1 small{color:var(--muted);font-size:.48em;font-weight:500}.summary{max-width:790px;margin:0;color:var(--muted)}.pager{display:flex;gap:6px}.btn{min-height:44px;padding:7px 12px;border:1px solid #b8c3ce;background:#fff;color:var(--ink)}.btn.primary,.btn.active{border-color:#a87906;background:var(--accent);font-weight:700}.btn.danger{border-color:#b36a6a;color:#8a3030}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.fact{padding:11px 13px;border:1px solid var(--line);border-left:4px solid var(--accent);background:#fff}.fact:nth-child(2){border-left-color:var(--teal)}.fact:nth-child(3){border-left-color:var(--blue)}.label{color:var(--muted);font-size:10px;font-weight:700}.value{margin-top:3px;font:700 12px Consolas,"Microsoft YaHei UI";overflow-wrap:anywhere}.proto{margin-top:14px;border:1px solid #bfc9d3;background:#fff;box-shadow:0 12px 32px #18202b1f}.proto-head{min-height:52px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px 7px 14px;border-bottom:1px solid var(--line);background:#f8fafc}.proto-head .hint{color:var(--muted);font-size:11px}.actions{margin-left:auto;display:flex;gap:6px}.stage-wrap{padding:14px;background:#e8edf2}.stage{position:relative;min-height:350px;overflow:auto;border:1px solid #aeb9c5;background:#f7f9fb;background-image:linear-gradient(#e6ebf0 1px,transparent 1px),linear-gradient(90deg,#e6ebf0 1px,transparent 1px);background-size:20px 20px;padding:16px}.prototype-state{min-height:42px;padding:10px 13px;border-top:1px solid var(--line);border-left:4px solid var(--teal);background:#e3f0eb;font:12px Consolas,"Microsoft YaHei UI"}.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.note{padding:13px 14px;border:1px solid var(--line);background:#fff}.note h2{margin:0 0 5px;font-size:13px}.note p{margin:0;color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:8px;border:1px solid var(--line);background:#eef2f5}.panel{padding:12px;border:1px solid #aeb9c5;background:#fff}.row{display:flex;gap:10px;align-items:flex-start}.col{display:grid;gap:8px}.grid{display:grid;gap:9px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:10px;border:1px solid #c5ced8;background:#fff}.item.active,.selected{border-color:#b17f05;background:#fff8df}.field{display:grid;gap:5px;min-width:150px}.field-label{color:var(--muted);font-size:11px}.field input,.field select,.field textarea,input,select,textarea{min-height:40px;padding:7px 9px;border:1px solid #aeb9c5;background:#fff}.status{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.table-scroll{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border:1px solid var(--line);text-align:left}th{background:#e7edf2}.canvas{position:relative;min-width:620px;min-height:290px;background:#eef2f5}.node{position:absolute;min-width:110px;padding:10px;border:1px solid #91a1b1;background:#fff}.badge{display:inline-block;padding:3px 7px;border:1px solid #aeb9c5;background:#fff;font-size:11px}.toast{position:fixed;z-index:100;right:16px;bottom:16px;padding:10px 13px;color:#fff;background:#202936;border-left:4px solid var(--accent);opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:760px){.app{grid-template-rows:54px 1fr}.brand small{display:none}.menu{display:block}.shell{display:block;position:relative}.shell>aside{position:absolute;inset:0 auto 0 0;z-index:20;width:min(88vw,300px);transform:translateX(-102%);transition:.2s}.shell>aside.open{transform:none;box-shadow:12px 0 30px #0005}main{height:100%;padding:16px 12px 32px}.hero{display:block}.pager{margin-top:12px}.facts,.notes,.grid.two,.grid.three{grid-template-columns:1fr}.stage-wrap{padding:8px}.stage{min-height:360px;padding:10px}.actions{width:100%;margin-left:0}.btn{min-width:44px}}

</style></head><body><div class="app"><header><button class="menu" id="menu" type="button" aria-label="打开目录">目录</button><span class="mark"></span><div class="brand">数据模型 × 界面模式 <small>编辑器类原型手册</small></div><div class="count" id="count"></div></header><div class="shell"><aside id="side"><div class="side-head"><div class="side-label">07 · Editor</div><input id="search" class="search" type="search" aria-label="搜索组件" placeholder="搜索组件名称或模型"></div><nav id="nav" class="nav" aria-label="组件目录"></nav><div class="side-foot">方向键切换 · Esc 收起目录</div></aside><main id="main" tabindex="-1"><div class="inner"><div class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="summary" id="summary"></p></div><div class="pager"><button class="btn" id="prev" type="button">上一项</button><button class="btn" id="next" type="button">下一项</button></div></div><div class="facts" id="facts"></div><section class="proto"><div class="proto-head"><strong>关键交互原型</strong><span class="hint">本组件拥有独立结构、动作和状态。</span><div class="actions"><button class="btn" id="reset" type="button">重置原型</button></div></div><section class="business-task" id="taskContext" hidden><div class="business-task-head"><div><h3>生产级任务场景</h3><p>先载入任务上下文，再完成组件主动作；异常与恢复路径用于评审边界。</p></div><span class="business-badge" id="taskLevel"></span></div><div class="business-grid" id="taskFields"></div><div class="business-notice business-warning"><strong>非理想场景</strong><span id="taskException"></span></div><div class="business-actions"><button class="btn primary" type="button" data-readiness-start>载入任务上下文</button><button class="btn danger" type="button" data-readiness-exception>注入非理想场景</button><button class="btn business-recovery" type="button" data-readiness-recovery>执行恢复动作</button></div><div class="business-grid"><div class="business-field"><span class="business-label">恢复方式</span><strong id="taskRecovery"></strong></div><div class="business-field"><span class="business-label">键盘路径</span><strong id="taskKeyboard"></strong></div></div><section class="business-system" id="systemReadiness" hidden><div><strong>职责边界</strong><ul id="systemResponsibilities"></ul><strong>跨模块时间线</strong><div class="business-timeline" id="systemTimeline"></div></div><div class="business-notice" id="systemCompensation"></div></section><div class="business-notice" id="readinessResult" role="status" aria-live="polite"></div></section><div class="stage-wrap"><div class="stage" id="stage"></div></div><div class="prototype-state" id="prototypeState" data-state="initial" aria-live="polite">初始状态</div></section><div class="notes" id="notes"></div></div></main></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>const categoryNumber = "07";
function desk(ctx, title, ...children) { return ctx.el("div", { className: "demo col" }, ctx.el("h3", { text: title }), ...children); }
function output(ctx, text = "等待操作") { return ctx.el("div", { className: "status", text }); }

function renderRichTextEditor(ctx) {
  const text = ctx.el("div", { className: "item", contentEditable: "true", role: "textbox", "aria-label": "富文本正文", text: "选择这段文字并应用强调。" }); const bold = ctx.button("应用粗体", "rich-bold");
  ctx.on(bold, "click", () => { text.style.fontWeight = "700"; ctx.setStatus("当前段落已应用 strong 标记", "mark:bold"); }); ctx.stage.append(desk(ctx, "语义富文本", ctx.el("div", { className: "toolbar" }, bold), text)); return {};
}
function renderMarkdownEditor(ctx) {
  const source = ctx.el("textarea", { rows: 5, "aria-label": "Markdown 源码", value: "## 交付说明\n- 已验证" }); const preview = output(ctx, "预览未生成"); const run = ctx.button("生成预览", "markdown-preview");
  ctx.on(run, "click", () => { preview.replaceChildren(ctx.el("h2", { text: "交付说明" }), ctx.el("li", { text: "已验证" })); ctx.setStatus("Markdown 预览已同步", "preview:markdown"); }); ctx.stage.append(desk(ctx, "Markdown 源码与预览", source, preview, run)); return {};
}
function renderCodeEditor(ctx) {
  const source = ctx.el("textarea", { rows: 5, spellcheck: false, "aria-label": "JavaScript 代码", value: "return 6 * 7;" }); const consoleNode = output(ctx, "控制台空闲"); const run = ctx.button("运行代码", "code-run");
  ctx.on(run, "click", () => { const value = source.value.includes("6 * 7") ? 42 : "SyntaxError"; consoleNode.textContent = `输出：${value}`; ctx.setStatus(value === 42 ? "运行成功" : "运行失败", value === 42 ? "run:42" : "run:error"); }); ctx.stage.append(desk(ctx, "代码与诊断", source, consoleNode, run)); return {};
}
function renderJsonEditor(ctx) {
  const source = ctx.el("textarea", { rows: 5, "aria-label": "JSON 文本", value: "{\"enabled\":true}" }); const tree = output(ctx, "等待校验"); const validate = ctx.button("校验并生成树", "json-validate");
  ctx.on(validate, "click", () => { try { const value = JSON.parse(source.value); tree.textContent = `root > enabled : ${value.enabled}`; ctx.setStatus("JSON 有效", "json:valid"); } catch { tree.textContent = "JSON 语法错误"; ctx.setStatus("JSON 无效", "json:error"); } }); ctx.stage.append(desk(ctx, "JSON 文本 ↔ 树", source, tree, validate)); return {};
}
function renderYamlEditor(ctx) {
  const source = ctx.el("textarea", { rows: 5, "aria-label": "YAML 文本", value: "service:\n  enabled: true" }); const diagnostic = output(ctx, "等待缩进检查"); const validate = ctx.button("检查 YAML", "yaml-validate");
  ctx.on(validate, "click", () => { const valid = source.value.split("\n").slice(1).every((line) => /^  \w+/.test(line)); diagnostic.textContent = valid ? "service.enabled = true" : "第 2 行缩进错误"; ctx.setStatus(valid ? "YAML 有效" : "YAML 无效", valid ? "yaml:valid" : "yaml:error"); }); ctx.stage.append(desk(ctx, "缩进结构", source, diagnostic, validate)); return {};
}
function renderXmlEditor(ctx) {
  const source = ctx.el("textarea", { rows: 5, "aria-label": "XML 文本", value: "<order><id>1008</id></order>" }); const tree = output(ctx, "等待解析"); const parse = ctx.button("解析元素树", "xml-parse");
  ctx.on(parse, "click", () => { const parsed = new DOMParser().parseFromString(source.value, "application/xml"); const error = parsed.querySelector("parsererror"); tree.textContent = error ? "XML 标签不匹配" : "order / id = 1008"; ctx.setStatus(error ? "XML 无效" : "XML 有效", error ? "xml:error" : "xml:valid"); }); ctx.stage.append(desk(ctx, "XML 元素树", source, tree, parse)); return {};
}
function renderFormulaEditor(ctx) {
  const formula = ctx.el("input", { value: "price * quantity", "aria-label": "公式" }); const out = output(ctx, "price=120, quantity=3"); const evaluate = ctx.button("计算公式", "formula-evaluate");
  ctx.on(evaluate, "click", () => { out.textContent = "结果：360（Number）"; ctx.setStatus("公式求值成功", "formula:360"); }); ctx.stage.append(desk(ctx, "字段公式", formula, out, evaluate)); return {};
}
function renderExpressionEditor(ctx) {
  const expression = ctx.el("input", { value: "customer.level === 'VIP'", "aria-label": "表达式" }); const out = output(ctx, "scope.customer.level = VIP"); const test = ctx.button("测试表达式", "expression-test");
  ctx.on(test, "click", () => { out.textContent = "Boolean(true)"; ctx.setStatus("表达式命中", "expression:true"); }); ctx.stage.append(desk(ctx, "受限表达式", expression, out, test)); return {};
}
function renderSqlEditor(ctx) {
  const sql = ctx.el("textarea", { rows: 4, "aria-label": "SQL", value: "SELECT id, name FROM customer WHERE status = :status" }); const out = output(ctx, "参数 status=ACTIVE"); const run = ctx.button("执行参数化查询", "sql-run");
  ctx.on(run, "click", () => { out.textContent = "2 行：C-1008 / 星河科技；C-1021 / 青山商贸"; ctx.setStatus("SQL 执行完成", "rows:2"); }); ctx.stage.append(desk(ctx, "SQL 与结果集", sql, out, run)); return {};
}
function renderVisualQueryEditor(ctx) {
  const graph = ctx.el("div", { className: "canvas", text: "customer" }); const join = ctx.button("关联 order.customer_id", "visual-join");
  ctx.on(join, "click", () => { graph.textContent = "customer ── customer.id = order.customer_id ── order"; ctx.setStatus("查询图新增 1 条 JOIN", "joins:1"); }); ctx.stage.append(desk(ctx, "查询图", graph, join)); return {};
}
function renderTemplateEditor(ctx) {
  const source = ctx.el("textarea", { rows: 4, "aria-label": "模板", value: "您好，{{customerName}}" }); const out = output(ctx); const preview = ctx.button("使用示例数据预览", "template-preview");
  ctx.on(preview, "click", () => { out.textContent = source.value.replace("{{customerName}}", "星河科技"); ctx.setStatus("模板变量已插值", "template:resolved"); }); ctx.stage.append(desk(ctx, "变量模板", source, out, preview)); return {};
}
function renderEmailTemplateEditor(ctx) {
  const subject = ctx.el("input", { value: "{{name}}，合同即将到期", "aria-label": "邮件主题" }); const out = output(ctx, "等待邮件预览"); const preview = ctx.button("生成移动端邮件预览", "email-preview");
  ctx.on(preview, "click", () => { out.textContent = "主题：李明，合同即将到期 · 视口 390px"; ctx.setStatus("邮件主题和正文已预览", "email:mobile"); }); ctx.stage.append(desk(ctx, "邮件模板", subject, ctx.el("textarea", { rows: 3, "aria-label": "邮件正文", value: "请于 7 月 31 日前确认续签。" }), out, preview)); return {};
}
function renderDocumentEditor(ctx) {
  const outline = ctx.el("div", { className: "item", text: "1. 背景\n2. 方案\n3. 验证" }); const activate = ctx.button("跳转到“验证”章节", "document-section");
  ctx.on(activate, "click", () => { outline.textContent = "当前章节：3. 验证（引用 2，附件 1）"; ctx.setStatus("文档大纲已联动", "section:verification"); }); ctx.stage.append(desk(ctx, "结构化文档", outline, activate)); return {};
}
function renderSpreadsheetEditor(ctx) {
  const cell = ctx.el("input", { value: "=B2*C2", "aria-label": "D2 公式" }); const out = output(ctx, "B2=120，C2=3"); const recalc = ctx.button("重算 D2", "sheet-recalc");
  ctx.on(recalc, "click", () => { out.textContent = "D2 = 360"; ctx.setStatus("工作表公式已重算", "cell:D2=360"); }); ctx.stage.append(desk(ctx, "电子表格单元格", ctx.el("div", { className: "matrix" }, cell), out, recalc)); return {};
}
function renderDiffEditor(ctx) {
  const hunk = ctx.el("div", { className: "item", text: "- 超时 30 秒\n+ 超时 60 秒" }); const accept = ctx.button("接受此差异块", "diff-accept");
  ctx.on(accept, "click", () => { hunk.textContent = "超时 60 秒（已接受）"; ctx.setStatus("差异块已接受", "hunk:accepted"); }); ctx.stage.append(desk(ctx, "基线与变更", hunk, accept)); return {};
}
function renderVersionEditor(ctx) {
  const versions = output(ctx, "比较 v5 → v7"); const restore = ctx.button("恢复 v5", "version-restore");
  ctx.on(restore, "click", () => { versions.textContent = "新版本 v8 已从 v5 创建，历史 v7 保留"; ctx.setStatus("旧版本已恢复为新修订", "restored:v5-as-v8"); }); ctx.stage.append(desk(ctx, "版本比较与恢复", versions, restore)); return {};
}
function renderCollaborativeEditor(ctx) {
  const doc = ctx.el("div", { className: "item", text: "共享文档 · 李明正在第 2 段" }); const merge = ctx.button("应用王芳的远程操作", "collab-merge");
  ctx.on(merge, "click", () => { doc.textContent = "共享文档 · 已合并 op#42 · 待确认操作 0"; ctx.setStatus("远程操作已合并", "ops:0"); }); ctx.stage.append(desk(ctx, "多人协同", doc, merge)); return {};
}
function renderDiagramEditor(ctx) {
  const canvas = ctx.el("div", { className: "canvas" }, ctx.el("div", { className: "node", style: { left: "40px", top: "60px" }, text: "开始" })); const add = ctx.button("添加审批节点", "diagram-add");
