button{min-width:44px;min-height:44px}
.app,.shell,main,.inner,.hero,.proto,.stage-wrap,.stage,.prototype-demo{min-width:0;max-width:100%}.stage{width:100%}.prototype-demo{overflow:auto}img,svg,canvas{max-width:100%}
:root{--ink:#202936;--nav:#222d39;--paper:#fff;--ground:#edf1f5;--line:#cbd3dc;--muted:#667487;--accent:#e4a91a;--teal:#16796f;--blue:#356f9f;--red:#a84d4d}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font:14px/1.55 "Microsoft YaHei UI",sans-serif}button,input,select,textarea{font:inherit;letter-spacing:0}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:3px solid #e4a91a66;outline-offset:2px}.app{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr)}header{display:flex;align-items:center;gap:12px;padding:0 18px;color:#fff;background:#19222d;border-bottom:3px solid var(--accent)}.mark{width:7px;height:27px;background:var(--accent)}.brand{font:700 16px Bahnschrift,"Microsoft YaHei UI"}.brand small{margin-left:9px;color:#aeb9c6;font-size:12px;font-weight:500}.count{margin-left:auto;font:12px Consolas}.menu{display:none;min-width:44px;min-height:44px;border:1px solid #687788;color:#fff;background:transparent}.shell{min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr)}aside{min-height:0;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;color:#c6d0db;background:var(--nav)}.side-head{padding:14px 13px 10px;border-bottom:1px solid #394552}.side-label{margin-bottom:8px;color:#8290a0;font-size:10px;font-weight:700;text-transform:uppercase}.search{width:100%;min-height:44px;padding:8px 9px;border:1px solid #495766;color:#fff;background:#18212b}.nav{overflow:auto;padding:7px}.nav button{width:100%;display:grid;grid-template-columns:34px 1fr;border:0;border-left:3px solid transparent;padding:8px;color:#c6d0db;background:transparent;text-align:left}.nav button:hover{background:#2b3745}.nav button.active{color:#17202a;background:var(--accent);font-weight:700}.num{font:11px Consolas;color:#8593a3}.en{display:block;color:#8190a0;font-size:10px;font-weight:400}.nav button.active .en{color:#6d4d04}.side-foot{padding:10px 13px;border-top:1px solid #394552;color:#8997a7;font-size:11px}main{min-width:0;overflow:auto;padding:24px 28px 44px}.inner{width:min(1160px,100%);margin:auto}.hero{display:flex;justify-content:space-between;gap:20px}.eyebrow{color:#8b6200;font:700 11px Consolas}.hero h1{margin:3px 0 5px;font:700 clamp(24px,3vw,34px)/1.2 Bahnschrift,"Microsoft YaHei UI"}.hero h1 small{color:var(--muted);font-size:.48em;font-weight:500}.summary{max-width:790px;margin:0;color:var(--muted)}.pager{display:flex;gap:6px}.btn{min-height:44px;padding:7px 12px;border:1px solid #b8c3ce;background:#fff;color:var(--ink)}.btn.primary,.btn.active{border-color:#a87906;background:var(--accent);font-weight:700}.btn.danger{border-color:#b36a6a;color:#8a3030}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.fact{padding:11px 13px;border:1px solid var(--line);border-left:4px solid var(--accent);background:#fff}.fact:nth-child(2){border-left-color:var(--teal)}.fact:nth-child(3){border-left-color:var(--blue)}.label{color:var(--muted);font-size:10px;font-weight:700}.value{margin-top:3px;font:700 12px Consolas,"Microsoft YaHei UI";overflow-wrap:anywhere}.proto{margin-top:14px;border:1px solid #bfc9d3;background:#fff;box-shadow:0 12px 32px #18202b1f}.proto-head{min-height:52px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px 7px 14px;border-bottom:1px solid var(--line);background:#f8fafc}.proto-head .hint{color:var(--muted);font-size:11px}.actions{margin-left:auto;display:flex;gap:6px}.stage-wrap{padding:14px;background:#e8edf2}.stage{position:relative;min-height:350px;overflow:auto;border:1px solid #aeb9c5;background:#f7f9fb;background-image:linear-gradient(#e6ebf0 1px,transparent 1px),linear-gradient(90deg,#e6ebf0 1px,transparent 1px);background-size:20px 20px;padding:16px}.prototype-state{min-height:42px;padding:10px 13px;border-top:1px solid var(--line);border-left:4px solid var(--teal);background:#e3f0eb;font:12px Consolas,"Microsoft YaHei UI"}.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.note{padding:13px 14px;border:1px solid var(--line);background:#fff}.note h2{margin:0 0 5px;font-size:13px}.note p{margin:0;color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:8px;border:1px solid var(--line);background:#eef2f5}.panel{padding:12px;border:1px solid #aeb9c5;background:#fff}.row{display:flex;gap:10px;align-items:flex-start}.col{display:grid;gap:8px}.grid{display:grid;gap:9px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:10px;border:1px solid #c5ced8;background:#fff}.item.active,.selected{border-color:#b17f05;background:#fff8df}.field{display:grid;gap:5px;min-width:150px}.field-label{color:var(--muted);font-size:11px}.field input,.field select,.field textarea,input,select,textarea{min-height:40px;padding:7px 9px;border:1px solid #aeb9c5;background:#fff}.status{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.table-scroll{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border:1px solid var(--line);text-align:left}th{background:#e7edf2}.canvas{position:relative;min-width:620px;min-height:290px;background:#eef2f5}.node{position:absolute;min-width:110px;padding:10px;border:1px solid #91a1b1;background:#fff}.badge{display:inline-block;padding:3px 7px;border:1px solid #aeb9c5;background:#fff;font-size:11px}.toast{position:fixed;z-index:100;right:16px;bottom:16px;padding:10px 13px;color:#fff;background:#202936;border-left:4px solid var(--accent);opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:760px){.app{grid-template-rows:54px 1fr}.brand small{display:none}.menu{display:block}.shell{display:block;position:relative}.shell>aside{position:absolute;inset:0 auto 0 0;z-index:20;width:min(88vw,300px);transform:translateX(-102%);transition:.2s}.shell>aside.open{transform:none;box-shadow:12px 0 30px #0005}main{height:100%;padding:16px 12px 32px}.hero{display:block}.pager{margin-top:12px}.facts,.notes,.grid.two,.grid.three{grid-template-columns:1fr}.stage-wrap{padding:8px}.stage{min-height:360px;padding:10px}.actions{width:100%;margin-left:0}.btn{min-width:44px}}
.business-task{display:grid;gap:10px;color:var(--ink)}.business-task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px;border:1px solid var(--line);background:#fff}.business-task-head h3{margin:0;font-size:15px}.business-task-head p{margin:2px 0 0;color:var(--muted);font-size:11px}.business-badge{padding:4px 7px;border:1px solid #9fabb7;background:#f4f7f9;font-size:10px;white-space:nowrap}.business-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.business-field{display:grid;gap:2px;padding:8px;border:1px solid var(--line);background:#fff}.business-label{color:var(--muted);font-size:10px}.business-decision{padding:9px 11px;border-left:4px solid var(--accent);background:#fff4d7}.business-success{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.business-error{padding:9px 11px;border-left:4px solid var(--red);background:#f6e7e7}.business-actions{display:flex;gap:7px;flex-wrap:wrap}.business-timeline{display:grid;gap:7px;padding:9px;border:1px solid var(--line);background:#fff}.business-timeline-item{display:grid;gap:1px;padding-left:9px;border-left:3px solid #aeb9c5}.business-timeline-item.done{border-color:var(--teal)}.business-timeline-item.error{border-color:var(--red)}.business-timeline-item span{color:var(--muted);font-size:10px}.business-system{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:10px}.business-kpis{display:grid;gap:8px}.business-kpi{padding:9px;border:1px solid var(--line);background:#fff}.business-kpi strong{display:block;font:700 18px Consolas}@media(max-width:760px){.business-grid,.business-system{grid-template-columns:1fr}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:3px solid #b27b00;outline-offset:2px}
.business-notice{display:grid;gap:2px;padding:9px 11px;border-left:4px solid #7d8a97;background:#f1f4f6}.business-notice span{color:var(--muted);font-size:11px}.business-warning{padding:9px 11px;border-left:4px solid #a87906;background:#fff4d7}.business-actions button{min-width:44px}.business-recovery{border-color:#8f6a0a;background:#fff8df;font-weight:700}@media(max-width:760px){.business-task-head{display:grid}.business-badge{width:max-content;max-width:100%;white-space:normal}}
@media(max-width:760px){.stage label{display:grid;grid-template-columns:1fr;gap:4px}.stage label>input,.stage label>select,.stage label>textarea{width:100%;min-width:0}.business-actions .btn{flex:1 1 150px}}
#stage[aria-disabled="true"]{filter:grayscale(.25);opacity:.68;cursor:not-allowed}#stage[aria-disabled="true"]::after{content:"业务操作已阻断，先执行恢复动作";position:absolute;inset:12px 12px auto auto;z-index:4;max-width:260px;padding:8px 10px;color:#fff;background:#7d2929;border-left:4px solid #efb0b0}.business-system{padding:10px;border:1px solid var(--line);background:#f6f8fa}.business-system ul{margin:7px 0 12px;padding-left:20px}
</style></head><body><div class="app"><header><button class="menu" id="menu" type="button" aria-label="打开目录">目录</button><span class="mark"></span><div class="brand">数据模型 × 界面模式 <small>表格类原型手册</small></div><div class="count" id="count"></div></header><div class="shell"><aside id="side"><div class="side-head"><div class="side-label">02 · Data Grid</div><input id="search" class="search" type="search" aria-label="搜索组件" placeholder="搜索组件名称或模型"></div><nav id="nav" class="nav" aria-label="组件目录"></nav><div class="side-foot">方向键切换 · Esc 收起目录</div></aside><main id="main" tabindex="-1"><div class="inner"><div class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="summary" id="summary"></p></div><div class="pager"><button class="btn" id="prev" type="button">上一项</button><button class="btn" id="next" type="button">下一项</button></div></div><div class="facts" id="facts"></div><section class="proto"><div class="proto-head"><strong>关键交互原型</strong><span class="hint">本组件拥有独立结构、动作和状态。</span><div class="actions"><button class="btn" id="reset" type="button">重置原型</button></div></div><section class="business-task" id="taskContext" hidden><div class="business-task-head"><div><h3>生产级任务场景</h3><p>先载入任务上下文，再完成组件主动作；异常与恢复路径用于评审边界。</p></div><span class="business-badge" id="taskLevel"></span></div><div class="business-grid" id="taskFields"></div><div class="business-notice business-warning"><strong>非理想场景</strong><span id="taskException"></span></div><div class="business-actions"><button class="btn primary" type="button" data-readiness-start>载入任务上下文</button><button class="btn danger" type="button" data-readiness-exception>注入非理想场景</button><button class="btn business-recovery" type="button" data-readiness-recovery>执行恢复动作</button></div><div class="business-grid"><div class="business-field"><span class="business-label">恢复方式</span><strong id="taskRecovery"></strong></div><div class="business-field"><span class="business-label">键盘路径</span><strong id="taskKeyboard"></strong></div></div><section class="business-system" id="systemReadiness" hidden><div><strong>职责边界</strong><ul id="systemResponsibilities"></ul><strong>跨模块时间线</strong><div class="business-timeline" id="systemTimeline"></div></div><div class="business-notice" id="systemCompensation"></div></section><div class="business-notice" id="readinessResult" role="status" aria-live="polite"></div></section><div class="stage-wrap"><div class="stage" id="stage"></div></div><div class="prototype-state" id="prototypeState" data-state="initial" aria-live="polite">初始状态</div></section><div class="notes" id="notes"></div></div></main></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>function mount(ctx, html) {
  ctx.stage.innerHTML = `<div class="prototype-demo">${html}<output data-state aria-live="polite"></output></div>`;
  const q = (selector) => ctx.stage.querySelector(selector);
  const qa = (selector) => [...ctx.stage.querySelectorAll(selector)];
  const state = (value) => { q("[data-state]").textContent = String(value); ctx.setStatus?.(value, value); };
  const on = (selector, type, listener) => ctx.on(q(selector), type, listener);
  return { q, qa, state, on };
}

const rows = `<table><thead><tr><th>客户</th><th>金额</th></tr></thead><tbody data-body><tr><td>海风科技</td><td>1200</td></tr><tr><td>远山零售</td><td>860</td></tr></tbody></table>`;

function renderDataGrid(ctx) {
  const ui = mount(ctx, `${rows}<button data-add>新增记录</button>`);
  ui.on("[data-add]", "click", () => { const tr = document.createElement("tr"); ["青禾制造", "640"].forEach((text) => { const td = document.createElement("td"); td.textContent = text; tr.append(td); }); ui.q("[data-body]").append(tr); ui.state(`rows:${ui.qa("tbody tr").length}`); });
  ui.state("rows:2");
}

function renderEditableGrid(ctx) {
  const ui = mount(ctx, `<table><tbody><tr><td contenteditable="true" data-cell>1200</td></tr></tbody></table><button data-commit>提交单元格</button>`);
  ui.on("[data-commit]", "click", () => ui.state(`committed:${ui.q("[data-cell]").textContent.trim()}`));
  ui.state("editBuffer:dirty");
}

function renderBatchEditGrid(ctx) {
  const ui = mount(ctx, `<table><tbody><tr><td><input type="checkbox" aria-label="选择海风" checked></td><td data-value>100</td></tr><tr><td><input type="checkbox" aria-label="选择远山" checked></td><td data-value>200</td></tr></tbody></table><button data-patch>批量增加 10</button>`);
  ui.on("[data-patch]", "click", () => { ui.qa("[data-value]").forEach((cell) => { cell.textContent = String(Number(cell.textContent) + 10); }); ui.state("batch:patched"); }); ui.state("batch:clean");
}

function renderTreeGrid(ctx) {
  const ui = mount(ctx, `<table><tbody><tr><td><button data-expand aria-expanded="false">▶ 华东区</button></td><td>2060</td></tr><tr data-child hidden><td>　上海</td><td>1200</td></tr></tbody></table>`);
  let open = false; ui.on("[data-expand]", "click", () => { open = !open; ui.q("[data-expand]").setAttribute("aria-expanded", String(open)); ui.q("[data-child]").hidden = !open; ui.state(`expanded:${open}`); }); ui.state("expanded:false");
}

function renderMasterDetailGrid(ctx) {
  const ui = mount(ctx, `<table><tbody><tr><td><button data-order="SO-01">SO-01</button></td></tr><tr><td><button data-order="SO-02">SO-02</button></td></tr></tbody></table><aside data-detail>未选择订单</aside>`);
  ui.qa("[data-order]").forEach((button) => ctx.on(button, "click", () => { ui.q("[data-detail]").textContent = `${button.dataset.order}：2 个明细行`; ui.state(`master:${button.dataset.order}`); })); ui.state("master:none");
}

function renderGroupedGrid(ctx) {
  const ui = mount(ctx, `<table><tbody><tr><th><button data-group aria-expanded="true">华东区（2）</button></th></tr><tr data-member><td>上海</td></tr><tr data-member><td>杭州</td></tr></tbody></table>`);
  let open = true; ui.on("[data-group]", "click", () => { open = !open; ui.qa("[data-member]").forEach((row) => { row.hidden = !open; }); ui.q("[data-group]").setAttribute("aria-expanded", String(open)); ui.state(`groupOpen:${open}`); }); ui.state("groupOpen:true");
}

function renderPivotGrid(ctx) {
  const ui = mount(ctx, `<div data-axis>行：地区　列：季度　值：销售额</div><table><tbody><tr><td>华东</td><td data-pivot>1200</td></tr></tbody></table><button data-drill>下钻城市</button>`);
  ui.on("[data-drill]", "click", () => { ui.q("[data-axis]").textContent = "行：地区 / 城市　列：季度　值：销售额"; ui.q("[data-pivot]").textContent = "上海 720 / 杭州 480"; ui.state("pivotDepth:city"); }); ui.state("pivotDepth:region");
}

function renderCrossTab(ctx) {
  const ui = mount(ctx, `<div data-cross>行轴：产品　列轴：月份</div><button data-swap>交换行列轴</button>`);
  let swapped = false; ui.on("[data-swap]", "click", () => { swapped = !swapped; ui.q("[data-cross]").textContent = swapped ? "行轴：月份　列轴：产品" : "行轴：产品　列轴：月份"; ui.state(`axes:${swapped ? "month-product" : "product-month"}`); }); ui.state("axes:product-month");
}

function renderOlapGrid(ctx) {
  const ui = mount(ctx, `<nav data-path>全部地区</nav><button data-level>下钻华东</button><button data-up>上卷</button>`);
  let level = 0; const update = () => { ui.q("[data-path]").textContent = level ? "全部地区 / 华东 / 上海" : "全部地区"; ui.state(`olapLevel:${level}`); }; ui.on("[data-level]", "click", () => { level = 2; update(); }); ui.on("[data-up]", "click", () => { level = Math.max(0, level - 1); update(); }); update();
}

function renderVirtualGrid(ctx) {
  const ui = mount(ctx, `<div data-window style="height:120px;overflow:auto;border:1px solid #aaa"><ol data-virtual></ol></div><button data-scroll>滚动到第 101 行</button>`);
  let start = 1; const draw = () => { const list = ui.q("[data-virtual]"); list.replaceChildren(...Array.from({ length: 8 }, (_, index) => { const li = document.createElement("li"); li.textContent = `记录 ${start + index}`; return li; })); ui.state(`windowStart:${start}`); }; ui.on("[data-scroll]", "click", () => { start = start === 1 ? 101 : 1; draw(); }); draw();
}

function renderInfiniteGrid(ctx) {
  const ui = mount(ctx, `<ol data-infinite><li>记录 1</li><li>记录 2</li></ol><button data-load>加载下一批</button>`);
  let cursor = 2; ui.on("[data-load]", "click", () => { const list = ui.q("[data-infinite]"); for (let n = cursor + 1; n <= cursor + 2; n += 1) { const li = document.createElement("li"); li.textContent = `记录 ${n}`; list.append(li); } cursor += 2; ui.q("[data-load]").disabled = cursor >= 6; ui.state(cursor >= 6 ? "cursor:end" : `cursor:${cursor}`); }); ui.state("cursor:2");
}

function renderServerGrid(ctx) {
  const ui = mount(ctx, `<div data-request>GET /orders?page=1&amp;size=20</div><button data-prev>上一页</button><button data-next>下一页</button>`);
  let page = 1; const update = () => { ui.q("[data-request]").textContent = `GET /orders?page=${page}&size=20`; ui.q("[data-prev]").disabled = page === 1; ui.state(`page:${page}/5`); }; ui.on("[data-prev]", "click", () => { page = Math.max(1, page - 1); update(); }); ui.on("[data-next]", "click", () => { page = Math.min(5, page + 1); update(); }); update();
}

function renderFixedGrid(ctx) {
  const ui = mount(ctx, `<div data-scrollbox style="width:260px;overflow:auto"><table style="width:500px"><thead><tr><th style="position:sticky;top:0;left:0;background:white">固定列</th><th>Q1</th><th>Q2</th><th>Q3</th></tr></thead><tbody><tr><td style="position:sticky;left:0;background:white">客户 A</td><td>1</td><td>2</td><td>3</td></tr></tbody></table></div><button data-scroll-x>横向滚动</button>`);
  ui.on("[data-scroll-x]", "click", () => { ui.q("[data-scrollbox]").scrollLeft = 180; ui.state("scrollLeft:180;fixed:visible"); }); ui.state("scrollLeft:0;fixed:visible");
}

function renderMultiHeaderGrid(ctx) {
  const ui = mount(ctx, `<table><thead><tr><th rowspan="2">客户</th><th colspan="2" data-head>2026 年</th></tr><tr data-sub><th>Q1</th><th>Q2</th></tr></thead></table><button data-head-toggle>折叠年度表头</button>`);
  let open = true; ui.on("[data-head-toggle]", "click", () => { open = !open; ui.q("[data-sub]").hidden = !open; ui.q("[data-head]").colSpan = open ? 2 : 1; ui.state(`headerExpanded:${open}`); }); ui.state("headerExpanded:true");
}

function renderColumnGroupGrid(ctx) {
  const ui = mount(ctx, `<div><button data-group-toggle aria-expanded="true">财务列组</button></div><table><thead><tr><th data-finance>收入</th><th data-finance>成本</th><th>利润</th></tr></thead></table>`);
  let visible = true; ui.on("[data-group-toggle]", "click", () => { visible = !visible; ui.qa("[data-finance]").forEach((cell) => { cell.hidden = !visible; }); ui.q("[data-group-toggle]").setAttribute("aria-expanded", String(visible)); ui.state(`financeColumns:${visible ? 2 : 0}`); }); ui.state("financeColumns:2");
}

function renderColumnManager(ctx) {
  const ui = mount(ctx, `<label><input type="checkbox" data-column checked> 显示手机号列</label><table><thead><tr><th>客户</th><th data-phone>手机号</th></tr></thead></table>`);
  ui.on("[data-column]", "change", () => { const checked = ui.q("[data-column]").checked; ui.q("[data-phone]").hidden = !checked; ui.state(`phoneVisible:${checked}`); }); ui.state("phoneVisible:true");
}

function renderResizableGrid(ctx) {
  const ui = mount(ctx, `<table><thead><tr><th data-width style="width:120px">客户</th><th>金额</th></tr></thead></table><button data-widen>列宽 +40</button>`);
  let width = 120; ui.on("[data-widen]", "click", () => { width = width === 120 ? 160 : 120; ui.q("[data-width]").style.width = `${width}px`; ui.state(`columnWidth:${width}`); }); ui.state("columnWidth:120");
}

function createDomRuntime(stage, statusNode, toastNode) {

      else if (name === "text") node.textContent = value;
      else if (name === "dataset") Object.assign(node.dataset, value);

    return node;
  }

      type: "button",
      className: options.className || "btn",
      disabled: options.disabled || false,
      "data-action": action,
      "aria-label": options.ariaLabel || label,
      title: options.title || "",

  }

    control.id = id;

  }

    setText(statusNode, text);
    statusNode.dataset.state = String(state);

    return id;
  }
