en{color:#6d4d04}.side-foot{padding:10px 13px;border-top:1px solid #394552;color:#8997a7;font-size:11px}main{min-width:0;overflow:auto;padding:24px 28px 44px}.inner{width:min(1160px,100%);margin:auto}.hero{display:flex;justify-content:space-between;gap:20px}.eyebrow{color:#8b6200;font:700 11px Consolas}.hero h1{margin:3px 0 5px;font:700 clamp(24px,3vw,34px)/1.2 Bahnschrift,"Microsoft YaHei UI"}.hero h1 small{color:var(--muted);font-size:.48em;font-weight:500}.summary{max-width:790px;margin:0;color:var(--muted)}.pager{display:flex;gap:6px}.btn{min-height:44px;padding:7px 12px;border:1px solid #b8c3ce;background:#fff;color:var(--ink)}.btn.primary,.btn.active{border-color:#a87906;background:var(--accent);font-weight:700}.btn.danger{border-color:#b36a6a;color:#8a3030}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.fact{padding:11px 13px;border:1px solid var(--line);border-left:4px solid var(--accent);background:#fff}.fact:nth-child(2){border-left-color:var(--teal)}.fact:nth-child(3){border-left-color:var(--blue)}.label{color:var(--muted);font-size:10px;font-weight:700}.value{margin-top:3px;font:700 12px Consolas,"Microsoft YaHei UI";overflow-wrap:anywhere}.proto{margin-top:14px;border:1px solid #bfc9d3;background:#fff;box-shadow:0 12px 32px #18202b1f}.proto-head{min-height:52px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px 7px 14px;border-bottom:1px solid var(--line);background:#f8fafc}.proto-head .hint{color:var(--muted);font-size:11px}.actions{margin-left:auto;display:flex;gap:6px}.stage-wrap{padding:14px;background:#e8edf2}.stage{position:relative;min-height:350px;overflow:auto;border:1px solid #aeb9c5;background:#f7f9fb;background-image:linear-gradient(#e6ebf0 1px,transparent 1px),linear-gradient(90deg,#e6ebf0 1px,transparent 1px);background-size:20px 20px;padding:16px}.prototype-state{min-height:42px;padding:10px 13px;border-top:1px solid var(--line);border-left:4px solid var(--teal);background:#e3f0eb;font:12px Consolas,"Microsoft YaHei UI"}.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.note{padding:13px 14px;border:1px solid var(--line);background:#fff}.note h2{margin:0 0 5px;font-size:13px}.note p{margin:0;color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:8px;border:1px solid var(--line);background:#eef2f5}.panel{padding:12px;border:1px solid #aeb9c5;background:#fff}.row{display:flex;gap:10px;align-items:flex-start}.col{display:grid;gap:8px}.grid{display:grid;gap:9px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:10px;border:1px solid #c5ced8;background:#fff}.item.active,.selected{border-color:#b17f05;background:#fff8df}.field{display:grid;gap:5px;min-width:150px}.field-label{color:var(--muted);font-size:11px}.field input,.field select,.field textarea,input,select,textarea{min-height:40px;padding:7px 9px;border:1px solid #aeb9c5;background:#fff}.status{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.table-scroll{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border:1px solid var(--line);text-align:left}th{background:#e7edf2}.canvas{position:relative;min-width:620px;min-height:290px;background:#eef2f5}.node{position:absolute;min-width:110px;padding:10px;border:1px solid #91a1b1;background:#fff}.badge{display:inline-block;padding:3px 7px;border:1px solid #aeb9c5;background:#fff;font-size:11px}.toast{position:fixed;z-index:100;right:16px;bottom:16px;padding:10px 13px;color:#fff;background:#202936;border-left:4px solid var(--accent);opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:760px){.app{grid-template-rows:54px 1fr}.brand small{display:none}.menu{display:block}.shell{display:block;position:relative}.shell>aside{position:absolute;inset:0 auto 0 0;z-index:20;width:min(88vw,300px);transform:translateX(-102%);transition:.2s}.shell>aside.open{transform:none;box-shadow:12px 0 30px #0005}main{height:100%;padding:16px 12px 32px}.hero{display:block}.pager{margin-top:12px}.facts,.notes,.grid.two,.grid.three{grid-template-columns:1fr}.stage-wrap{padding:8px}.stage{min-height:360px;padding:10px}.actions{width:100%;margin-left:0}.btn{min-width:44px}}

</style></head><body><div class="app"><header><button class="menu" id="menu" type="button" aria-label="打开目录">目录</button><span class="mark"></span><div class="brand">数据模型 × 界面模式 <small>导航与工作区类原型手册</small></div><div class="count" id="count"></div></header><div class="shell"><aside id="side"><div class="side-head"><div class="side-label">15 · Navigation &amp; Workspace</div><input id="search" class="search" type="search" aria-label="搜索组件" placeholder="搜索组件名称或模型"></div><nav id="nav" class="nav" aria-label="组件目录"></nav><div class="side-foot">方向键切换 · Esc 收起目录</div></aside><main id="main" tabindex="-1"><div class="inner"><div class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="summary" id="summary"></p></div><div class="pager"><button class="btn" id="prev" type="button">上一项</button><button class="btn" id="next" type="button">下一项</button></div></div><div class="facts" id="facts"></div><section class="proto"><div class="proto-head"><strong>关键交互原型</strong><span class="hint">本组件拥有独立结构、动作和状态。</span><div class="actions"><button class="btn" id="reset" type="button">重置原型</button></div></div><section class="business-task" id="taskContext" hidden><div class="business-task-head"><div><h3>生产级任务场景</h3><p>先载入任务上下文，再完成组件主动作；异常与恢复路径用于评审边界。</p></div><span class="business-badge" id="taskLevel"></span></div><div class="business-grid" id="taskFields"></div><div class="business-notice business-warning"><strong>非理想场景</strong><span id="taskException"></span></div><div class="business-actions"><button class="btn primary" type="button" data-readiness-start>载入任务上下文</button><button class="btn danger" type="button" data-readiness-exception>注入非理想场景</button><button class="btn business-recovery" type="button" data-readiness-recovery>执行恢复动作</button></div><div class="business-grid"><div class="business-field"><span class="business-label">恢复方式</span><strong id="taskRecovery"></strong></div><div class="business-field"><span class="business-label">键盘路径</span><strong id="taskKeyboard"></strong></div></div><section class="business-system" id="systemReadiness" hidden><div><strong>职责边界</strong><ul id="systemResponsibilities"></ul><strong>跨模块时间线</strong><div class="business-timeline" id="systemTimeline"></div></div><div class="business-notice" id="systemCompensation"></div></section><div class="business-notice" id="readinessResult" role="status" aria-live="polite"></div></section><div class="stage-wrap"><div class="stage" id="stage"></div></div><div class="prototype-state" id="prototypeState" data-state="initial" aria-live="polite">初始状态</div></section><div class="notes" id="notes"></div></div></main></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>function mount(ctx, html) {
  ctx.stage.innerHTML = `<div class="prototype-demo">${html}<output class="prototype-state" data-demo-state aria-live="polite"></output></div>`;
  const q = (selector) => ctx.stage.querySelector(selector);
  const qa = (selector) => [...ctx.stage.querySelectorAll(selector)];
  const state = (value) => {
    q("[data-demo-state]").textContent = String(value);
    q("[data-demo-state]").dataset.state = String(value);
    ctx.setStatus(value, value);
  };
  const on = (selector, type, listener) => ctx.on(q(selector), type, listener);
  return { q, qa, state, on };
}

function renderMultiLevelMenu(ctx) {
  const ui = mount(ctx, `<nav aria-label="三级业务菜单"><button data-action aria-expanded="false">销售管理</button><ul data-branch hidden><li><button data-child>订单中心</button></li><li><button data-child>退货管理</button></li></ul></nav>`);
  let open = false;
  ui.on("[data-action]", "click", () => { open = !open; ui.q("[data-action]").setAttribute("aria-expanded", String(open)); ui.q("[data-branch]").hidden = !open; ui.state(`menu:${open ? "sales-expanded" : "collapsed"}`); });
  ui.state("menu:collapsed");
}

function renderDynamicRouteMenu(ctx) {
  const ui = mount(ctx, `<div><label>路由参数 <input data-param aria-label="路由参数" value="SO-2026-001"></label><button data-action>解析动态路由</button><code data-route>/orders/:id</code></div>`);
  ui.on("[data-action]", "click", () => { const id = ui.q("[data-param]").value.trim() || "new"; ui.q("[data-route]").textContent = `/orders/${id}`; ui.state(`route:/orders/${id}`); });
  ui.state("route:/orders/:id");
}

function renderPermissionMenu(ctx) {
  const ui = mount(ctx, `<label>模拟角色 <select data-role aria-label="模拟角色"><option value="viewer">访客</option><option value="admin">管理员</option></select></label><nav><button>数据看板</button><button data-admin hidden>权限配置</button></nav><button data-action>应用菜单权限</button>`);
  ui.on("[data-action]", "click", () => { ui.q("[data-role]").value = "admin"; const role = ui.q("[data-role]").value; ui.q("[data-admin]").hidden = role !== "admin"; ui.state(`visible:${role === "admin" ? 2 : 1};role:${role}`); });
  ui.state("visible:1;role:viewer");
}

function renderMegaMenu(ctx) {
  const ui = mount(ctx, `<div role="menu" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><button data-group="sales">销售<br><small>客户 · 商机</small></button><button data-group="supply">供应链<br><small>采购 · 库存</small></button><button data-group="finance">财务<br><small>应收 · 总账</small></button></div><button data-action>打开供应链分组</button>`);
  ui.on("[data-action]", "click", () => { ui.qa("[data-group]").forEach((node) => node.setAttribute("aria-current", String(node.dataset.group === "supply"))); ui.state("mega:group:supply;items:2"); });
  ui.state("mega:closed");
}

function renderBreadcrumb(ctx) {
  const ui = mount(ctx, `<nav aria-label="面包屑"><button data-crumb="home">工作台</button> / <button data-crumb="orders">订单</button> / <span data-current>订单详情</span></nav><button data-action>返回订单层级</button>`);
  ui.on("[data-action]", "click", () => { ui.q("[data-current]").textContent = "订单列表"; ui.state("breadcrumb:/workspace/orders"); });
  ui.state("breadcrumb:/workspace/orders/detail");
}

function renderTabWorkspace(ctx) {
  const ui = mount(ctx, `<div role="tablist"><button role="tab" data-tab="home" aria-selected="true">首页</button><button role="tab" data-tab="order" aria-selected="false">订单 SO-001 ·</button></div><article data-panel>首页概览</article><button data-action>切换并标记订单页已修改</button>`);
  ui.on("[data-action]", "click", () => { ui.qa("[data-tab]").forEach((tab) => tab.setAttribute("aria-selected", String(tab.dataset.tab === "order"))); ui.q('[data-tab="order"]').textContent = "订单 SO-001 *"; ui.q("[data-panel]").textContent = "订单编辑工作区（未保存）"; ui.state("tabs:active:order;dirty:true"); });
  ui.state("tabs:active:home;dirty:false");
}

function renderCommandPalette(ctx) {
  const ui = mount(ctx, `<div role="dialog" aria-label="命令面板"><label>命令 <input data-query aria-label="命令搜索" value="创建订单"></label><ul data-results><li>创建销售订单</li><li>创建采购订单</li></ul></div><button data-action>执行首个命令</button>`);
  ui.on("[data-action]", "click", () => { ui.q("[data-results]").replaceChildren(Object.assign(document.createElement("li"), { textContent: "已打开：新建销售订单" })); ui.state("command:create-sales-order:executed"); });
  ui.state("command:query:create-order");
}

function renderGlobalSearch(ctx) {
  const ui = mount(ctx, `<label>全局搜索 <input data-query aria-label="全局搜索" value="星河科技"></label><div data-results>等待搜索</div><button data-action>跨对象搜索</button>`);
  ui.on("[data-action]", "click", () => { const term = ui.q("[data-query]").value.trim(); ui.q("[data-results]").textContent = `客户：${term}（1） · 合同（2） · 工单（1）`; ui.state(`search:${term};groups:3;results:4`); });
  ui.state("search:idle");
}

function renderRecentVisits(ctx) {
  const ui = mount(ctx, `<ol data-list><li data-path="/customers/88">星河科技客户档案 · 09:42</li><li>/orders/SO-001 · 09:38</li></ol><div data-target>当前：工作台</div><button data-action>恢复最近页面</button>`);
  ui.on("[data-action]", "click", () => { ui.q("[data-target]").textContent = "当前：星河科技客户档案"; ui.state("recent:restored:/customers/88"); });
  ui.state("recent:current:/workspace");
}

function renderFavorites(ctx) {
  const ui = mount(ctx, `<div data-resource>销售日报</div><button data-action aria-pressed="false">加入收藏</button><div data-folder>我的收藏（0）</div>`);
  let saved = false;
  ui.on("[data-action]", "click", () => { saved = !saved; ui.q("[data-action]").setAttribute("aria-pressed", String(saved)); ui.q("[data-action]").textContent = saved ? "取消收藏" : "加入收藏"; ui.q("[data-folder]").textContent = `我的收藏（${saved ? 1 : 0}）`; ui.state(`favorite:${saved};resource:sales-report`); });
  ui.state("favorite:false;resource:sales-report");
}

function renderQuickLauncher(ctx) {
  const ui = mount(ctx, `<div data-launcher style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><button data-app="order">新建订单</button><button data-app="receipt">收款登记</button><button data-app="stock">库存查询</button></div><div data-opened>未启动</div><button data-action>启动收款登记</button>`);
  ui.on("[data-action]", "click", () => { ui.q("[data-opened]").textContent = "已启动：收款登记（快捷入口）"; ui.state("launcher:opened:receipt"); });
  ui.state("launcher:idle");
}

function renderStepper(ctx) {
  const ui = mount(ctx, `<ol><li data-step="1" aria-current="step">基本信息</li><li data-step="2">商品明细</li><li data-step="3">提交确认</li></ol><label>订单名称 <input data-name aria-label="订单名称"></label><button data-action>校验并进入下一步</button>`);
  ui.on("[data-action]", "click", () => { const valid = ui.q("[data-name]").value.trim().length > 0; if (valid) { ui.q('[data-step="1"]').removeAttribute("aria-current"); ui.q('[data-step="2"]').setAttribute("aria-current", "step"); } ui.state(valid ? "step:2;validation:passed" : "step:1;validation:name-required"); });
  ui.state("step:1;validation:pending");
}

function renderGuidedTour(ctx) {
  const ui = mount(ctx, `<div style="display:flex;gap:8px"><button data-target="filter">筛选</button><button data-target="export">导出</button></div><aside data-tip role="dialog">第 1/2 步：先设置筛选条件</aside><button data-action>下一条引导</button>`);
  let step = 1;
  ui.on("[data-action]", "click", () => { step = step === 1 ? 2 : 1; ui.q("[data-tip]").textContent = step === 2 ? "第 2/2 步：导出当前结果" : "第 1/2 步：先设置筛选条件"; ui.state(`tour:step:${step};target:${step === 2 ? "export" : "filter"}`); });
  ui.state("tour:step:1;target:filter");
}

function renderAnchorToc(ctx) {
  const ui = mount(ctx, `<nav aria-label="页内目录"><button data-anchor="overview">概览</button><button data-anchor="metrics">指标</button><button data-anchor="history">历史</button></nav><section data-section>概览章节</section><button data-action>跳到指标章节</button>`);
  ui.on("[data-action]", "click", () => { ui.q("[data-section]").textContent = "指标章节：销售额、转化率、客单价"; ui.q('[data-anchor="metrics"]').setAttribute("aria-current", "location"); ui.state("anchor:metrics;scrollTop:420"); });
  ui.state("anchor:overview;scrollTop:0");
}
