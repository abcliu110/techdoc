en{color:#6d4d04}.side-foot{padding:10px 13px;border-top:1px solid #394552;color:#8997a7;font-size:11px}main{min-width:0;overflow:auto;padding:24px 28px 44px}.inner{width:min(1160px,100%);margin:auto}.hero{display:flex;justify-content:space-between;gap:20px}.eyebrow{color:#8b6200;font:700 11px Consolas}.hero h1{margin:3px 0 5px;font:700 clamp(24px,3vw,34px)/1.2 Bahnschrift,"Microsoft YaHei UI"}.hero h1 small{color:var(--muted);font-size:.48em;font-weight:500}.summary{max-width:790px;margin:0;color:var(--muted)}.pager{display:flex;gap:6px}.btn{min-height:44px;padding:7px 12px;border:1px solid #b8c3ce;background:#fff;color:var(--ink)}.btn.primary,.btn.active{border-color:#a87906;background:var(--accent);font-weight:700}.btn.danger{border-color:#b36a6a;color:#8a3030}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.fact{padding:11px 13px;border:1px solid var(--line);border-left:4px solid var(--accent);background:#fff}.fact:nth-child(2){border-left-color:var(--teal)}.fact:nth-child(3){border-left-color:var(--blue)}.label{color:var(--muted);font-size:10px;font-weight:700}.value{margin-top:3px;font:700 12px Consolas,"Microsoft YaHei UI";overflow-wrap:anywhere}.proto{margin-top:14px;border:1px solid #bfc9d3;background:#fff;box-shadow:0 12px 32px #18202b1f}.proto-head{min-height:52px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px 7px 14px;border-bottom:1px solid var(--line);background:#f8fafc}.proto-head .hint{color:var(--muted);font-size:11px}.actions{margin-left:auto;display:flex;gap:6px}.stage-wrap{padding:14px;background:#e8edf2}.stage{position:relative;min-height:350px;overflow:auto;border:1px solid #aeb9c5;background:#f7f9fb;background-image:linear-gradient(#e6ebf0 1px,transparent 1px),linear-gradient(90deg,#e6ebf0 1px,transparent 1px);background-size:20px 20px;padding:16px}.prototype-state{min-height:42px;padding:10px 13px;border-top:1px solid var(--line);border-left:4px solid var(--teal);background:#e3f0eb;font:12px Consolas,"Microsoft YaHei UI"}.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.note{padding:13px 14px;border:1px solid var(--line);background:#fff}.note h2{margin:0 0 5px;font-size:13px}.note p{margin:0;color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:8px;border:1px solid var(--line);background:#eef2f5}.panel{padding:12px;border:1px solid #aeb9c5;background:#fff}.row{display:flex;gap:10px;align-items:flex-start}.col{display:grid;gap:8px}.grid{display:grid;gap:9px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:10px;border:1px solid #c5ced8;background:#fff}.item.active,.selected{border-color:#b17f05;background:#fff8df}.field{display:grid;gap:5px;min-width:150px}.field-label{color:var(--muted);font-size:11px}.field input,.field select,.field textarea,input,select,textarea{min-height:40px;padding:7px 9px;border:1px solid #aeb9c5;background:#fff}.status{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.table-scroll{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border:1px solid var(--line);text-align:left}th{background:#e7edf2}.canvas{position:relative;min-width:620px;min-height:290px;background:#eef2f5}.node{position:absolute;min-width:110px;padding:10px;border:1px solid #91a1b1;background:#fff}.badge{display:inline-block;padding:3px 7px;border:1px solid #aeb9c5;background:#fff;font-size:11px}.toast{position:fixed;z-index:100;right:16px;bottom:16px;padding:10px 13px;color:#fff;background:#202936;border-left:4px solid var(--accent);opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:760px){.app{grid-template-rows:54px 1fr}.brand small{display:none}.menu{display:block}.shell{display:block;position:relative}.shell>aside{position:absolute;inset:0 auto 0 0;z-index:20;width:min(88vw,300px);transform:translateX(-102%);transition:.2s}.shell>aside.open{transform:none;box-shadow:12px 0 30px #0005}main{height:100%;padding:16px 12px 32px}.hero{display:block}.pager{margin-top:12px}.facts,.notes,.grid.two,.grid.three{grid-template-columns:1fr}.stage-wrap{padding:8px}.stage{min-height:360px;padding:10px}.actions{width:100%;margin-left:0}.btn{min-width:44px}}
.business-task{display:grid;gap:10px;color:var(--ink)}.business-task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px;border:1px solid var(--line);background:#fff}.business-task-head h3{margin:0;font-size:15px}.business-task-head p{margin:2px 0 0;color:var(--muted);font-size:11px}.business-badge{padding:4px 7px;border:1px solid #9fabb7;background:#f4f7f9;font-size:10px;white-space:nowrap}.business-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.business-field{display:grid;gap:2px;padding:8px;border:1px solid var(--line);background:#fff}.business-label{color:var(--muted);font-size:10px}.business-decision{padding:9px 11px;border-left:4px solid var(--accent);background:#fff4d7}.business-success{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.business-error{padding:9px 11px;border-left:4px solid var(--red);background:#f6e7e7}.business-actions{display:flex;gap:7px;flex-wrap:wrap}.business-timeline{display:grid;gap:7px;padding:9px;border:1px solid var(--line);background:#fff}.business-timeline-item{display:grid;gap:1px;padding-left:9px;border-left:3px solid #aeb9c5}.business-timeline-item.done{border-color:var(--teal)}.business-timeline-item.error{border-color:var(--red)}.business-timeline-item span{color:var(--muted);font-size:10px}.business-system{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:10px}.business-kpis{display:grid;gap:8px}.business-kpi{padding:9px;border:1px solid var(--line);background:#fff}.business-kpi strong{display:block;font:700 18px Consolas}@media(max-width:760px){.business-grid,.business-system{grid-template-columns:1fr}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:3px solid #b27b00;outline-offset:2px}

</style></head><body><div class="app"><header><button class="menu" id="menu" type="button" aria-label="打开目录">目录</button><span class="mark"></span><div class="brand">数据模型 × 界面模式 <small>业务领域复合组件原型手册</small></div><div class="count" id="count"></div></header><div class="shell"><aside id="side"><div class="side-head"><div class="side-label">18 · Business Composite</div><input id="search" class="search" type="search" aria-label="搜索组件" placeholder="搜索组件名称或模型"></div><nav id="nav" class="nav" aria-label="组件目录"></nav><div class="side-foot">方向键切换 · Esc 收起目录</div></aside><main id="main" tabindex="-1"><div class="inner"><div class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="summary" id="summary"></p></div><div class="pager"><button class="btn" id="prev" type="button">上一项</button><button class="btn" id="next" type="button">下一项</button></div></div><div class="facts" id="facts"></div><section class="proto"><div class="proto-head"><strong>关键交互原型</strong><span class="hint">本组件拥有独立结构、动作和状态。</span><div class="actions"><button class="btn" id="reset" type="button">重置原型</button></div></div><section class="business-task" id="taskContext" hidden><div class="business-task-head"><div><h3>生产级任务场景</h3><p>先载入任务上下文，再完成组件主动作；异常与恢复路径用于评审边界。</p></div><span class="business-badge" id="taskLevel"></span></div><div class="business-grid" id="taskFields"></div><div class="business-notice business-warning"><strong>非理想场景</strong><span id="taskException"></span></div><div class="business-actions"><button class="btn primary" type="button" data-readiness-start>载入任务上下文</button><button class="btn danger" type="button" data-readiness-exception>注入非理想场景</button><button class="btn business-recovery" type="button" data-readiness-recovery>执行恢复动作</button></div><div class="business-grid"><div class="business-field"><span class="business-label">恢复方式</span><strong id="taskRecovery"></strong></div><div class="business-field"><span class="business-label">键盘路径</span><strong id="taskKeyboard"></strong></div></div><section class="business-system" id="systemReadiness" hidden><div><strong>职责边界</strong><ul id="systemResponsibilities"></ul><strong>跨模块时间线</strong><div class="business-timeline" id="systemTimeline"></div></div><div class="business-notice" id="systemCompensation"></div></section><div class="business-notice" id="readinessResult" role="status" aria-live="polite"></div></section><div class="stage-wrap"><div class="stage" id="stage"></div></div><div class="prototype-state" id="prototypeState" data-state="initial" aria-live="polite">初始状态</div></section><div class="notes" id="notes"></div></div></main></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>function mount(ctx, html) {
  ctx.stage.innerHTML = `<div class="prototype-demo">${html}<output class="prototype-state" data-demo-state aria-live="polite"></output></div>`;
  const q = (selector) => ctx.stage.querySelector(selector);
  const qa = (selector) => [...ctx.stage.querySelectorAll(selector)];
  const state = (value) => { q("[data-demo-state]").textContent = String(value); q("[data-demo-state]").dataset.state = String(value); ctx.setStatus(value, value); };
  const on = (selector, type, listener) => ctx.on(q(selector), type, listener);
  return { q, qa, state, on };
}

function renderSkuEditor(ctx) {
  const ui = mount(ctx, `<fieldset><legend>颜色</legend><label><input data-color type="checkbox" value="红" checked> 红</label><label><input data-color type="checkbox" value="蓝" checked> 蓝</label></fieldset><fieldset><legend>尺码</legend><label><input data-size type="checkbox" value="M" checked> M</label><label><input data-size type="checkbox" value="L" checked> L</label></fieldset><div data-skus>待生成</div><button data-action>生成 SKU 组合</button>`);
  ui.on("[data-action]", "click", () => { const colors = ui.qa("[data-color]:checked").map((x) => x.value); const sizes = ui.qa("[data-size]:checked").map((x) => x.value); ui.q("[data-skus]").textContent = colors.flatMap((color) => sizes.map((size) => `${color}-${size}`)).join("、"); ui.state(`sku:generated:${colors.length * sizes.length};dimensions:2`); });
  ui.state("sku:generated:0;dimensions:2");
}

function renderShoppingCart(ctx) {
  const ui = mount(ctx, `<table><tbody><tr><td>工业传感器</td><td>¥120</td><td><input data-qty type="number" value="2" min="1" aria-label="工业传感器数量"></td></tr></tbody></table><strong data-total>小计 ¥240</strong><button data-action>数量加一并重算</button>`);
  ui.on("[data-action]", "click", () => { const qty = Number(ui.q("[data-qty]").value) + 1; ui.q("[data-qty]").value = String(qty); ui.q("[data-total]").textContent = `小计 ¥${qty * 120}`; ui.state(`cart:qty:${qty};subtotal:${qty * 120}`); });
  ui.state("cart:qty:2;subtotal:240");
}

function renderCheckout(ctx) {
  const ui = mount(ctx, `<div>商品 ¥1000 + 运费 ¥20</div><label>优惠码 <input data-code aria-label="优惠码" value="SAVE100"></label><strong data-pay>应付 ¥1020</strong><button data-action>应用优惠并结算</button>`);
  ui.on("[data-action]", "click", () => { const discount = ui.q("[data-code]").value === "SAVE100" ? 100 : 0; ui.q("[data-pay]").textContent = `应付 ¥${1020 - discount}（优惠 ¥${discount}）`; ui.state(`checkout:discount:${discount};payable:${1020 - discount};ready:true`); });
  ui.state("checkout:discount:0;payable:1020;ready:false");
}

function renderOrderTracker(ctx) {
  const ui = mount(ctx, `<ol><li data-step="created">已下单</li><li data-step="paid">已支付</li><li data-step="shipped">待发货</li><li data-step="received">待收货</li></ol><button data-action>登记发货事件</button>`);
  ui.on("[data-action]", "click", () => { ui.q('[data-step="shipped"]').textContent = "已发货 · SF123456"; ui.q('[data-step="shipped"]').setAttribute("aria-current", "step"); ui.state("order:status:shipped;event:shipment-created"); });
  ui.state("order:status:paid;event:none");
}

function renderStockAllocation(ctx) {
  const ui = mount(ctx, `<div>需求 80 件</div><label>华东仓 <input data-east type="number" value="50" max="60" aria-label="华东仓分配量"></label><label>华南仓 <input data-south type="number" value="30" max="50" aria-label="华南仓分配量"></label><div data-result>待校验</div><button data-action>校验库存分配</button>`);
  ui.on("[data-action]", "click", () => { const east = Number(ui.q("[data-east]").value); const south = Number(ui.q("[data-south]").value); const valid = east <= 60 && south <= 50 && east + south === 80; ui.q("[data-result]").textContent = valid ? "分配成功：需求与库存容量匹配" : "分配失败：检查总量或仓库容量"; ui.state(`allocation:${valid ? "valid" : "invalid"};east:${east};south:${south};demand:80`); });
  ui.state("allocation:pending;demand:80");
}

function renderWarehouseMap(ctx) {
  const ui = mount(ctx, `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><button data-bin="A-01" data-used="8">A-01 · 8/10</button><button data-bin="A-02" data-used="10" disabled>A-02 · 已满</button><button data-bin="A-03" data-used="2">A-03 · 2/10</button></div><div data-result>未选库位</div><button data-action>向 A-01 上架 2 件</button>`);
  ui.on("[data-action]", "click", () => { const bin = ui.q('[data-bin="A-01"]'); bin.dataset.used = "10"; bin.textContent = "A-01 · 10/10（已满）"; bin.disabled = true; ui.q("[data-result]").textContent = "上架完成，A-01 剩余容量 0"; ui.state("warehouse:bin:A-01;used:10;capacity:10;full:true"); });
  ui.state("warehouse:bin:A-01;used:8;capacity:10;full:false");
}

function renderPriceRule(ctx) {
  const ui = mount(ctx, `<ol data-rules><li data-rule="vip">优先级 20：VIP 九折</li><li data-rule="contract">优先级 10：合同价 ¥88</li></ol><div data-result>原价 ¥100</div><button data-action>计算命中价格</button>`);
  ui.on("[data-action]", "click", () => { ui.q("[data-result]").textContent = "成交价 ¥88；命中合同价（优先级 10），VIP 规则未执行"; ui.state("price:88;winner:contract;priority:10"); });
  ui.state("price:100;winner:none");
}

function renderPromotionRule(ctx) {
  const ui = mount(ctx, `<label>订单金额 <input data-amount type="number" value="520" aria-label="订单金额"></label><label><input data-member type="checkbox" checked aria-label="会员身份"> 会员</label><div data-result>待判断</div><button data-action>判断满减资格</button>`);
  ui.on("[data-action]", "click", () => { const amount = Number(ui.q("[data-amount]").value); const eligible = amount >= 500 && ui.q("[data-member]").checked; ui.q("[data-result]").textContent = eligible ? "满足：会员满 500 减 50" : "不满足活动条件"; ui.state(`promotion:${eligible ? "eligible" : "ineligible"};discount:${eligible ? 50 : 0}`); });
  ui.state("promotion:pending;discount:0");
}

function renderContractEditor(ctx) {
  const ui = mount(ctx, `<label>里程碑 <input data-name aria-label="里程碑" value="项目验收"></label><label>付款比例 <input data-ratio type="number" aria-label="付款比例" value="40"></label><ol data-milestones><li>签约 30%</li><li>交付 30%</li></ol><button data-action>增加验收里程碑</button>`);
  ui.on("[data-action]", "click", () => { const item = document.createElement("li"); item.textContent = `${ui.q("[data-name]").value} ${ui.q("[data-ratio]").value}%`; ui.q("[data-milestones]").append(item); ui.state("contract:milestones:3;ratio-total:100;valid:true"); });
  ui.state("contract:milestones:2;ratio-total:60;valid:false");
}

function renderInvoiceEditor(ctx) {
  const ui = mount(ctx, `<label>不含税金额 <input data-net type="number" value="1000" aria-label="不含税金额"></label><label>税率 <select data-rate aria-label="税率"><option value="0.13">13%</option></select></label><div data-total>待计算</div><button data-action>计算税额与价税合计</button>`);
  ui.on("[data-action]", "click", () => { const net = Number(ui.q("[data-net]").value); const tax = Math.round(net * Number(ui.q("[data-rate]").value) * 100) / 100; ui.q("[data-total]").textContent = `税额 ¥${tax.toFixed(2)}；价税合计 ¥${(net + tax).toFixed(2)}`; ui.state(`invoice:net:${net};tax:${tax.toFixed(2)};gross:${(net + tax).toFixed(2)}`); });
  ui.state("invoice:uncomputed");
}

function renderVoucherEntry(ctx) {
  const ui = mount(ctx, `<table><tbody><tr><td>银行存款</td><td><input data-debit type="number" value="1000" aria-label="银行存款借方"></td><td>0</td></tr><tr><td>主营业务收入</td><td>0</td><td><input data-credit type="number" value="900" aria-label="主营业务收入贷方"></td></tr></tbody></table><div data-result>待校验</div><button data-action>校验借贷平衡</button>`);
  ui.on("[data-action]", "click", () => { const debit = Number(ui.q("[data-debit]").value); const credit = Number(ui.q("[data-credit]").value); const balanced = debit === credit; ui.q("[data-result]").textContent = balanced ? "借贷平衡" : `借贷不平，差额 ¥${Math.abs(debit - credit)}`; ui.state(`voucher:debit:${debit};credit:${credit};balanced:${balanced}`); });
  ui.state("voucher:unchecked");
}

function renderAccountTree(ctx) {
  const ui = mount(ctx, `<ul><li><button data-account aria-expanded="false">1002 银行存款</button><ul data-children hidden><li>100201 工商银行</li><li>100202 招商银行</li></ul></li></ul><button data-action>展开银行明细科目</button>`);
  ui.on("[data-action]", "click", () => { ui.q("[data-account]").setAttribute("aria-expanded", "true"); ui.q("[data-children]").hidden = false; ui.state("account:1002;expanded:true;children:2"); });
  ui.state("account:1002;expanded:false;children:0");
