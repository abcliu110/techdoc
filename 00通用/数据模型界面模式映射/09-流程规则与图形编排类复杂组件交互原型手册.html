.app,.shell,main,.inner,.hero,.proto,.stage-wrap,.stage,.prototype-demo{min-width:0;max-width:100%}.stage{width:100%}.prototype-demo{overflow:auto}img,svg,canvas{max-width:100%}
:root{--ink:#202936;--nav:#222d39;--paper:#fff;--ground:#edf1f5;--line:#cbd3dc;--muted:#667487;--accent:#e4a91a;--teal:#16796f;--blue:#356f9f;--red:#a84d4d}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font:14px/1.55 "Microsoft YaHei UI",sans-serif}button,input,select,textarea{font:inherit;letter-spacing:0}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:3px solid #e4a91a66;outline-offset:2px}.app{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr)}header{display:flex;align-items:center;gap:12px;padding:0 18px;color:#fff;background:#19222d;border-bottom:3px solid var(--accent)}.mark{width:7px;height:27px;background:var(--accent)}.brand{font:700 16px Bahnschrift,"Microsoft YaHei UI"}.brand small{margin-left:9px;color:#aeb9c6;font-size:12px;font-weight:500}.count{margin-left:auto;font:12px Consolas}.menu{display:none;min-width:44px;min-height:44px;border:1px solid #687788;color:#fff;background:transparent}.shell{min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr)}aside{min-height:0;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;color:#c6d0db;background:var(--nav)}.side-head{padding:14px 13px 10px;border-bottom:1px solid #394552}.side-label{margin-bottom:8px;color:#8290a0;font-size:10px;font-weight:700;text-transform:uppercase}.search{width:100%;min-height:44px;padding:8px 9px;border:1px solid #495766;color:#fff;background:#18212b}.nav{overflow:auto;padding:7px}.nav button{width:100%;display:grid;grid-template-columns:34px 1fr;border:0;border-left:3px solid transparent;padding:8px;color:#c6d0db;background:transparent;text-align:left}.nav button:hover{background:#2b3745}.nav button.active{color:#17202a;background:var(--accent);font-weight:700}.num{font:11px Consolas;color:#8593a3}.en{display:block;color:#8190a0;font-size:10px;font-weight:400}.nav button.active .en{color:#6d4d04}.side-foot{padding:10px 13px;border-top:1px solid #394552;color:#8997a7;font-size:11px}main{min-width:0;overflow:auto;padding:24px 28px 44px}.inner{width:min(1160px,100%);margin:auto}.hero{display:flex;justify-content:space-between;gap:20px}.eyebrow{color:#8b6200;font:700 11px Consolas}.hero h1{margin:3px 0 5px;font:700 clamp(24px,3vw,34px)/1.2 Bahnschrift,"Microsoft YaHei UI"}.hero h1 small{color:var(--muted);font-size:.48em;font-weight:500}.summary{max-width:790px;margin:0;color:var(--muted)}.pager{display:flex;gap:6px}.btn{min-height:44px;padding:7px 12px;border:1px solid #b8c3ce;background:#fff;color:var(--ink)}.btn.primary,.btn.active{border-color:#a87906;background:var(--accent);font-weight:700}.btn.danger{border-color:#b36a6a;color:#8a3030}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.fact{padding:11px 13px;border:1px solid var(--line);border-left:4px solid var(--accent);background:#fff}.fact:nth-child(2){border-left-color:var(--teal)}.fact:nth-child(3){border-left-color:var(--blue)}.label{color:var(--muted);font-size:10px;font-weight:700}.value{margin-top:3px;font:700 12px Consolas,"Microsoft YaHei UI";overflow-wrap:anywhere}.proto{margin-top:14px;border:1px solid #bfc9d3;background:#fff;box-shadow:0 12px 32px #18202b1f}.proto-head{min-height:52px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px 7px 14px;border-bottom:1px solid var(--line);background:#f8fafc}.proto-head .hint{color:var(--muted);font-size:11px}.actions{margin-left:auto;display:flex;gap:6px}.stage-wrap{padding:14px;background:#e8edf2}.stage{position:relative;min-height:350px;overflow:auto;border:1px solid #aeb9c5;background:#f7f9fb;background-image:linear-gradient(#e6ebf0 1px,transparent 1px),linear-gradient(90deg,#e6ebf0 1px,transparent 1px);background-size:20px 20px;padding:16px}.prototype-state{min-height:42px;padding:10px 13px;border-top:1px solid var(--line);border-left:4px solid var(--teal);background:#e3f0eb;font:12px Consolas,"Microsoft YaHei UI"}.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.note{padding:13px 14px;border:1px solid var(--line);background:#fff}.note h2{margin:0 0 5px;font-size:13px}.note p{margin:0;color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:8px;border:1px solid var(--line);background:#eef2f5}.panel{padding:12px;border:1px solid #aeb9c5;background:#fff}.row{display:flex;gap:10px;align-items:flex-start}.col{display:grid;gap:8px}.grid{display:grid;gap:9px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:10px;border:1px solid #c5ced8;background:#fff}.item.active,.selected{border-color:#b17f05;background:#fff8df}.field{display:grid;gap:5px;min-width:150px}.field-label{color:var(--muted);font-size:11px}.field input,.field select,.field textarea,input,select,textarea{min-height:40px;padding:7px 9px;border:1px solid #aeb9c5;background:#fff}.status{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.table-scroll{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border:1px solid var(--line);text-align:left}th{background:#e7edf2}.canvas{position:relative;min-width:620px;min-height:290px;background:#eef2f5}.node{position:absolute;min-width:110px;padding:10px;border:1px solid #91a1b1;background:#fff}.badge{display:inline-block;padding:3px 7px;border:1px solid #aeb9c5;background:#fff;font-size:11px}.toast{position:fixed;z-index:100;right:16px;bottom:16px;padding:10px 13px;color:#fff;background:#202936;border-left:4px solid var(--accent);opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:760px){.app{grid-template-rows:54px 1fr}.brand small{display:none}.menu{display:block}.shell{display:block;position:relative}.shell>aside{position:absolute;inset:0 auto 0 0;z-index:20;width:min(88vw,300px);transform:translateX(-102%);transition:.2s}.shell>aside.open{transform:none;box-shadow:12px 0 30px #0005}main{height:100%;padding:16px 12px 32px}.hero{display:block}.pager{margin-top:12px}.facts,.notes,.grid.two,.grid.three{grid-template-columns:1fr}.stage-wrap{padding:8px}.stage{min-height:360px;padding:10px}.actions{width:100%;margin-left:0}.btn{min-width:44px}}
.business-task{display:grid;gap:10px;color:var(--ink)}.business-task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px;border:1px solid var(--line);background:#fff}.business-task-head h3{margin:0;font-size:15px}.business-task-head p{margin:2px 0 0;color:var(--muted);font-size:11px}.business-badge{padding:4px 7px;border:1px solid #9fabb7;background:#f4f7f9;font-size:10px;white-space:nowrap}.business-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.business-field{display:grid;gap:2px;padding:8px;border:1px solid var(--line);background:#fff}.business-label{color:var(--muted);font-size:10px}.business-decision{padding:9px 11px;border-left:4px solid var(--accent);background:#fff4d7}.business-success{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.business-error{padding:9px 11px;border-left:4px solid var(--red);background:#f6e7e7}.business-actions{display:flex;gap:7px;flex-wrap:wrap}.business-timeline{display:grid;gap:7px;padding:9px;border:1px solid var(--line);background:#fff}.business-timeline-item{display:grid;gap:1px;padding-left:9px;border-left:3px solid #aeb9c5}.business-timeline-item.done{border-color:var(--teal)}.business-timeline-item.error{border-color:var(--red)}.business-timeline-item span{color:var(--muted);font-size:10px}.business-system{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:10px}.business-kpis{display:grid;gap:8px}.business-kpi{padding:9px;border:1px solid var(--line);background:#fff}.business-kpi strong{display:block;font:700 18px Consolas}@media(max-width:760px){.business-grid,.business-system{grid-template-columns:1fr}}

</style></head><body><div class="app"><header><button class="menu" id="menu" type="button" aria-label="打开目录">目录</button><span class="mark"></span><div class="brand">数据模型 × 界面模式 <small>流程、规则与图形编排类原型手册</small></div><div class="count" id="count"></div></header><div class="shell"><aside id="side"><div class="side-head"><div class="side-label">09 · Flow &amp; Rule</div><input id="search" class="search" type="search" aria-label="搜索组件" placeholder="搜索组件名称或模型"></div><nav id="nav" class="nav" aria-label="组件目录"></nav><div class="side-foot">方向键切换 · Esc 收起目录</div></aside><main id="main" tabindex="-1"><div class="inner"><div class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="summary" id="summary"></p></div><div class="pager"><button class="btn" id="prev" type="button">上一项</button><button class="btn" id="next" type="button">下一项</button></div></div><div class="facts" id="facts"></div><section class="proto"><div class="proto-head"><strong>关键交互原型</strong><span class="hint">本组件拥有独立结构、动作和状态。</span><div class="actions"><button class="btn" id="reset" type="button">重置原型</button></div></div><section class="business-task" id="taskContext" hidden><div class="business-task-head"><div><h3>生产级任务场景</h3><p>先载入任务上下文，再完成组件主动作；异常与恢复路径用于评审边界。</p></div><span class="business-badge" id="taskLevel"></span></div><div class="business-grid" id="taskFields"></div><div class="business-notice business-warning"><strong>非理想场景</strong><span id="taskException"></span></div><div class="business-actions"><button class="btn primary" type="button" data-readiness-start>载入任务上下文</button><button class="btn danger" type="button" data-readiness-exception>注入非理想场景</button><button class="btn business-recovery" type="button" data-readiness-recovery>执行恢复动作</button></div><div class="business-grid"><div class="business-field"><span class="business-label">恢复方式</span><strong id="taskRecovery"></strong></div><div class="business-field"><span class="business-label">键盘路径</span><strong id="taskKeyboard"></strong></div></div><section class="business-system" id="systemReadiness" hidden><div><strong>职责边界</strong><ul id="systemResponsibilities"></ul><strong>跨模块时间线</strong><div class="business-timeline" id="systemTimeline"></div></div><div class="business-notice" id="systemCompensation"></div></section><div class="business-notice" id="readinessResult" role="status" aria-live="polite"></div></section><div class="stage-wrap"><div class="stage" id="stage"></div></div><div class="prototype-state" id="prototypeState" data-state="initial" aria-live="polite">初始状态</div></section><div class="notes" id="notes"></div></div></main></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>const categoryNumber = "09";
function studio(ctx, title, ...children) { return ctx.el("div", { className: "demo col" }, ctx.el("h3", { text: title }), ...children); }
function indicator(ctx, text) { return ctx.el("div", { className: "status", text }); }
function renderWorkflowDesigner(ctx) { const flow = indicator(ctx, "开始 → 填单"); const connect = ctx.button("连接审批节点", "workflow-edge"); ctx.on(connect, "click", () => { flow.textContent = "开始 → 填单 → 审批；新增边 1"; ctx.setStatus("工作流边已创建", "edges:2"); }); ctx.stage.append(studio(ctx, "工作流", flow, connect)); return {}; }
function renderBpmnDesigner(ctx) { const token = indicator(ctx, "开始 → 排他网关"); const choose = ctx.button("选择金额≥1万分支", "bpmn-path"); ctx.on(choose, "click", () => { token.textContent = "Token 经过：开始 → 金额网关 → 经理审批"; ctx.setStatus("BPMN Token 进入经理分支", "path:manager"); }); ctx.stage.append(studio(ctx, "BPMN 网关", token, choose)); return {}; }
function renderApprovalFlow(ctx) { const flow = indicator(ctx, "申请 → 部门审批"); const branch = ctx.button("添加金额分支", "approval-branch"); ctx.on(branch, "click", () => { flow.textContent = "金额≥10,000 → 财务审批；否则 → 通过"; ctx.setStatus("审批条件分支已添加", "approval:branched"); }); ctx.stage.append(studio(ctx, "审批流", flow, branch)); return {}; }

function renderStateMachine(ctx) {
  let current = "draft"; const out = indicator(ctx, "当前状态：draft"); const transition = ctx.button("提交审核", "state-transition");
  ctx.on(transition, "click", () => { current = "review"; out.textContent = "当前状态：review；可执行 approve/reject"; ctx.setStatus("合法迁移 draft → review", `state:${current}`); }); ctx.stage.append(studio(ctx, "状态机", out, transition)); return { destroy() { current = "destroyed"; } };
}

function renderRuleDesigner(ctx) {
  const amount = ctx.el("input", { type: "number", value: 12000, "aria-label": "金额" }); const level = ctx.el("select", { "aria-label": "客户等级" }, ctx.el("option", { value: "VIP", text: "VIP" }), ctx.el("option", { value: "NORMAL", text: "普通" })); const out = indicator(ctx, "等待执行"); const run = ctx.button("执行所有条件", "rule-run");
  ctx.on(run, "click", () => { const hit = Number(amount.value) >= 10000 && level.value === "VIP"; out.textContent = `金额条件=${Number(amount.value) >= 10000}；等级条件=${level.value === "VIP"}；结果=${hit}`; ctx.setStatus(hit ? "规则命中" : "规则未命中", hit ? "rule:hit" : "rule:miss"); }); ctx.stage.append(studio(ctx, "规则输入一致性", amount, level, out, run)); return {};
}

function renderDecisionTable(ctx) {
  let vip = true; let amountHigh = false; const cellVip = ctx.button("VIP: 是", "decision-vip"); const cellAmount = ctx.button("金额≥1万: 否", "decision-amount"); const out = indicator(ctx, "等待命中策略"); const run = ctx.button("执行决策表", "decision-run");
  ctx.on(cellAmount, "click", () => { amountHigh = true; cellAmount.textContent = "金额≥1万: 是"; }); ctx.on(cellVip, "click", () => { vip = !vip; cellVip.textContent = `VIP: ${vip ? "是" : "否"}`; }); ctx.on(run, "click", () => { const action = vip && amountHigh ? "折扣 15%" : vip ? "折扣 8%" : "无折扣"; out.textContent = `输入 VIP=${vip}，高金额=${amountHigh}；命中：${action}`; ctx.setStatus(`决策结果：${action}`, `decision:${action}`); }); ctx.stage.append(studio(ctx, "决策表单元格", ctx.el("div", { className: "row" }, cellVip, cellAmount), out, run)); return {};
}

function renderDecisionTree(ctx) { const tree = indicator(ctx, "根：客户等级？"); const evaluate = ctx.button("沿 VIP 分支求值", "tree-evaluate"); ctx.on(evaluate, "click", () => { tree.textContent = "VIP → 金额≥1万 → 优惠 15%"; ctx.setStatus("决策树命中优惠叶子", "leaf:discount15"); }); ctx.stage.append(studio(ctx, "决策树", tree, evaluate)); return {}; }
function renderExpressionGraph(ctx) { const graph = indicator(ctx, "amount → multiply(taxRate)"); const connect = ctx.button("连接 round 节点", "expression-edge"); ctx.on(connect, "click", () => { graph.textContent = "amount → multiply → round；结果 107.00"; ctx.setStatus("表达式图结果 107", "expression:107"); }); ctx.stage.append(studio(ctx, "表达式图", graph, connect)); return {}; }
function renderDagDesigner(ctx) { const dag = indicator(ctx, "extract → transform"); const add = ctx.button("添加 load 依赖", "dag-edge"); ctx.on(add, "click", () => { dag.textContent = "extract → transform → load；拓扑序有效"; ctx.setStatus("DAG 增至 3 个节点", "dag:3"); }); ctx.stage.append(studio(ctx, "DAG 编排", dag, add)); return {}; }
function renderPipelineDesigner(ctx) { const stages = indicator(ctx, "读取[等待] → 清洗[等待]"); const run = ctx.button("运行下一阶段", "pipeline-run"); ctx.on(run, "click", () => { stages.textContent = "读取[完成] → 清洗[运行中] → 写入[等待]"; ctx.setStatus("清洗阶段运行中", "stage:cleaning"); }); ctx.stage.append(studio(ctx, "数据流水线", stages, run)); return {}; }
function renderJobOrchestrator(ctx) { const jobs = indicator(ctx, "作业 A / B / C 未调度"); const schedule = ctx.button("按依赖调度", "job-schedule"); ctx.on(schedule, "click", () => { jobs.textContent = "A[完成] → B[运行]；C 等待 B"; ctx.setStatus("作业 B 运行中", "job:B-running"); }); ctx.stage.append(studio(ctx, "作业编排", jobs, schedule)); return {}; }
function renderDependencyGraph(ctx) { const graph = indicator(ctx, "service-api → service-core"); const analyze = ctx.button("分析 core 变更", "dependency-impact"); ctx.on(analyze, "click", () => { graph.textContent = "影响：service-api、batch-job、3 个测试"; ctx.setStatus("依赖影响范围已计算", "impact:3"); }); ctx.stage.append(studio(ctx, "依赖影响", graph, analyze)); return {}; }
function renderServiceTopology(ctx) { const topology = indicator(ctx, "gateway → order-service"); const retry = ctx.button("模拟订单服务重试", "service-retry"); ctx.on(retry, "click", () => { topology.textContent = "gateway → order-service(第 2 次成功) → inventory"; ctx.setStatus("服务第 2 次重试成功", "retry:2-success"); }); ctx.stage.append(studio(ctx, "服务拓扑", topology, retry)); return {}; }
function renderNetworkTopology(ctx) { const network = indicator(ctx, "Router A：正常；Switch B：正常"); const disconnect = ctx.button("断开 Switch B", "network-health"); ctx.on(disconnect, "click", () => { network.textContent = "Switch B：离线；受影响终端 12"; ctx.setStatus("网络拓扑降级", "network:degraded"); }); ctx.stage.append(studio(ctx, "网络拓扑", network, disconnect)); return {}; }
function renderDataLineage(ctx) { const lineage = indicator(ctx, "raw_order → dwd_order"); const expand = ctx.button("展开下游", "lineage-expand"); ctx.on(expand, "click", () => { lineage.textContent = "raw_order → dwd_order → sales_report；影响 2 层"; ctx.setStatus("血缘下游已展开", "lineage:2"); }); ctx.stage.append(studio(ctx, "数据血缘", lineage, expand)); return {}; }
function renderErDesigner(ctx) { const relation = indicator(ctx, "Customer 实体"); const connect = ctx.button("关联 Order 1:N", "er-relation"); ctx.on(connect, "click", () => { relation.textContent = "Customer 1 ─── N Order；外键 customer_id"; ctx.setStatus("ER 一对多关系已创建", "relation:1-n"); }); ctx.stage.append(studio(ctx, "ER 关系", relation, connect)); return {}; }
function renderClassDiagram(ctx) { const classes = indicator(ctx, "OrderService"); const add = ctx.button("添加依赖 OrderRepository", "class-association"); ctx.on(add, "click", () => { classes.textContent = "OrderService ──uses──> OrderRepository"; ctx.setStatus("类依赖关联已创建", "association:uses"); }); ctx.stage.append(studio(ctx, "类图", classes, add)); return {}; }
function renderSequenceDiagram(ctx) { const messages = indicator(ctx, "User → UI"); const append = ctx.button("追加 API 调用", "sequence-message"); ctx.on(append, "click", () => { messages.textContent = "1 User→UI；2 UI→API；3 API→DB"; ctx.setStatus("时序消息增至 3 条", "messages:3"); }); ctx.stage.append(studio(ctx, "时序消息", messages, append)); return {}; }
function renderUseCaseDiagram(ctx) { const usecase = indicator(ctx, "参与者：销售"); const link = ctx.button("关联“创建订单”", "usecase-link"); ctx.on(link, "click", () => { usecase.textContent = "销售 ── 创建订单；权限 order.create"; ctx.setStatus("参与者与用例已关联", "usecase:linked"); }); ctx.stage.append(studio(ctx, "用例图", usecase, link)); return {}; }
