en{color:#6d4d04}.side-foot{padding:10px 13px;border-top:1px solid #394552;color:#8997a7;font-size:11px}main{min-width:0;overflow:auto;padding:24px 28px 44px}.inner{width:min(1160px,100%);margin:auto}.hero{display:flex;justify-content:space-between;gap:20px}.eyebrow{color:#8b6200;font:700 11px Consolas}.hero h1{margin:3px 0 5px;font:700 clamp(24px,3vw,34px)/1.2 Bahnschrift,"Microsoft YaHei UI"}.hero h1 small{color:var(--muted);font-size:.48em;font-weight:500}.summary{max-width:790px;margin:0;color:var(--muted)}.pager{display:flex;gap:6px}.btn{min-height:44px;padding:7px 12px;border:1px solid #b8c3ce;background:#fff;color:var(--ink)}.btn.primary,.btn.active{border-color:#a87906;background:var(--accent);font-weight:700}.btn.danger{border-color:#b36a6a;color:#8a3030}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.fact{padding:11px 13px;border:1px solid var(--line);border-left:4px solid var(--accent);background:#fff}.fact:nth-child(2){border-left-color:var(--teal)}.fact:nth-child(3){border-left-color:var(--blue)}.label{color:var(--muted);font-size:10px;font-weight:700}.value{margin-top:3px;font:700 12px Consolas,"Microsoft YaHei UI";overflow-wrap:anywhere}.proto{margin-top:14px;border:1px solid #bfc9d3;background:#fff;box-shadow:0 12px 32px #18202b1f}.proto-head{min-height:52px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px 7px 14px;border-bottom:1px solid var(--line);background:#f8fafc}.proto-head .hint{color:var(--muted);font-size:11px}.actions{margin-left:auto;display:flex;gap:6px}.stage-wrap{padding:14px;background:#e8edf2}.stage{position:relative;min-height:350px;overflow:auto;border:1px solid #aeb9c5;background:#f7f9fb;background-image:linear-gradient(#e6ebf0 1px,transparent 1px),linear-gradient(90deg,#e6ebf0 1px,transparent 1px);background-size:20px 20px;padding:16px}.prototype-state{min-height:42px;padding:10px 13px;border-top:1px solid var(--line);border-left:4px solid var(--teal);background:#e3f0eb;font:12px Consolas,"Microsoft YaHei UI"}.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.note{padding:13px 14px;border:1px solid var(--line);background:#fff}.note h2{margin:0 0 5px;font-size:13px}.note p{margin:0;color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:8px;border:1px solid var(--line);background:#eef2f5}.panel{padding:12px;border:1px solid #aeb9c5;background:#fff}.row{display:flex;gap:10px;align-items:flex-start}.col{display:grid;gap:8px}.grid{display:grid;gap:9px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:10px;border:1px solid #c5ced8;background:#fff}.item.active,.selected{border-color:#b17f05;background:#fff8df}.field{display:grid;gap:5px;min-width:150px}.field-label{color:var(--muted);font-size:11px}.field input,.field select,.field textarea,input,select,textarea{min-height:40px;padding:7px 9px;border:1px solid #aeb9c5;background:#fff}.status{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.table-scroll{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border:1px solid var(--line);text-align:left}th{background:#e7edf2}.canvas{position:relative;min-width:620px;min-height:290px;background:#eef2f5}.node{position:absolute;min-width:110px;padding:10px;border:1px solid #91a1b1;background:#fff}.badge{display:inline-block;padding:3px 7px;border:1px solid #aeb9c5;background:#fff;font-size:11px}.toast{position:fixed;z-index:100;right:16px;bottom:16px;padding:10px 13px;color:#fff;background:#202936;border-left:4px solid var(--accent);opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:760px){.app{grid-template-rows:54px 1fr}.brand small{display:none}.menu{display:block}.shell{display:block;position:relative}.shell>aside{position:absolute;inset:0 auto 0 0;z-index:20;width:min(88vw,300px);transform:translateX(-102%);transition:.2s}.shell>aside.open{transform:none;box-shadow:12px 0 30px #0005}main{height:100%;padding:16px 12px 32px}.hero{display:block}.pager{margin-top:12px}.facts,.notes,.grid.two,.grid.three{grid-template-columns:1fr}.stage-wrap{padding:8px}.stage{min-height:360px;padding:10px}.actions{width:100%;margin-left:0}.btn{min-width:44px}}
.business-task{display:grid;gap:10px;color:var(--ink)}.business-task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px;border:1px solid var(--line);background:#fff}.business-task-head h3{margin:0;font-size:15px}.business-task-head p{margin:2px 0 0;color:var(--muted);font-size:11px}.business-badge{padding:4px 7px;border:1px solid #9fabb7;background:#f4f7f9;font-size:10px;white-space:nowrap}.business-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.business-field{display:grid;gap:2px;padding:8px;border:1px solid var(--line);background:#fff}.business-label{color:var(--muted);font-size:10px}.business-decision{padding:9px 11px;border-left:4px solid var(--accent);background:#fff4d7}.business-success{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.business-error{padding:9px 11px;border-left:4px solid var(--red);background:#f6e7e7}.business-actions{display:flex;gap:7px;flex-wrap:wrap}.business-timeline{display:grid;gap:7px;padding:9px;border:1px solid var(--line);background:#fff}.business-timeline-item{display:grid;gap:1px;padding-left:9px;border-left:3px solid #aeb9c5}.business-timeline-item.done{border-color:var(--teal)}.business-timeline-item.error{border-color:var(--red)}.business-timeline-item span{color:var(--muted);font-size:10px}.business-system{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:10px}.business-kpis{display:grid;gap:8px}.business-kpi{padding:9px;border:1px solid var(--line);background:#fff}.business-kpi strong{display:block;font:700 18px Consolas}@media(max-width:760px){.business-grid,.business-system{grid-template-columns:1fr}}

</style></head><body><div class="app"><header><button class="menu" id="menu" type="button" aria-label="打开目录">目录</button><span class="mark"></span><div class="brand">数据模型 × 界面模式 <small>查询与筛选类原型手册</small></div><div class="count" id="count"></div></header><div class="shell"><aside id="side"><div class="side-head"><div class="side-label">05 · Query &amp; Filter</div><input id="search" class="search" type="search" aria-label="搜索组件" placeholder="搜索组件名称或模型"></div><nav id="nav" class="nav" aria-label="组件目录"></nav><div class="side-foot">方向键切换 · Esc 收起目录</div></aside><main id="main" tabindex="-1"><div class="inner"><div class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="summary" id="summary"></p></div><div class="pager"><button class="btn" id="prev" type="button">上一项</button><button class="btn" id="next" type="button">下一项</button></div></div><div class="facts" id="facts"></div><section class="proto"><div class="proto-head"><strong>关键交互原型</strong><span class="hint">本组件拥有独立结构、动作和状态。</span><div class="actions"><button class="btn" id="reset" type="button">重置原型</button></div></div><section class="business-task" id="taskContext" hidden><div class="business-task-head"><div><h3>生产级任务场景</h3><p>先载入任务上下文，再完成组件主动作；异常与恢复路径用于评审边界。</p></div><span class="business-badge" id="taskLevel"></span></div><div class="business-grid" id="taskFields"></div><div class="business-notice business-warning"><strong>非理想场景</strong><span id="taskException"></span></div><div class="business-actions"><button class="btn primary" type="button" data-readiness-start>载入任务上下文</button><button class="btn danger" type="button" data-readiness-exception>注入非理想场景</button><button class="btn business-recovery" type="button" data-readiness-recovery>执行恢复动作</button></div><div class="business-grid"><div class="business-field"><span class="business-label">恢复方式</span><strong id="taskRecovery"></strong></div><div class="business-field"><span class="business-label">键盘路径</span><strong id="taskKeyboard"></strong></div></div><section class="business-system" id="systemReadiness" hidden><div><strong>职责边界</strong><ul id="systemResponsibilities"></ul><strong>跨模块时间线</strong><div class="business-timeline" id="systemTimeline"></div></div><div class="business-notice" id="systemCompensation"></div></section><div class="business-notice" id="readinessResult" role="status" aria-live="polite"></div></section><div class="stage-wrap"><div class="stage" id="stage"></div></div><div class="prototype-state" id="prototypeState" data-state="initial" aria-live="polite">初始状态</div></section><div class="notes" id="notes"></div></div></main></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>const categoryNumber = "05";

function frame(ctx, title, ...children) {
  return ctx.el("div", { className: "demo col" }, ctx.el("h3", { text: title }), ...children);
}

function renderAdvancedQueryBuilder(ctx) {
  const list = ctx.el("div", { className: "col" }, ctx.el("div", { className: "item", text: "状态 = 已启用" }));
  const add = ctx.button("添加金额条件", "add-predicate");
  ctx.on(add, "click", () => { list.append(ctx.el("div", { className: "item active", text: "金额 > 10,000" })); ctx.setStatus("已构建 2 个 AND 条件", "predicates:2"); });
  ctx.stage.append(frame(ctx, "查询结构", list, add)); return {};
}

function renderConditionGroup(ctx) {
  const operator = ctx.el("strong", { text: "AND" }); const toggle = ctx.button("切换为 OR", "toggle-group");
  ctx.on(toggle, "click", () => { operator.textContent = "OR"; ctx.setStatus("条件组使用 OR", "operator:or"); });
  ctx.stage.append(frame(ctx, "条件组 A", ctx.el("div", { className: "item" }, "地区 = 华东 ", operator, " 金额 > 5000"), toggle)); return {};
}

function renderNestedLogicQuery(ctx) {
  const tree = ctx.el("div", { className: "item", text: "AND ├─ 状态=有效 └─ 地区=华东" }); const nest = ctx.button("嵌套 OR 分组", "nest-group");
  ctx.on(nest, "click", () => { tree.textContent = "AND ├─ 状态=有效 └─ OR ├─ 华东 └─ 华南"; ctx.setStatus("逻辑深度 2", "depth:2"); });
  ctx.stage.append(frame(ctx, "布尔表达式树", tree, nest)); return {};
}

function renderFilterPanel(ctx) {
  const result = ctx.el("div", { className: "status", text: "显示全部 128 条" }); const apply = ctx.button("应用筛选", "apply-filter");
  ctx.on(apply, "click", () => { result.textContent = "已应用：进行中 + 华东，共 23 条"; ctx.setStatus("筛选已应用", "applied:2"); });
  ctx.stage.append(frame(ctx, "综合筛选", ctx.el("div", { className: "row" }, ctx.el("select", { "aria-label": "状态" }, ctx.el("option", { text: "进行中" })), ctx.el("select", { "aria-label": "地区" }, ctx.el("option", { text: "华东" }))), result, apply)); return {};
}

function renderQuickFilterBar(ctx) {
  const count = ctx.el("div", { className: "status", text: "全部：96" }); const overdue = ctx.button("仅看逾期 8", "quick-overdue");
  ctx.on(overdue, "click", () => { count.textContent = "逾期：8"; overdue.classList.add("primary"); ctx.setStatus("快捷视图：逾期", "quick:overdue"); });
  ctx.stage.append(frame(ctx, "快捷视图", ctx.el("div", { className: "toolbar" }, overdue, ctx.button("我负责的 17", "quick-owned", { disabled: true })), count)); return {};
}

function renderFacetedFilter(ctx) {
  const result = ctx.el("div", { className: "status", text: "候选 64 条" }); const bucket = ctx.button("华东 (21)", "facet-east");
  ctx.on(bucket, "click", () => { bucket.classList.add("primary"); result.textContent = "华东 ∩ 已成交：12 条"; ctx.setStatus("分面桶已选择", "facets:east+won"); });
  ctx.stage.append(frame(ctx, "分面计数", ctx.el("div", { className: "row" }, bucket, ctx.el("span", { className: "pill", text: "已成交 (33)" })), result)); return {};
}

function renderSavedQuery(ctx) {
  const saved = ctx.el("div", { className: "col", text: "尚未保存" }); const save = ctx.button("保存当前查询", "save-query");
  ctx.on(save, "click", () => { saved.replaceChildren(ctx.el("div", { className: "item active", text: "本月高价值客户 · 3 条件" })); ctx.setStatus("查询快照已保存", "saved:1"); });
  ctx.stage.append(frame(ctx, "查询快照", ctx.el("input", { value: "本月高价值客户", "aria-label": "查询名称" }), saved, save)); return {};
}

function renderSavedView(ctx) {
  const columns = ctx.el("div", { className: "status", text: "列：客户 / 金额 / 状态" }); const restore = ctx.button("恢复销售视图", "restore-view");
  ctx.on(restore, "click", () => { columns.textContent = "列：阶段 / 负责人 / 预计成交；排序：金额↓"; ctx.setStatus("完整视图已恢复", "view:sales"); });
  ctx.stage.append(frame(ctx, "视图包含查询、排序和列", columns, restore)); return {};
}

function renderQueryTemplate(ctx) {
  const output = ctx.el("code", { className: "item", text: "createdAt >= :startDate" }); const resolve = ctx.button("代入本月参数", "resolve-template");
  ctx.on(resolve, "click", () => { output.textContent = "createdAt >= 2026-07-01"; ctx.setStatus("模板参数已解析", "resolved:2026-07"); });
  ctx.stage.append(frame(ctx, "参数化查询", ctx.el("input", { type: "date", value: "2026-07-01", "aria-label": "开始日期" }), output, resolve)); return {};
}

function renderDynamicQueryForm(ctx) {
  const fields = ctx.el("div", { className: "col" }, ctx.el("div", { className: "field", text: "字段：状态（枚举）" })); const load = ctx.button("加载金额字段元数据", "load-field");
  ctx.on(load, "click", () => { fields.append(ctx.el("div", { className: "field", text: "字段：金额（数值范围）" })); ctx.setStatus("Schema 生成 2 个查询字段", "fields:2"); });
  ctx.stage.append(frame(ctx, "元数据驱动查询", fields, load)); return {};
}

function renderQueryDsl(ctx) {
  const source = ctx.el("textarea", { rows: 4, "aria-label": "查询 DSL", value: "status = 'OPEN'" }); const diagnostic = ctx.el("div", { className: "status", text: "等待解析" }); const parse = ctx.button("解析 DSL", "parse-dsl");
  ctx.on(parse, "click", () => { const valid = /^\w+\s*(=|>|<)\s*.+/.test(source.value.trim()); diagnostic.textContent = valid ? "AST: Equal(status, OPEN)" : "语法错误：缺少操作符"; ctx.setStatus(valid ? "DSL 解析成功" : "DSL 解析失败", valid ? "dsl:valid" : "dsl:error"); });
  ctx.stage.append(frame(ctx, "查询 DSL", source, diagnostic, parse)); return {};
}

function renderFullTextSearch(ctx) {
  const excerpt = ctx.el("div", { className: "item", text: "季度经营分析与客户增长报告" }); const search = ctx.button("搜索“客户”", "search-text");
  ctx.on(search, "click", () => { excerpt.replaceChildren("季度经营分析与", ctx.el("mark", { text: "客户" }), "增长报告"); ctx.setStatus("命中 1 个片段", "hits:1"); });
  ctx.stage.append(frame(ctx, "全文索引", ctx.el("input", { value: "客户", "aria-label": "搜索词" }), excerpt, search)); return {};
}

function renderSemanticSearch(ctx) {
  const ranked = ctx.el("div", { className: "col", text: "等待理解意图" }); const run = ctx.button("按“续费风险”检索", "semantic-run");
  ctx.on(run, "click", () => { ranked.replaceChildren(ctx.el("div", { className: "item active", text: "客户流失预警 · 相似度 0.91" }), ctx.el("div", { className: "item", text: "合同到期清单 · 0.78" })); ctx.setStatus("语义结果已按相似度排序", "semantic:ranked"); });
  ctx.stage.append(frame(ctx, "语义检索", ranked, run)); return {};
}

function renderNaturalLanguageQuery(ctx) {
  const plan = ctx.el("div", { className: "status", text: "尚未解释" }); const interpret = ctx.button("解释问题", "interpret-query");
  ctx.on(interpret, "click", () => { plan.textContent = "计划：筛选 华东；聚合 销售额；排序 DESC；限制 10"; ctx.setStatus("置信度 93%，等待确认", "plan:review"); });
  ctx.stage.append(frame(ctx, "自然语言转查询", ctx.el("input", { value: "华东销售额前十", "aria-label": "自然语言问题" }), plan, interpret)); return {};
}

function renderDateRangeFilter(ctx) {
  const result = ctx.el("div", { className: "status", text: "未限定日期" }); const preset = ctx.button("选择最近 7 天", "date-preset");
  ctx.on(preset, "click", () => { result.textContent = "2026-07-08 00:00 — 2026-07-14 23:59（Asia/Shanghai）"; ctx.setStatus("日期范围有效", "date:last7"); });
  ctx.stage.append(frame(ctx, "日期区间", result, preset)); return {};
}

function renderNumericRangeFilter(ctx) {
  const min = ctx.el("input", { type: "number", value: 100, "aria-label": "最小值" }); const max = ctx.el("input", { type: "number", value: 500, "aria-label": "最大值" }); const apply = ctx.button("应用数值范围", "numeric-range");
  ctx.on(apply, "click", () => { const valid = Number(min.value) <= Number(max.value); ctx.setStatus(valid ? `[${min.value}, ${max.value}]` : "下界不能大于上界", valid ? "range:valid" : "range:error"); });
  ctx.stage.append(frame(ctx, "包含边界的数值区间", ctx.el("div", { className: "row" }, min, max), apply)); return {};
}

function renderTagFilter(ctx) {
  const selected = new Set(); const result = ctx.el("div", { className: "status", text: "未选择标签" }); const tag = ctx.button("重点客户", "toggle-tag");
  ctx.on(tag, "click", () => { selected.add("重点客户"); tag.classList.add("primary"); result.textContent = "全部匹配：重点客户"; ctx.setStatus("标签条件已启用", "tags:vip"); });
  ctx.stage.append(frame(ctx, "标签匹配", tag, result)); return {};
}

function renderCrossFieldQuery(ctx) {
