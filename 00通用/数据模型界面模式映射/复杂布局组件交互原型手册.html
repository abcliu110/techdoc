:root{--ink:#202936;--nav:#222d39;--paper:#fff;--ground:#edf1f5;--line:#cbd3dc;--muted:#667487;--accent:#e4a91a;--teal:#16796f;--blue:#356f9f;--red:#a84d4d}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font:14px/1.55 "Microsoft YaHei UI",sans-serif}button,input,select,textarea{font:inherit;letter-spacing:0}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:3px solid #e4a91a66;outline-offset:2px}.app{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr)}header{display:flex;align-items:center;gap:12px;padding:0 18px;color:#fff;background:#19222d;border-bottom:3px solid var(--accent)}.mark{width:7px;height:27px;background:var(--accent)}.brand{font:700 16px Bahnschrift,"Microsoft YaHei UI"}.brand small{margin-left:9px;color:#aeb9c6;font-size:12px;font-weight:500}.count{margin-left:auto;font:12px Consolas}.menu{display:none;min-width:44px;min-height:44px;border:1px solid #687788;color:#fff;background:transparent}.shell{min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr)}aside{min-height:0;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;color:#c6d0db;background:var(--nav)}.side-head{padding:14px 13px 10px;border-bottom:1px solid #394552}.side-label{margin-bottom:8px;color:#8290a0;font-size:10px;font-weight:700;text-transform:uppercase}.search{width:100%;min-height:44px;padding:8px 9px;border:1px solid #495766;color:#fff;background:#18212b}.nav{overflow:auto;padding:7px}.nav button{width:100%;display:grid;grid-template-columns:34px 1fr;border:0;border-left:3px solid transparent;padding:8px;color:#c6d0db;background:transparent;text-align:left}.nav button:hover{background:#2b3745}.nav button.active{color:#17202a;background:var(--accent);font-weight:700}.num{font:11px Consolas;color:#8593a3}.en{display:block;color:#8190a0;font-size:10px;font-weight:400}.nav button.active .en{color:#6d4d04}.side-foot{padding:10px 13px;border-top:1px solid #394552;color:#8997a7;font-size:11px}main{min-width:0;overflow:auto;padding:24px 28px 44px}.inner{width:min(1160px,100%);margin:auto}.hero{display:flex;justify-content:space-between;gap:20px}.eyebrow{color:#8b6200;font:700 11px Consolas}.hero h1{margin:3px 0 5px;font:700 clamp(24px,3vw,34px)/1.2 Bahnschrift,"Microsoft YaHei UI"}.hero h1 small{color:var(--muted);font-size:.48em;font-weight:500}.summary{max-width:790px;margin:0;color:var(--muted)}.pager{display:flex;gap:6px}.btn{min-height:44px;padding:7px 12px;border:1px solid #b8c3ce;background:#fff;color:var(--ink)}.btn.primary,.btn.active{border-color:#a87906;background:var(--accent);font-weight:700}.btn.danger{border-color:#b36a6a;color:#8a3030}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.fact{padding:11px 13px;border:1px solid var(--line);border-left:4px solid var(--accent);background:#fff}.fact:nth-child(2){border-left-color:var(--teal)}.fact:nth-child(3){border-left-color:var(--blue)}.label{color:var(--muted);font-size:10px;font-weight:700}.value{margin-top:3px;font:700 12px Consolas,"Microsoft YaHei UI";overflow-wrap:anywhere}.proto{margin-top:14px;border:1px solid #bfc9d3;background:#fff;box-shadow:0 12px 32px #18202b1f}.proto-head{min-height:52px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px 7px 14px;border-bottom:1px solid var(--line);background:#f8fafc}.proto-head .hint{color:var(--muted);font-size:11px}.actions{margin-left:auto;display:flex;gap:6px}.stage-wrap{padding:14px;background:#e8edf2}.stage{position:relative;min-height:350px;overflow:auto;border:1px solid #aeb9c5;background:#f7f9fb;background-image:linear-gradient(#e6ebf0 1px,transparent 1px),linear-gradient(90deg,#e6ebf0 1px,transparent 1px);background-size:20px 20px;padding:16px}.prototype-state{min-height:42px;padding:10px 13px;border-top:1px solid var(--line);border-left:4px solid var(--teal);background:#e3f0eb;font:12px Consolas,"Microsoft YaHei UI"}.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.note{padding:13px 14px;border:1px solid var(--line);background:#fff}.note h2{margin:0 0 5px;font-size:13px}.note p{margin:0;color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:8px;border:1px solid var(--line);background:#eef2f5}.panel{padding:12px;border:1px solid #aeb9c5;background:#fff}.row{display:flex;gap:10px;align-items:flex-start}.col{display:grid;gap:8px}.grid{display:grid;gap:9px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:10px;border:1px solid #c5ced8;background:#fff}.item.active,.selected{border-color:#b17f05;background:#fff8df}.field{display:grid;gap:5px;min-width:150px}.field-label{color:var(--muted);font-size:11px}.field input,.field select,.field textarea,input,select,textarea{min-height:40px;padding:7px 9px;border:1px solid #aeb9c5;background:#fff}.status{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.table-scroll{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border:1px solid var(--line);text-align:left}th{background:#e7edf2}.canvas{position:relative;min-width:620px;min-height:290px;background:#eef2f5}.node{position:absolute;min-width:110px;padding:10px;border:1px solid #91a1b1;background:#fff}.badge{display:inline-block;padding:3px 7px;border:1px solid #aeb9c5;background:#fff;font-size:11px}.toast{position:fixed;z-index:100;right:16px;bottom:16px;padding:10px 13px;color:#fff;background:#202936;border-left:4px solid var(--accent);opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:760px){.app{grid-template-rows:54px 1fr}.brand small{display:none}.menu{display:block}.shell{display:block;position:relative}.shell>aside{position:absolute;inset:0 auto 0 0;z-index:20;width:min(88vw,300px);transform:translateX(-102%);transition:.2s}.shell>aside.open{transform:none;box-shadow:12px 0 30px #0005}main{height:100%;padding:16px 12px 32px}.hero{display:block}.pager{margin-top:12px}.facts,.notes,.grid.two,.grid.three{grid-template-columns:1fr}.stage-wrap{padding:8px}.stage{min-height:360px;padding:10px}.actions{width:100%;margin-left:0}.btn{min-width:44px}}
.business-task{display:grid;gap:10px;color:var(--ink)}.business-task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px;border:1px solid var(--line);background:#fff}.business-task-head h3{margin:0;font-size:15px}.business-task-head p{margin:2px 0 0;color:var(--muted);font-size:11px}.business-badge{padding:4px 7px;border:1px solid #9fabb7;background:#f4f7f9;font-size:10px;white-space:nowrap}.business-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.business-field{display:grid;gap:2px;padding:8px;border:1px solid var(--line);background:#fff}.business-label{color:var(--muted);font-size:10px}.business-decision{padding:9px 11px;border-left:4px solid var(--accent);background:#fff4d7}.business-success{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.business-error{padding:9px 11px;border-left:4px solid var(--red);background:#f6e7e7}.business-actions{display:flex;gap:7px;flex-wrap:wrap}.business-timeline{display:grid;gap:7px;padding:9px;border:1px solid var(--line);background:#fff}.business-timeline-item{display:grid;gap:1px;padding-left:9px;border-left:3px solid #aeb9c5}.business-timeline-item.done{border-color:var(--teal)}.business-timeline-item.error{border-color:var(--red)}.business-timeline-item span{color:var(--muted);font-size:10px}.business-system{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:10px}.business-kpis{display:grid;gap:8px}.business-kpi{padding:9px;border:1px solid var(--line);background:#fff}.business-kpi strong{display:block;font:700 18px Consolas}@media(max-width:760px){.business-grid,.business-system{grid-template-columns:1fr}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:3px solid #b27b00;outline-offset:2px}
.business-notice{display:grid;gap:2px;padding:9px 11px;border-left:4px solid #7d8a97;background:#f1f4f6}.business-notice span{color:var(--muted);font-size:11px}.business-warning{padding:9px 11px;border-left:4px solid #a87906;background:#fff4d7}.business-actions button{min-width:44px}.business-recovery{border-color:#8f6a0a;background:#fff8df;font-weight:700}@media(max-width:760px){.business-task-head{display:grid}.business-badge{width:max-content;max-width:100%;white-space:normal}}

#stage[aria-disabled="true"]{filter:grayscale(.25);opacity:.68;cursor:not-allowed}#stage[aria-disabled="true"]::after{content:"业务操作已阻断，先执行恢复动作";position:absolute;inset:12px 12px auto auto;z-index:4;max-width:260px;padding:8px 10px;color:#fff;background:#7d2929;border-left:4px solid #efb0b0}.business-system{padding:10px;border:1px solid var(--line);background:#f6f8fa}.business-system ul{margin:7px 0 12px;padding-left:20px}
</style></head><body><div class="app"><header><button class="menu" id="menu" type="button" aria-label="打开目录">目录</button><span class="mark"></span><div class="brand">数据模型 × 界面模式 <small>布局类原型手册</small></div><div class="count" id="count"></div></header><div class="shell"><aside id="side"><div class="side-head"><div class="side-label">01 · Layout</div><input id="search" class="search" type="search" aria-label="搜索组件" placeholder="搜索组件名称或模型"></div><nav id="nav" class="nav" aria-label="组件目录"></nav><div class="side-foot">方向键切换 · Esc 收起目录</div></aside><main id="main" tabindex="-1"><div class="inner"><div class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="summary" id="summary"></p></div><div class="pager"><button class="btn" id="prev" type="button">上一项</button><button class="btn" id="next" type="button">下一项</button></div></div><div class="facts" id="facts"></div><section class="proto"><div class="proto-head"><strong>关键交互原型</strong><span class="hint">本组件拥有独立结构、动作和状态。</span><div class="actions"><button class="btn" id="reset" type="button">重置原型</button></div></div><section class="business-task" id="taskContext" hidden><div class="business-task-head"><div><h3>生产级任务场景</h3><p>先载入任务上下文，再完成组件主动作；异常与恢复路径用于评审边界。</p></div><span class="business-badge" id="taskLevel"></span></div><div class="business-grid" id="taskFields"></div><div class="business-notice business-warning"><strong>非理想场景</strong><span id="taskException"></span></div><div class="business-actions"><button class="btn primary" type="button" data-readiness-start>载入任务上下文</button><button class="btn danger" type="button" data-readiness-exception>注入非理想场景</button><button class="btn business-recovery" type="button" data-readiness-recovery>执行恢复动作</button></div><div class="business-grid"><div class="business-field"><span class="business-label">恢复方式</span><strong id="taskRecovery"></strong></div><div class="business-field"><span class="business-label">键盘路径</span><strong id="taskKeyboard"></strong></div></div><section class="business-system" id="systemReadiness" hidden><div><strong>职责边界</strong><ul id="systemResponsibilities"></ul><strong>跨模块时间线</strong><div class="business-timeline" id="systemTimeline"></div></div><div class="business-notice" id="systemCompensation"></div></section><div class="business-notice" id="readinessResult" role="status" aria-live="polite"></div></section><div class="stage-wrap"><div class="stage" id="stage"></div></div><div class="prototype-state" id="prototypeState" data-state="initial" aria-live="polite">初始状态</div></section><div class="notes" id="notes"></div></div></main></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>function mount(ctx, html) {
  ctx.stage.innerHTML = `<div class="prototype-demo">${html}<output class="prototype-state" data-state aria-live="polite"></output></div>`;
  const q = (selector) => ctx.stage.querySelector(selector);
  const qa = (selector) => [...ctx.stage.querySelectorAll(selector)];
  const state = (value) => { q("[data-state]").textContent = String(value); ctx.setStatus?.(value, value); };
  const on = (selector, type, listener) => ctx.on(q(selector), type, listener);
  return { q, qa, state, on };
}

function renderGridLayout(ctx) {
  const ui = mount(ctx, `<div data-grid style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><b>1</b><b>2</b><b>3</b><b style="grid-column:span 2">4—5</b></div><button data-columns>切换 4 列</button>`);
  let columns = 3;
  ui.on("[data-columns]", "click", () => { columns = columns === 3 ? 4 : 3; ui.q("[data-grid]").style.gridTemplateColumns = `repeat(${columns},1fr)`; ui.state(`columns:${columns}`); });
  ui.state("columns:3");
}

function renderRowColumn(ctx) {
  const ui = mount(ctx, `<div data-axis style="display:flex;gap:8px"><span>A</span><span>B</span><span>C</span></div><button data-direction>切换纵向</button>`);
  let vertical = false;
  ui.on("[data-direction]", "click", () => { vertical = !vertical; ui.q("[data-axis]").style.flexDirection = vertical ? "column" : "row"; ui.q("[data-direction]").textContent = vertical ? "切换横向" : "切换纵向"; ui.state(`direction:${vertical ? "column" : "row"}`); });
  ui.state("direction:row");
}

function renderFlexLayout(ctx) {
  const ui = mount(ctx, `<div data-flex style="display:flex;gap:8px"><span>固定</span><span data-grow style="background:#eef;padding:8px">弹性项</span><span>固定</span></div><button data-grow-toggle>分配剩余空间</button>`);
  let grow = 0;
  ui.on("[data-grow-toggle]", "click", () => { grow = grow ? 0 : 1; ui.q("[data-grow]").style.flexGrow = String(grow); ui.state(`grow:${grow}`); });
  ui.state("grow:0");
}

function renderMultiColumn(ctx) {
  const ui = mount(ctx, `<p data-flow style="column-count:2;column-gap:24px">第一段内容。第二段内容。第三段内容。第四段内容。第五段内容。第六段内容。</p><button data-column-count>使用 3 栏</button>`);
  let count = 2;
  ui.on("[data-column-count]", "click", () => { count = count === 2 ? 3 : 2; ui.q("[data-flow]").style.columnCount = String(count); ui.state(`columnCount:${count}`); });
  ui.state("columnCount:2");
}

function renderSplitPane(ctx) {
  const ui = mount(ctx, `<div style="display:flex;height:130px"><div data-left style="width:50%;background:#eef">列表</div><button data-divider aria-label="向右调整分隔条">↔</button><div style="flex:1;background:#efe">详情</div></div>`);
  let ratio = 50;
  ui.on("[data-divider]", "click", () => { ratio = ratio === 50 ? 65 : 50; ui.q("[data-left]").style.width = `${ratio}%`; ui.state(`ratio:${ratio}`); });
  ui.state("ratio:50");
}

function renderResizablePanel(ctx) {
  const ui = mount(ctx, `<div data-panel style="width:240px;height:100px;background:#eef">可调整面板</div><button data-resize>扩大面板</button>`);
  let width = 240;
  ui.on("[data-resize]", "click", () => { width = width === 240 ? 340 : 240; ui.q("[data-panel]").style.width = `${width}px`; ui.state(`width:${width}`); });
  ui.state("width:240");
}

function renderDockLayout(ctx) {
  const ui = mount(ctx, `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div data-tool style="padding:16px;background:#eef">工具箱</div><div data-dock style="padding:16px;border:2px dashed #999">右侧停靠区</div></div><button data-dock-action>停靠工具箱</button>`);
  let dock = "left";
  ui.on("[data-dock-action]", "click", () => { dock = dock === "left" ? "right" : "left"; const tool = ui.q("[data-tool]"); const zone = ui.q("[data-dock]"); dock === "right" ? zone.append(tool) : zone.parentElement.prepend(tool); ui.state(`dock:${dock}`); });
  ui.state("dock:left");
}

function renderTabsLayout(ctx) {
  const ui = mount(ctx, `<div role="tablist"><button role="tab" data-tab="overview" aria-selected="true">概览</button><button role="tab" data-tab="history" aria-selected="false">历史</button></div><div data-panel>概览内容</div>`);
  ui.qa("[data-tab]").forEach((tab) => ctx.on(tab, "click", () => { ui.qa("[data-tab]").forEach((item) => item.setAttribute("aria-selected", String(item === tab))); ui.q("[data-panel]").textContent = tab.dataset.tab === "overview" ? "概览内容" : "历史记录内容"; ui.state(`active:${tab.dataset.tab}`); }));
  ui.state("active:overview");
}

function renderAccordion(ctx) {
  const ui = mount(ctx, `<button data-section aria-expanded="false">高级设置</button><div data-content hidden>缓存、超时、重试</div>`);
  let open = false;
  ui.on("[data-section]", "click", () => { open = !open; ui.q("[data-section]").setAttribute("aria-expanded", String(open)); ui.q("[data-content]").hidden = !open; ui.state(`expanded:${open}`); });
  ui.state("expanded:false");
}

function renderCardLayout(ctx) {
  const ui = mount(ctx, `<div data-cards style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px"><article style="padding:18px;background:#eef">销售额</article><article style="padding:18px;background:#efe">订单数</article></div><button data-density>切换紧凑密度</button>`);
  let compact = false;
  ui.on("[data-density]", "click", () => { compact = !compact; ui.qa("article").forEach((card) => { card.style.padding = compact ? "6px" : "18px"; }); ui.state(`density:${compact ? "compact" : "comfortable"}`); });
  ui.state("density:comfortable");
}

function renderMasonry(ctx) {
  const ui = mount(ctx, `<div data-masonry style="columns:2;column-gap:10px"><div style="height:45px;background:#eef">A</div><div style="height:85px;background:#efe">B</div><div style="height:65px;background:#fee">C</div></div><button data-balance>重新平衡瀑布流</button>`);
  let columns = 2;
  ui.on("[data-balance]", "click", () => { columns = columns === 2 ? 3 : 2; ui.q("[data-masonry]").style.columns = String(columns); ui.state(`masonryColumns:${columns}`); });
  ui.state("masonryColumns:2");
}

function renderDashboard(ctx) {
  const ui = mount(ctx, `<div data-dashboard style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><article data-widget="sales">销售</article><article data-widget="stock">库存</article></div><button data-widget-add>添加预警组件</button>`);
  let added = false;
  ui.on("[data-widget-add]", "click", () => { added = !added; const old = ui.q('[data-widget="alert"]'); if (old) old.remove(); else { const article = document.createElement("article"); article.dataset.widget = "alert"; article.textContent = "库存预警"; ui.q("[data-dashboard]").append(article); } ui.state(`widgets:${added ? 3 : 2}`); });
  ui.state("widgets:2");
}

function renderDragGrid(ctx) {
  const ui = mount(ctx, `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><button data-cell="1">订单</button><button data-cell="2">客户</button><button data-cell="3">库存</button></div><button data-move>将订单移动到第 3 格</button>`);
  let position = 1;
  ui.on("[data-move]", "click", () => { position = position === 1 ? 3 : 1; const order = ui.q('[data-cell="1"]'); const cells = ui.qa("[data-cell]"); position === 3 ? cells[2].after(order) : cells[0].before(order); ui.state(`orderPosition:${position}`); });
  ui.state("orderPosition:1");
}

function renderFreeCanvas(ctx) {
  const ui = mount(ctx, `<div data-canvas style="height:150px;position:relative;border:1px solid #aaa"><button data-node style="position:absolute;left:20px;top:20px">节点 A</button></div><button data-move-node>移动节点</button>`);
  let moved = false;
  ui.on("[data-move-node]", "click", () => { moved = !moved; Object.assign(ui.q("[data-node]").style, { left: moved ? "150px" : "20px", top: moved ? "80px" : "20px" }); ui.state(`node:${moved ? "150,80" : "20,20"}`); });
  ui.state("node:20,20");
}

function renderResponsiveLayout(ctx) {
  const ui = mount(ctx, `<div data-viewport style="width:720px;max-width:100%;border:1px solid #aaa"><nav data-responsive-nav>桌面导航</nav><main>响应式内容</main></div><button data-device>预览手机宽度</button>`);
  let mobile = false;
  ui.on("[data-device]", "click", () => { mobile = !mobile; ui.q("[data-viewport]").style.width = mobile ? "360px" : "720px"; ui.q("[data-responsive-nav]").textContent = mobile ? "☰" : "桌面导航"; ui.state(`viewport:${mobile ? 360 : 720}`); });
  ui.state("viewport:720");
}

function renderAdaptiveBreakpoint(ctx) {
  const ui = mount(ctx, `<div data-breakpoint style="display:grid;grid-template-columns:2fr 1fr"><main>主内容</main><aside data-adaptive>辅助信息</aside></div><button data-breakpoint-toggle>进入窄屏断点</button>`);
  let breakpoint = "lg";
  ui.on("[data-breakpoint-toggle]", "click", () => { breakpoint = breakpoint === "lg" ? "sm" : "lg"; ui.q("[data-breakpoint]").style.gridTemplateColumns = breakpoint === "sm" ? "1fr" : "2fr 1fr"; ui.q("[data-adaptive]").hidden = breakpoint === "sm"; ui.state(`breakpoint:${breakpoint}`); });
  ui.state("breakpoint:lg");
