:root{--ink:#202936;--nav:#222d39;--paper:#fff;--ground:#edf1f5;--line:#cbd3dc;--muted:#667487;--accent:#e4a91a;--teal:#16796f;--blue:#356f9f;--red:#a84d4d}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font:14px/1.55 "Microsoft YaHei UI",sans-serif}button,input,select,textarea{font:inherit;letter-spacing:0}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:3px solid #e4a91a66;outline-offset:2px}.app{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr)}header{display:flex;align-items:center;gap:12px;padding:0 18px;color:#fff;background:#19222d;border-bottom:3px solid var(--accent)}.mark{width:7px;height:27px;background:var(--accent)}.brand{font:700 16px Bahnschrift,"Microsoft YaHei UI"}.brand small{margin-left:9px;color:#aeb9c6;font-size:12px;font-weight:500}.count{margin-left:auto;font:12px Consolas}.menu{display:none;min-width:44px;min-height:44px;border:1px solid #687788;color:#fff;background:transparent}.shell{min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr)}aside{min-height:0;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;color:#c6d0db;background:var(--nav)}.side-head{padding:14px 13px 10px;border-bottom:1px solid #394552}.side-label{margin-bottom:8px;color:#8290a0;font-size:10px;font-weight:700;text-transform:uppercase}.search{width:100%;min-height:44px;padding:8px 9px;border:1px solid #495766;color:#fff;background:#18212b}.nav{overflow:auto;padding:7px}.nav button{width:100%;display:grid;grid-template-columns:34px 1fr;border:0;border-left:3px solid transparent;padding:8px;color:#c6d0db;background:transparent;text-align:left}.nav button:hover{background:#2b3745}.nav button.active{color:#17202a;background:var(--accent);font-weight:700}.num{font:11px Consolas;color:#8593a3}.en{display:block;color:#8190a0;font-size:10px;font-weight:400}.nav button.active .en{color:#6d4d04}.side-foot{padding:10px 13px;border-top:1px solid #394552;color:#8997a7;font-size:11px}main{min-width:0;overflow:auto;padding:24px 28px 44px}.inner{width:min(1160px,100%);margin:auto}.hero{display:flex;justify-content:space-between;gap:20px}.eyebrow{color:#8b6200;font:700 11px Consolas}.hero h1{margin:3px 0 5px;font:700 clamp(24px,3vw,34px)/1.2 Bahnschrift,"Microsoft YaHei UI"}.hero h1 small{color:var(--muted);font-size:.48em;font-weight:500}.summary{max-width:790px;margin:0;color:var(--muted)}.pager{display:flex;gap:6px}.btn{min-height:44px;padding:7px 12px;border:1px solid #b8c3ce;background:#fff;color:var(--ink)}.btn.primary,.btn.active{border-color:#a87906;background:var(--accent);font-weight:700}.btn.danger{border-color:#b36a6a;color:#8a3030}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.fact{padding:11px 13px;border:1px solid var(--line);border-left:4px solid var(--accent);background:#fff}.fact:nth-child(2){border-left-color:var(--teal)}.fact:nth-child(3){border-left-color:var(--blue)}.label{color:var(--muted);font-size:10px;font-weight:700}.value{margin-top:3px;font:700 12px Consolas,"Microsoft YaHei UI";overflow-wrap:anywhere}.proto{margin-top:14px;border:1px solid #bfc9d3;background:#fff;box-shadow:0 12px 32px #18202b1f}.proto-head{min-height:52px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px 7px 14px;border-bottom:1px solid var(--line);background:#f8fafc}.proto-head .hint{color:var(--muted);font-size:11px}.actions{margin-left:auto;display:flex;gap:6px}.stage-wrap{padding:14px;background:#e8edf2}.stage{position:relative;min-height:350px;overflow:auto;border:1px solid #aeb9c5;background:#f7f9fb;background-image:linear-gradient(#e6ebf0 1px,transparent 1px),linear-gradient(90deg,#e6ebf0 1px,transparent 1px);background-size:20px 20px;padding:16px}.prototype-state{min-height:42px;padding:10px 13px;border-top:1px solid var(--line);border-left:4px solid var(--teal);background:#e3f0eb;font:12px Consolas,"Microsoft YaHei UI"}.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.note{padding:13px 14px;border:1px solid var(--line);background:#fff}.note h2{margin:0 0 5px;font-size:13px}.note p{margin:0;color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:8px;border:1px solid var(--line);background:#eef2f5}.panel{padding:12px;border:1px solid #aeb9c5;background:#fff}.row{display:flex;gap:10px;align-items:flex-start}.col{display:grid;gap:8px}.grid{display:grid;gap:9px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:10px;border:1px solid #c5ced8;background:#fff}.item.active,.selected{border-color:#b17f05;background:#fff8df}.field{display:grid;gap:5px;min-width:150px}.field-label{color:var(--muted);font-size:11px}.field input,.field select,.field textarea,input,select,textarea{min-height:40px;padding:7px 9px;border:1px solid #aeb9c5;background:#fff}.status{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.table-scroll{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border:1px solid var(--line);text-align:left}th{background:#e7edf2}.canvas{position:relative;min-width:620px;min-height:290px;background:#eef2f5}.node{position:absolute;min-width:110px;padding:10px;border:1px solid #91a1b1;background:#fff}.badge{display:inline-block;padding:3px 7px;border:1px solid #aeb9c5;background:#fff;font-size:11px}.toast{position:fixed;z-index:100;right:16px;bottom:16px;padding:10px 13px;color:#fff;background:#202936;border-left:4px solid var(--accent);opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:760px){.app{grid-template-rows:54px 1fr}.brand small{display:none}.menu{display:block}.shell{display:block;position:relative}.shell>aside{position:absolute;inset:0 auto 0 0;z-index:20;width:min(88vw,300px);transform:translateX(-102%);transition:.2s}.shell>aside.open{transform:none;box-shadow:12px 0 30px #0005}main{height:100%;padding:16px 12px 32px}.hero{display:block}.pager{margin-top:12px}.facts,.notes,.grid.two,.grid.three{grid-template-columns:1fr}.stage-wrap{padding:8px}.stage{min-height:360px;padding:10px}.actions{width:100%;margin-left:0}.btn{min-width:44px}}
.business-task{display:grid;gap:10px;color:var(--ink)}.business-task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px;border:1px solid var(--line);background:#fff}.business-task-head h3{margin:0;font-size:15px}.business-task-head p{margin:2px 0 0;color:var(--muted);font-size:11px}.business-badge{padding:4px 7px;border:1px solid #9fabb7;background:#f4f7f9;font-size:10px;white-space:nowrap}.business-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.business-field{display:grid;gap:2px;padding:8px;border:1px solid var(--line);background:#fff}.business-label{color:var(--muted);font-size:10px}.business-decision{padding:9px 11px;border-left:4px solid var(--accent);background:#fff4d7}.business-success{padding:9px 11px;border-left:4px solid var(--teal);background:#e3f0eb}.business-error{padding:9px 11px;border-left:4px solid var(--red);background:#f6e7e7}.business-actions{display:flex;gap:7px;flex-wrap:wrap}.business-timeline{display:grid;gap:7px;padding:9px;border:1px solid var(--line);background:#fff}.business-timeline-item{display:grid;gap:1px;padding-left:9px;border-left:3px solid #aeb9c5}.business-timeline-item.done{border-color:var(--teal)}.business-timeline-item.error{border-color:var(--red)}.business-timeline-item span{color:var(--muted);font-size:10px}.business-system{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:10px}.business-kpis{display:grid;gap:8px}.business-kpi{padding:9px;border:1px solid var(--line);background:#fff}.business-kpi strong{display:block;font:700 18px Consolas}@media(max-width:760px){.business-grid,.business-system{grid-template-columns:1fr}}

.business-notice{display:grid;gap:2px;padding:9px 11px;border-left:4px solid #7d8a97;background:#f1f4f6}.business-notice span{color:var(--muted);font-size:11px}.business-warning{padding:9px 11px;border-left:4px solid #a87906;background:#fff4d7}.business-actions button{min-width:44px}.business-recovery{border-color:#8f6a0a;background:#fff8df;font-weight:700}@media(max-width:760px){.business-task-head{display:grid}.business-badge{width:max-content;max-width:100%;white-space:normal}}

</style></head><body><div class="app"><header><button class="menu" id="menu" type="button" aria-label="打开目录">目录</button><span class="mark"></span><div class="brand">数据模型 × 界面模式 <small>表单与数据录入类原型手册</small></div><div class="count" id="count"></div></header><div class="shell"><aside id="side"><div class="side-head"><div class="side-label">04 · Form &amp; Input</div><input id="search" class="search" type="search" aria-label="搜索组件" placeholder="搜索组件名称或模型"></div><nav id="nav" class="nav" aria-label="组件目录"></nav><div class="side-foot">方向键切换 · Esc 收起目录</div></aside><main id="main" tabindex="-1"><div class="inner"><div class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="summary" id="summary"></p></div><div class="pager"><button class="btn" id="prev" type="button">上一项</button><button class="btn" id="next" type="button">下一项</button></div></div><div class="facts" id="facts"></div><section class="proto"><div class="proto-head"><strong>关键交互原型</strong><span class="hint">本组件拥有独立结构、动作和状态。</span><div class="actions"><button class="btn" id="reset" type="button">重置原型</button></div></div><section class="business-task" id="taskContext" hidden><div class="business-task-head"><div><h3>生产级任务场景</h3><p>先载入任务上下文，再完成组件主动作；异常与恢复路径用于评审边界。</p></div><span class="business-badge" id="taskLevel"></span></div><div class="business-grid" id="taskFields"></div><div class="business-notice business-warning"><strong>非理想场景</strong><span id="taskException"></span></div><div class="business-actions"><button class="btn primary" type="button" data-readiness-start>载入任务上下文</button><button class="btn danger" type="button" data-readiness-exception>注入非理想场景</button><button class="btn business-recovery" type="button" data-readiness-recovery>执行恢复动作</button></div><div class="business-grid"><div class="business-field"><span class="business-label">恢复方式</span><strong id="taskRecovery"></strong></div><div class="business-field"><span class="business-label">键盘路径</span><strong id="taskKeyboard"></strong></div></div><section class="business-system" id="systemReadiness" hidden><div><strong>职责边界</strong><ul id="systemResponsibilities"></ul><strong>跨模块时间线</strong><div class="business-timeline" id="systemTimeline"></div></div><div class="business-notice" id="systemCompensation"></div></section><div class="business-notice" id="readinessResult" role="status" aria-live="polite"></div></section><div class="stage-wrap"><div class="stage" id="stage"></div></div><div class="prototype-state" id="prototypeState" data-state="initial" aria-live="polite">初始状态</div></section><div class="notes" id="notes"></div></div></main></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>function mount(ctx, html) {
  ctx.stage.innerHTML = `<div class="prototype-demo">${html}<output data-state aria-live="polite"></output></div>`;
  const q=(s)=>ctx.stage.querySelector(s),qa=(s)=>[...ctx.stage.querySelectorAll(s)];
  const state=(value)=>{q("[data-state]").textContent=String(value);ctx.setStatus?.(value,value);};
  const on=(s,t,l)=>ctx.on(q(s),t,l);
  return {q,qa,state,on};
}

function renderStandardForm(ctx){const ui=mount(ctx,`<label>客户名称 <input data-name required value="海风科技"></label><label>联系人 <input data-contact value="林经理"></label><button data-submit>提交客户</button>`);ui.on("[data-submit]","click",()=>ui.state(ui.q("[data-name]").value.trim()?`submitted:${ui.q("[data-name]").value}`:"error:name-required"));ui.state("form:idle");}
function renderDenseForm(ctx){const ui=mount(ctx,`<div data-dense style="display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px"><label for="code">编码</label><input id="code" value="C001"><label for="short">简称</label><input id="short" value="海风"></div><button data-density>切换舒适间距</button>`);let dense=true;ui.on("[data-density]","click",()=>{dense=!dense;ui.q("[data-dense]").style.gap=dense?"4px":"16px";ui.state(`density:${dense?"dense":"comfortable"}`);});ui.state("density:dense");}
function renderDynamicForm(ctx){const ui=mount(ctx,`<form data-dynamic><label>名称 <input></label></form><button data-add-field>按条件添加税号字段</button>`);let added=false;ui.on("[data-add-field]","click",()=>{added=!added;ui.q("[data-tax]")?.remove();if(added){const label=document.createElement("label");label.dataset.tax="";label.textContent="税号 ";const input=document.createElement("input");input.setAttribute("aria-label","税号");label.append(input);ui.q("[data-dynamic]").append(label);}ui.state(`fields:${added?2:1}`);});ui.state("fields:1");}
function renderSchemaForm(ctx){const ui=mount(ctx,`<label>JSON Schema <textarea data-schema>{"type":"object","properties":{"name":{"type":"string"}}}</textarea></label><button data-validate>校验并渲染</button><div data-rendered></div>`);ui.on("[data-validate]","click",()=>{try{const schema=JSON.parse(ui.q("[data-schema]").value);if(schema.type!=="object"||!schema.properties)throw new Error("schema");ui.q("[data-rendered]").textContent=`已渲染字段：${Object.keys(schema.properties).join(", ")}`;ui.state("schema:valid");}catch{ui.q("[data-rendered]").textContent="Schema 无效，保留上次有效表单";ui.state("schema:invalid");}});ui.state("schema:unvalidated");}
function renderNestedForm(ctx){const ui=mount(ctx,`<label>客户名称 <input data-path="customer.name" value="海风"></label><fieldset><legend>地址</legend><label>城市 <input data-path="customer.address.city" value="上海"></label></fieldset><button data-path-save>更新嵌套路径</button>`);ui.on("[data-path-save]","click",()=>ui.state(`path:customer.address.city=${ui.q('[data-path="customer.address.city"]').value}`));ui.state("path:unchanged");}
function renderRepeatableForm(ctx){const ui=mount(ctx,`<div data-lines><div data-line><label>商品 <input value="键盘"></label><button data-remove type="button">删除</button></div></div><button data-add-line>添加明细行</button>`);ui.on("[data-add-line]","click",()=>{const div=document.createElement("div");div.dataset.line="";const input=document.createElement("input");input.setAttribute("aria-label","商品");input.value="显示器";div.append(input);ui.q("[data-lines]").append(div);ui.state(`lines:${ui.qa("[data-line]").length}`);});ui.state("lines:1");}
function renderMasterDetailForm(ctx){const ui=mount(ctx,`<label>订单客户 <input value="海风科技"></label><table><tbody><tr><td><input data-qty aria-label="数量" type="number" value="2"></td><td><input data-price aria-label="单价" type="number" value="50"></td></tr></tbody></table><button data-total>计算明细总额</button>`);ui.on("[data-total]","click",()=>ui.state(`total:${Number(ui.q("[data-qty]").value)*Number(ui.q("[data-price]").value)}`));ui.state("total:0");}
function renderWizardForm(ctx){const ui=mount(ctx,`<div data-step-content>第 1 步：基本信息</div><button data-prev disabled>上一步</button><button data-next>下一步</button>`);let step=1;const update=()=>{ui.q("[data-step-content]").textContent=`第 ${step} 步：${["","基本信息","联系信息","确认提交"][step]}`;ui.q("[data-prev]").disabled=step===1;ui.q("[data-next]").disabled=step===3;ui.state(`wizardStep:${step}`);};ui.on("[data-prev]","click",()=>{step=Math.max(1,step-1);update();});ui.on("[data-next]","click",()=>{step=Math.min(3,step+1);update();});update();}
function renderStepForm(ctx){const ui=mount(ctx,`<label>邮箱 <input data-email></label><button data-step-next>验证并继续</button><div data-step-error></div>`);ui.on("[data-step-next]","click",()=>{const valid=/^[^@]+@[^@]+$/.test(ui.q("[data-email]").value);ui.q("[data-step-error]").textContent=valid?"进入下一步":"邮箱格式错误";ui.state(valid?"step:2":"step:blocked");});ui.state("step:1");}
function renderTabForm(ctx){const ui=mount(ctx,`<div role="tablist"><button data-tab="base">基本信息</button><button data-tab="finance">财务信息</button></div><label>名称 <input data-dirty></label>`);let active="base",dirty=false;ui.on("[data-dirty]","input",()=>{dirty=true;ui.state(`tab:${active};dirty:true`);});ui.qa("[data-tab]").forEach((tab)=>ctx.on(tab,"click",()=>{active=tab.dataset.tab;ui.state(`tab:${active};dirty:${dirty}`);}));ui.state("tab:base;dirty:false");}
function renderAccordionForm(ctx){const ui=mount(ctx,`<button data-section aria-expanded="false">联系方式 <span data-badge>1 个错误</span></button><div data-fields hidden><label>手机号 <input data-phone></label></div>`);let open=false;ui.on("[data-section]","click",()=>{open=!open;ui.q("[data-fields]").hidden=!open;ui.q("[data-section]").setAttribute("aria-expanded",String(open));ui.state(`section:${open?"open":"closed"};errors:1`);});ui.state("section:closed;errors:1");}
function renderConditionalForm(ctx){const ui=mount(ctx,`<label><input type="checkbox" data-company> 企业客户</label><label data-tax hidden>税号 <input></label>`);ui.on("[data-company]","change",()=>{const show=ui.q("[data-company]").checked;ui.q("[data-tax]").hidden=!show;ui.state(`taxVisible:${show}`);});ui.state("taxVisible:false");}
function renderLinkedForm(ctx){const ui=mount(ctx,`<label>省份 <select data-province><option>上海</option><option>浙江</option></select></label><label>城市 <select data-city aria-label="城市"></select></label><button data-linked-toggle>切换到浙江</button>`);const update=()=>{const cities=ui.q("[data-province]").value==="上海"?["上海市"]:["杭州","宁波"];ui.q("[data-city]").replaceChildren(...cities.map((text)=>{const option=document.createElement("option");option.textContent=text;return option;}));ui.state(`cities:${cities.join(",")}`);};ui.on("[data-province]","change",update);ui.on("[data-linked-toggle]","click",()=>{ui.q("[data-province]").value=ui.q("[data-province]").value==="上海"?"浙江":"上海";update();});update();}
function renderCalculatedForm(ctx){const ui=mount(ctx,`<label>数量 <input data-qty type="number" value="2"></label><label>单价 <input data-price type="number" value="30"></label><output data-amount></output><button data-calc-next>数量 +1</button>`);const calc=()=>{const amount=Number(ui.q("[data-qty]").value)*Number(ui.q("[data-price]").value);ui.q("[data-amount]").textContent=`金额：${amount}`;ui.state(`amount:${amount}`);};ui.on("[data-qty]","input",calc);ui.on("[data-price]","input",calc);ui.on("[data-calc-next]","click",()=>{ui.q("[data-qty]").value=String(Number(ui.q("[data-qty]").value)+1);calc();});calc();}
function renderValidationForm(ctx){const ui=mount(ctx,`<label>开始日期 <input data-start type="date" value="2026-07-10"></label><label>结束日期 <input data-end type="date" value="2026-07-08"></label><button data-check>校验组合规则</button>`);ui.on("[data-check]","click",()=>{const valid=ui.q("[data-start]").value<=ui.q("[data-end]").value;ui.state(valid?"validation:pass":"validation:end-before-start");});ui.state("validation:unchecked");}

      child.forEach((item) => append(parent, item));
      return;
    }
    parent.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }

      if (/^on/i.test(name)) throw new Error("Inline event attributes are forbidden");

      else if (name === "text") node.textContent = value;
      else if (name === "dataset") Object.assign(node.dataset, value);
      else if (name === "style" && typeof value === "object") Object.assign(node.style, value);
      else if (name in node && !name.startsWith("aria-") && !name.startsWith("data-")) node[name] = value;
      else node.setAttribute(name, value === true ? "" : String(value));
    }
    children.forEach((child) => append(node, child));
    return node;
  }

    return el("button", {
      type: "button",
      className: options.className || "btn",
      disabled: options.disabled || false,
      "data-action": action,
      "aria-label": options.ariaLabel || label,
      title: options.title || "",
    }, label);
  }

  function field(label, control) {
    const id = control.id || "control-" + Math.random().toString(36).slice(2);
    control.id = id;
    if (!control.getAttribute("aria-label")) control.setAttribute("aria-label", label);
    return el("label", { className: "field", htmlFor: id }, el("span", { className: "field-label" }, label), control);
  }

  function setStatus(text, state = text) {
    setText(statusNode, text);
    statusNode.dataset.state = String(state);
  }

    setText(toastNode, text);
    toastNode.classList.add("show");
    const id = window.setTimeout(() => { if (active) toastNode.classList.remove("show"); }, 1400);
    timers.add(id);
  }
  function on(target, type, listener, options) {
    target.addEventListener(type, listener, options);
    cleanups.push(() => target.removeEventListener(type, listener, options));
    return listener;
  }
  function timeout(listener, delay) {
    const id = window.setTimeout(() => {
      timers.delete(id);
      if (active) listener();
    }, delay);
    timers.add(id);
    return id;
  }
  function cleanup() {
    active = false;
    cleanups.splice(0).reverse().forEach((dispose) => dispose());
    timers.forEach((id) => window.clearTimeout(id));
    timers.clear();
  }
  return { stage, el, button, field, setText, setStatus, toast, on, timeout, token, cleanup };
