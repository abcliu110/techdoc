    when:
      field: change_scope
      operator: intersects
      value: [auth, sensitive_data, api_consumer, public_api, schema]
    roles:
      - security_contract_reviewer
      - security_contract_adversary
  release_or_migration_or_public_api:
    when:
      any:
        - field: release_target
          operator: exists
          value: true
        - field: change_scope
          operator: intersects
          value: [migration, public_api]
    roles:
      - release_verifier
      - release_risk_adversary

