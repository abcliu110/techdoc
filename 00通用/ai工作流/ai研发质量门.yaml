  every_gate_requires:
    - command_ref
    - command_invoked
    - exit_code
    - pass_criteria_result
    - artifact_paths
    - executor_agent_id
  review_gate_requires:
    gate_ids_ref: review_gate_ids
    required_fields:
      - reviewer_agent_id
      - reviewer_role
      - review_revision
      - review_conclusion
      - independence_comparison
      - reviewer_is_independent
  independence_is_executor_computed: true
  independence_comparison_required_fields:
    - reviewer_agent_id
    - implementer_agent_id
    - test_author_agent_id
    - design_author_agent_id
    - architecture_author_agent_id
    - visual_author_agent_id
  visual_evidence_requires:
    - browser
    - viewport
    - baseline_revision
    - diff_threshold
    - screenshot
    - comparison_report
  approval_requires:
    - approver_agent_id
    - approver_role
    - approved_revision
    - approved_at
  unresolved_or_missing_evidence_action: blocked

release_requirements:
  authoritative_sequence: gate_sequences
  merge_rule: common, work_type, matching conditional_sequences, feature_closure and final are evaluated in that order; gates are deduplicated while preserving first occurrence; an inapplicable gate requires an explicit not_applicable artifact
  migration_or_public_api_change:
    - migration_rehearsed
    - rollback_verified
    - smoke_passed
  other_deployed_change:
    - smoke_passed
