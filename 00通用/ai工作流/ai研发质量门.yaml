conditional_sequences:
  api_consumer_change:
    when:
      field: change_scope
      operator: includes
      value: api_consumer
    append:
      - schema_validated
      - api_contract_tests_passed
  nfr_change:
    when:
      field: change_scope
      operator: intersects
      value: [performance, reliability, observability]
    append:
      - nfr_verified
  security_change:
    when:
      field: change_scope
      operator: intersects
      value: [auth, sensitive_data]
    append:
      - security_tests_passed
  security_or_contract_change:
    when:
      field: change_scope
      operator: intersects
      value: [auth, sensitive_data, api_consumer, public_api, schema]
    append:
      - security_contract_reviewed
      - security_contract_adversarial_reviewed
  data_or_public_api_change:
    when:
      field: change_scope
      operator: intersects
      value: [migration, public_api]
    append:
      - migration_rehearsed
      - rollback_verified
      - smoke_passed
      - release_reviewed
      - release_adversarial_reviewed
  any_deployed_change:
    when:
      field: release_target
      operator: exists
      value: true
    append:
      - smoke_passed
      - release_reviewed
      - release_adversarial_reviewed

