apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-data
  namespace: nacos
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: nacos
  labels:
    app: nacos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: nacos
          image: nacos/nacos-server:v3.2.3-slim
          imagePullPolicy: IfNotPresent
          ports:
            - name: console
              containerPort: 8080
            - name: http
              containerPort: 8848
            - name: grpc
              containerPort: 9848
            - name: grpc-tls
              containerPort: 9849
          env:
            - name: MODE
              value: standalone
            - name: NACOS_APPLICATION_PORT
              value: "8848"
            - name: NACOS_CONSOLE_PORT
              value: "8080"
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nacos-auth
                  key: NACOS_AUTH_TOKEN
            - name: NACOS_AUTH_IDENTITY_KEY
              valueFrom:
                secretKeyRef:
                  name: nacos-auth
                  key: NACOS_AUTH_IDENTITY_KEY
            - name: NACOS_AUTH_IDENTITY_VALUE
              valueFrom:
                secretKeyRef:
                  name: nacos-auth
                  key: NACOS_AUTH_IDENTITY_VALUE
            - name: JVM_XMS
              value: 128m
            - name: JVM_XMX
              value: 768m
            - name: JVM_XMN
              value: 128m
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: nacos-data
              mountPath: /home/nacos/data
      volumes:
        - name: nacos-data
          persistentVolumeClaim:
            claimName: nacos-data
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: nacos
  labels:
    app: nacos
spec:
  type: ClusterIP
  selector:
    app: nacos
  ports:
    - name: console
      port: 8080
      targetPort: console
    - name: http
      port: 8848
      targetPort: http
    - name: grpc
      port: 9848
      targetPort: grpc
    - name: grpc-tls
      port: 9849
      targetPort: grpc-tls
---
apiVersion: v1
kind: Service
metadata:
  name: nacos-nodeport
  namespace: nacos
  labels:
    app: nacos
spec:
  type: NodePort
  selector:
    app: nacos
  ports:
    - name: console
      port: 8080
      targetPort: console
      nodePort: 30086
    - name: http
      port: 8848
      targetPort: http
      nodePort: 30089
    - name: grpc
      port: 9848
      targetPort: grpc
      nodePort: 31089
    - name: grpc-tls
      port: 9849
      targetPort: grpc-tls
      nodePort: 31090
