upstream emqx_ws {
    ip_hash;
    server emqx54.lgy.svc.cluster.local.:8083 max_fails=0 weight=1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_buffers 4 16k;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /pictures/ {
        proxy_pass https://chain-pictures-01-1251303505.cos-website.ap-guangzhou.myqcloud.com/;
        proxy_set_header Host chain-pictures-01-1251303505.cos-website.ap-guangzhou.myqcloud.com;
        proxy_ssl_server_name on;
    }

    location /mqtt {
        proxy_pass http://emqx_ws/mqtt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60000s;
        proxy_send_timeout 60000s;
    }

    location /api/ {
        proxy_pass http://gateway.lgy.svc.cluster.local.:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /spapi/ {
        proxy_pass http://gateway.lgy.svc.cluster.local.:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
}
