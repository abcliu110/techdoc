apiVersion: v1
kind: ResourceQuota
metadata:
  name: jenkins-build-memory-budget
  namespace: jenkins
spec:
  hard:
    requests.memory: 4Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: jenkins-agent-defaults
  namespace: jenkins
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
