apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx
  labels:
    app: emqx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emqx
  template:
    metadata:
      labels:
        app: emqx
    spec:
      containers:
      - name: emqx
        image: 192.168.253.128:30083/dockerhub/emqx/emqx:5.4.1
        imagePullPolicy: IfNotPresent
        env:
        - name: EMQX_NAME
          value: emqx
        - name: EMQX_HOST
          value: emqx
        ports:
        - name: mqtt
          containerPort: 1883
        - name: dashboard
          containerPort: 18083
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 400m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: mqtt
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: mqtt
          initialDelaySeconds: 60
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: emqx
spec:
  selector:
    app: emqx
  ports:
  - name: mqtt
    port: 1883
    targetPort: mqtt
  - name: dashboard
    port: 18083
    targetPort: dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: emqx54
spec:
  selector:
    app: emqx
  ports:
  - name: websocket
    port: 8083
    targetPort: 8083
