apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-nameserver
  labels:
    app: rocketmq-nameserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-nameserver
  template:
    metadata:
      labels:
        app: rocketmq-nameserver
    spec:
      containers:
      - name: nameserver
        image: 192.168.253.128:30083/dockerhub/apache/rocketmq:5.1.0
        imagePullPolicy: IfNotPresent
        command: ["sh", "mqnamesrv"]
        env:
        - name: JAVA_OPT_EXT
          value: -Xms128m -Xmx128m
        ports:
        - name: nameserver
          containerPort: 9876
        resources:
          requests:
            cpu: 75m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: nameserver
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: nameserver
          initialDelaySeconds: 45
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-nameserver
spec:
  selector:
    app: rocketmq-nameserver
  ports:
  - name: nameserver
    port: 9876
    targetPort: nameserver
