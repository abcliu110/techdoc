apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    upstream emqx_ws {
      ip_hash;
      server emqx54.lgy.svc.cluster.local.:8083 max_fails=0 weight=1;
    }

    server {
      listen 80;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      gzip on;
      gzip_min_length 1024;
      gzip_buffers 4 16k;
      gzip_types text/plain text/css application/javascript application/json
                 application/xml image/svg+xml;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /pictures/ {
        proxy_pass https://chain-pictures-01-1251303505.cos-website.ap-guangzhou.myqcloud.com/;
        proxy_set_header Host chain-pictures-01-1251303505.cos-website.ap-guangzhou.myqcloud.com;
        proxy_ssl_server_name on;
      }

      location /mqtt {
        proxy_pass http://emqx_ws/mqtt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60000s;
        proxy_send_timeout 60000s;
      }

      location /api/ {
        proxy_pass http://gateway.lgy.svc.cluster.local.:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /spapi/ {
        proxy_pass http://gateway.lgy.svc.cluster.local.:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      error_page 500 502 503 504 /50x.html;
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-static-bootstrap
data:
  index.html: |
    <!doctype html>
    <html><head><meta charset="utf-8"><title>lgy nginx</title></head><body><h1>nginx is running</h1></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      initContainers:
      - name: initialize-static-content
        image: 192.168.253.128:30083/dockerhub/library/nginx:1.25.3
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - |
          chmod 755 /static
          if [ ! -e /static/index.html ]; then
            cp /bootstrap/index.html /static/index.html
          fi
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: nginx-static
          mountPath: /static
        - name: nginx-static-bootstrap
          mountPath: /bootstrap
          readOnly: true
      containers:
      - name: nginx
        image: 192.168.253.128:30083/dockerhub/library/nginx:1.25.3
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 150m
            memory: 128Mi
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: nginx-static
          mountPath: /usr/share/nginx/html
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: nginx-static-bootstrap
        configMap:
          name: nginx-static-bootstrap
      - name: nginx-static
        hostPath:
          path: /home/lgy/nginx-static
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30090
