apiVersion: apps/v1
kind: Deployment
metadata:
  name: nms4cloud-mq
  labels:
    app: nms4cloud-mq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nms4cloud-mq
  template:
    metadata:
      labels:
        app: nms4cloud-mq
    spec:
      containers:
      - name: nms4cloud-mq
        image: 192.168.253.128:30083/library/nms4cloud-mq:c5b4beb12158-11
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: nacos-client
        env:
        - name: JAVA_TOOL_OPTIONS
          value: -Xms128m -Xmx512m -XX:MaxMetaspaceSize=256m
        ports:
        - name: http
          containerPort: 18120
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1280Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nms4cloud-mq
spec:
  selector:
    app: nms4cloud-mq
  ports:
  - name: http
    port: 18120
    targetPort: http
