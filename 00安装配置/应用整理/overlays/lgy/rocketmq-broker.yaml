apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-broker
  labels:
    app: rocketmq-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-broker
  template:
    metadata:
      labels:
        app: rocketmq-broker
    spec:
      containers:
      - name: broker
        image: 192.168.253.128:30083/dockerhub/apache/rocketmq:5.1.0
        imagePullPolicy: IfNotPresent
        command: ["sh", "mqbroker", "-n", "rocketmq-nameserver:9876"]
        env:
        - name: JAVA_OPT_EXT
          value: -Xms256m -Xmx256m -XX:MaxDirectMemorySize=128m
        ports:
        - name: vip
          containerPort: 10909
        - name: main
          containerPort: 10911
        resources:
          requests:
            cpu: 150m
            memory: 384Mi
          limits:
            cpu: 400m
            memory: 640Mi
        readinessProbe:
          tcpSocket:
            port: main
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: main
          initialDelaySeconds: 75
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-broker
spec:
  selector:
    app: rocketmq-broker
  ports:
  - name: vip
    port: 10909
    targetPort: vip
  - name: main
    port: 10911
    targetPort: main
