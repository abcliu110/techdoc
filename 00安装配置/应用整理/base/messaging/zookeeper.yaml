apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: nms4cloud
  labels:
    k8s-app: zookeeper
    qcloud-app: zookeeper
spec:
  selector:
    matchLabels:
      k8s-app: zookeeper
      qcloud-app: zookeeper
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      namespace: nms4cloud
      labels:
        k8s-app: zookeeper
        qcloud-app: zookeeper
    spec:
      containers:
      - image: 10.43.92.252/library/zookeeper:3.9.3
        imagePullPolicy: Always
        name: zookeeper
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 384Mi
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /datalog
          name: datalog
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: zookeeper-data
      - name: datalog
        persistentVolumeClaim:
          claimName: zookeeper-datalog
