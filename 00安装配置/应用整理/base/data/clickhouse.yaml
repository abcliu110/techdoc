apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: nms4cloud
  labels: {}
spec:
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      namespace: nms4cloud
      labels:
        app: clickhouse
    spec:
      containers:
      - env:
        - name: CLICKHOUSE_DB
          value: dbclick
        - name: CLICKHOUSE_USER
          value: default
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-secrets
              key: CLICKHOUSE_PASSWORD
        image: clickhouse/clickhouse-server:23.3
        imagePullPolicy: IfNotPresent
        name: clickhouse
        ports:
        - containerPort: 8123
          name: http
          protocol: TCP
        - containerPort: 9000
          name: native
          protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - mountPath: /var/lib/clickhouse
          name: clickhouse-storage
      volumes:
      - name: clickhouse-storage
        persistentVolumeClaim:
          claimName: clickhouse-pvc
