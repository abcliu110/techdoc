apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nms4cloud
  labels: {}
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - command:
        - redis-server
        - --appendonly
        - 'yes'
        - --requirepass
        - '123456'
        - --maxmemory
        - 1gb
        - --maxmemory-policy
        - allkeys-lru
        image: redis:7.0
        imagePullPolicy: IfNotPresent
        name: redis
        ports:
        - containerPort: 6379
          hostPort: 6379
          name: redis
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 384Mi
