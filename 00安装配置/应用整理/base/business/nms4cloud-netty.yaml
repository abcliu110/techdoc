apiVersion: apps/v1
kind: Deployment
metadata:
  name: nms4cloud-netty
  namespace: nms4cloud
  labels:
    app: nms4cloud-netty
spec:
  selector:
    matchLabels:
      app: nms4cloud-netty
  template:
    metadata:
      namespace: nms4cloud
      labels:
        app: nms4cloud-netty
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: nacos
        image: ccr.ccs.tencentyun.com/lemontree/ktv:nms4cloud_netty_latest
        imagePullPolicy: Always
        name: nms4cloud-netty
        ports:
        - containerPort: 18190
          name: 18190tcp
          protocol: TCP
        - containerPort: 9999
          name: 9999tcp
          protocol: TCP
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 750m
            memory: 768Mi
      imagePullSecrets:
      - name: tencent-ccr-secret
      initContainers:
      - command:
        - sh
        - -c
        - "echo \"Waiting for Nacos to be ready...\"\nuntil curl -sf http://nacos:8848/nacos/v1/console/health/readiness;\
          \ do\n  echo \"Nacos is not ready yet, retrying in 5 seconds...\"\n  sleep\
          \ 5\ndone\necho \"Nacos is ready!\"\n"
        image: curlimages/curl:7.85.0
        imagePullPolicy: IfNotPresent
        name: wait-for-nacos
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
