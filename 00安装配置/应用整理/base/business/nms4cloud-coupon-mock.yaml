apiVersion: apps/v1
kind: Deployment
metadata:
  name: nms4cloud-coupon-mock
  namespace: nms4cloud
  labels:
    app: nms4cloud-coupon-mock
spec:
  replicas: 0
  selector:
    matchLabels:
      app: nms4cloud-coupon-mock
  template:
    metadata:
      namespace: nms4cloud
      labels:
        app: nms4cloud-coupon-mock
    spec:
      containers:
      - env:
        - name: TZ
          value: Asia/Shanghai
        - name: JAVA_OPTS
          value: -Xms128m -Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
        image: 10.43.92.252/library/nms4cloud-coupon-mock:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 60
          periodSeconds: 30
          successThreshold: 1
          tcpSocket:
            port: 18080
          timeoutSeconds: 1
        name: nms4cloud-coupon-mock
        ports:
        - containerPort: 18080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 18080
          timeoutSeconds: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi
        startupProbe:
          failureThreshold: 12
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 18080
          timeoutSeconds: 1
