apiVersion: apps/v1
kind: Deployment
metadata:
  name: nms4cloud-pos11report
  namespace: nms4cloud
  labels:
    app: nms4cloud-pos11report
spec:
  replicas: 0
  selector:
    matchLabels:
      app: nms4cloud-pos11report
  template:
    metadata:
      labels:
        app: nms4cloud-pos11report
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: nacos
        image: 10.43.92.252/library/nms4cloud-pos11report:latest
        imagePullPolicy: Always
        name: nms4cloud-pos11report
        ports:
        - containerPort: 9190
          name: 9190tcp
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi
      imagePullSecrets:
      - name: tencent-ccr-secret
