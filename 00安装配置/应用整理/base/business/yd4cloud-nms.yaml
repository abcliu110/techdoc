apiVersion: apps/v1
kind: Deployment
metadata:
  name: yd4cloud-nms
  namespace: nms4cloud
  labels:
    app: yd4cloud-nms
spec:
  replicas: 0
  selector:
    matchLabels:
      app: yd4cloud-nms
  template:
    metadata:
      namespace: nms4cloud
      labels:
        app: yd4cloud-nms
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: nacos
        image: ccr.ccs.tencentyun.com/lemontree/ktv:yd4cloud_nms_latest
        imagePullPolicy: Always
        name: yd4cloud-nms
        ports:
        - containerPort: 9999
          name: 9999tcp
          protocol: TCP
        resources:
          requests:
            cpu: 150m
            memory: 320Mi
          limits:
            cpu: 750m
            memory: 1Gi
      imagePullSecrets:
      - name: tencent-ccr-secret
      initContainers:
      - command:
        - sh
        - -c
        - "echo \"Waiting for Nacos to be ready...\"\nuntil curl -sf http://nacos:8848/nacos/v1/console/health/readiness;\
          \ do\n  echo \"Nacos is not ready yet, retrying in 5 seconds...\"\n  sleep\
          \ 5\ndone\necho \"Nacos is ready!\"\n"
        image: curlimages/curl:7.85.0
        imagePullPolicy: IfNotPresent
        name: wait-for-nacos
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
