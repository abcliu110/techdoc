


spring:
  data:
    redis:
      host: redis.lgy.svc.cluster.local.
      port: 6379
      database: 0
      password: __K3S_REDIS_PASSWORD__
      lettuce:
        pool:
          max-active: -1
          min-idle: 5
          max-idle: 10
          max-wait: 5000
  mail:
    host: smtp.126.com #发送邮件服务器
    #    username: xx@126.com #发送邮件的邮箱地址
    #    password: xxx #客户端授权码，不是邮箱密码,网易的是自己设置的
    #    from: xxx@126.com # 发送邮件的地址，和上面username一致
    properties.mail.smtp.starttls.enable: true
    properties.mail.smtp.starttls.required: true
    properties.mail.smtp.ssl.enable: true
    default-encoding: utf-8



rocketmq:
  config:
  name-server: rocketmq-nameserver.lgy.svc.cluster.local.:9876
  producer:
    group: ${spring.application.name}




