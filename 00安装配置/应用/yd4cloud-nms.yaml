              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: tencent-ccr-secret
      initContainers:
        - command:
            - sh
            - '-c'
            - >
              echo "Waiting for Nacos to be ready..."

              until curl -sf
              http://nacos:8848/nacos/v1/console/health/readiness; do
                echo "Nacos is not ready yet, retrying in 5 seconds..."
                sleep 5
              done

              echo "Nacos is ready!"
