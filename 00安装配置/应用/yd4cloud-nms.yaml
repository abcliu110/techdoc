    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: nacos
          image: ccr.ccs.tencentyun.com/lemontree/ktv:yd4cloud_nms_latest
          imagePullPolicy: Always
          name: yd4cloud-nms
          ports:
            - containerPort: 9999
