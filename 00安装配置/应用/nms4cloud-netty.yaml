spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: nms4cloud-netty
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nms4cloud-netty
      namespace: nms4cloud
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: nacos
          image: ccr.ccs.tencentyun.com/lemontree/ktv:nms4cloud_netty_latest
          imagePullPolicy: Always
          name: nms4cloud-netty
          ports:
            - containerPort: 18190
              name: 18190tcp
              protocol: TCP
            - containerPort: 9999
              name: 9999tcp
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: tencent-ccr-secret
      initContainers:
        - command:
            - sh
            - '-c'
            - >
              echo "Waiting for Nacos to be ready..."

              until curl -sf
              http://nacos:8848/nacos/v1/console/health/readiness; do
                echo "Nacos is not ready yet, retrying in 5 seconds..."
                sleep 5
              done

              echo "Nacos is ready!"
          image: curlimages/curl:7.85.0
          imagePullPolicy: IfNotPresent
          name: wait-for-nacos
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
