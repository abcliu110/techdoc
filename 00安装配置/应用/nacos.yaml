  name: nacos
  namespace: nms4cloud
  resourceVersion: '27781378'
  uid: 64d6c37b-0f6b-4085-b3d9-5199ddc0a0f6
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: nacos
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        cattle.io/timestamp: '2026-06-22T02:46:33Z'
      labels:
        app: nacos
    spec:
      containers:
        - env:
            - name: MODE
              value: standalone
            - name: PREFER_HOST_MODE
              value: hostname
            - name: SPRING_DATASOURCE_PLATFORM
              value: mysql
            - name: MYSQL_SERVICE_HOST
              value: mysql
            - name: MYSQL_SERVICE_PORT
              value: '3306'
            - name: MYSQL_SERVICE_DB_NAME
              value: nacos
            - name: MYSQL_SERVICE_USER
              value: root
            - name: MYSQL_SERVICE_PASSWORD
              value: st11338
            - name: MYSQL_SERVICE_JDBC_PARAM
              value: >-
                characterEncoding=utf8&connectTimeout=3000&socketTimeout=10000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
            - name: NACOS_AUTH_IDENTITY_KEY
              value: nacos_server
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: nacos_server
            - name: NACOS_AUTH_TOKEN
              value: U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
            - name: JVM_XMS
              value: 2g
            - name: JVM_XMX
              value: 2g
            - name: JVM_XMN
              value: 1g
            - name: JVM_MS
              value: 128m
            - name: JVM_MMS
              value: 320m
          image: nacos/nacos-server:v2.2.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /nacos/index.html
              port: 8848
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 1
          name: nacos
          ports:
            - containerPort: 8848
              hostPort: 8848
              name: client
              protocol: TCP
            - containerPort: 9848
              hostPort: 9848
              name: client-rpc
              protocol: TCP
            - containerPort: 9849
              hostPort: 9849
              name: raft-rpc
              protocol: TCP
            - containerPort: 7848
              hostPort: 7848
              name: old-raft-rpc
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /nacos/index.html
              port: 8848
              scheme: HTTP
            initialDelaySeconds: 40
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: '2'
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 2Gi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /nacos/index.html
              port: 8848
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - sh
            - '-c'
            - >
              echo "等待 MySQL 完全就绪..."

              until mysql -h mysql -P 3306 -u root -e "SELECT 1" > /dev/null
              2>&1; do
                echo "MySQL 尚未就绪，等待 5 秒后重试..."
                sleep 5
              done

              echo "MySQL 已完全就绪"


              echo "验证 nacos 数据库是否存在..."

              until mysql -h mysql -P 3306 -u root -e "USE nacos; SELECT
              count(*) FROM config_info;" > /dev/null 2>&1; do
                echo "警告: nacos 数据库不存在或表结构未初始化，请执行 SQL 脚本！"
                echo "等待 10 秒后重试..."
                sleep 10
              done

              echo "nacos 数据库验证成功"
          env:
            - name: MYSQL_PWD
              value: st11338
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          name: wait-for-mysql
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
